[project]
name = "ghoshell-moss"
version = "0.1.0b3"
description = "LLM-oriented operating system with streaming interpreting shell, and Intelligent Ghost inside it"
authors = [{ name = "thirdgerb" }, { name = "17wang" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anyio>=4.12.1",
    "numpy>=2.0.0",
    "ghoshell-common>=0.5.0",
    "ghoshell-container>=0.3.1",
    "janus>=2.0.0",
    "jsonargparse>=4.48.0",
    "orjson>=3.11.8",
    "pillow>=12.1.0",
    "python-dateutil>=2.9.0.post0",
    "python-ulid>=3.1.0",
    "regex>=2024.0.0",
    "pathspec>=0.12.0",
    "python-frontmatter>=1.1.0",
    "psutil>=7.2.1",
    "aiofiles>=25.1.0",
]

[project.optional-dependencies]
# Core layers — each includes all deps of the layer below
cli = [
    "typer>=0.24.1",
    "rich", # was implicit via typer
    "python-dotenv>=1.0.0", # was in [matrix], needed by Project.bootstrap()
]
matrix = [
    "typer>=0.24.1",
    "rich",
    "python-dotenv>=1.0.0",
    "eclipse-zenoh>=1.8.0", # matrix 唯一新增
]
host = [
    "typer>=0.24.1",
    "rich",
    "httpx>=0.28.0", # launcher outbound HTTP (web 表面)
    "websockets>=15.0.1", # launcher mux WS 下行
    "python-dotenv>=1.0.0",
    "eclipse-zenoh>=1.8.0",
    "prompt-toolkit>=3.0.52",
    "pexpect>=4.9.0",
    "miniaudio>=0.67",
    "loadenv>=0.1.1",
    "mcp>=2.0.0",
    "uvicorn>=0.37.0",
    "pydantic-ai-slim[anthropic,openai]>=1.90.0",
    "anthropic>=0.84.0",
    "pywebrtc-audio>=0.2.0",
]
ghost = [
    "pydantic-ai-slim[anthropic,openai]>=1.90.0",
    "anthropic>=0.84.0",
]

# Bridges — optional transport backends
zmq = ["zmq>=0.0.0", "aiozmq>=1.0.0"]
redis = ["fakeredis>=2.32.1", "redis>=7.0.1"]
mcp = ["mcp>=2.0.0", "uvicorn>=0.37.0"]


[project.scripts]
moss = "ghoshell_moss.cli:main_entry"
moss-shell = 'ghoshell_moss.cli.moss_debug_repl:moss_shell_main'
moss-ghost = 'ghoshell_moss.cli.ghost_run:ghost_run_main'

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["test_*"]

# Data only: python modules ship because they are modules. Everything a package reads at
# runtime — templates, seeds, prompts, docs the CLI prints — has to be named here, because
# setuptools ships exactly what the config says and nothing more.
[tool.setuptools.package-data]
"ghoshell_moss" = ["README.md"]
"ghoshell_moss.anchor" = ["SPECIFICATION.md"]
"ghoshell_moss.ground" = ["SPECIFICATION.md"]
"ghoshell_moss.core" = ["README.md"]
"ghoshell_moss.core.blueprint" = ["CLAUDE.md"]
"ghoshell_moss.core.codex" = ["_features_stubs/**/*.md", "README.md"]
"ghoshell_moss.core.ctml" = ["prompts/**/*.md", "README.md"]
"ghoshell_moss.core.speech" = ["README.md"]
"ghoshell_moss.core.file_editor" = ["_openhands/UPSTREAM.md", "_openhands/LICENSE", "README.md"]
"ghoshell_moss.cli" = ["start.md", "CLAUDE.md", "docs/**/*.md", "skills/**/*.md"]
"ghoshell_moss.stubs" = [
    "**/*.md",
    "**/*.yml",
    "**/*.yaml",
    "**/*.json",
    "**/*.jsonl",
    "**/*.toml",
    "**/*.ini",
    "**/*.txt",
    "**/.env.example",
    "**/.gitignore",
    "**/.gitkeep",
]
"ghoshell_moss.ghosts.dolores" = [
    "stubs/**/*.md",
    "stubs/**/*.yml",
    "stubs/**/*.py",
    "stubs/.dolores.yml",
    "stubs/.env.example",
    "stubs/.gitignore",
    "stubs/.memento/ego/branches/GROUND.md",
    "stubs/.memento/ego/commits/GROUND.md",
    "stubs/.memento/ego/hooks/on_commit.py",
    "dsh_plugin/**/*",
    "dsh_stubs/**/*.ts",
    "dsh_stubs/**/*.yml",
    "dsh_stubs/**/*.yaml",
    "dsh_stubs/**/*.json",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.1.0",
    "anyio>=4.10.0",
    "mcp>=2.0.0",
    "fastapi>=0.121.1",
    "uvicorn>=0.37.0",
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "pre-commit>=4.6.0",
]
