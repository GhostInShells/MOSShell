# Dolores note preset — 旁路 commit note 生产专用的最小 composition.
#
# 设计: commit 的慢腿 (note 摘要) 只读对话、产一段文本, 不需要任何工具. 因此这里**不挂任何
# tool row** —— read-only by construction, 比在 ego preset 上 tools.restrict({deny}) 逐个列
# 写工具名更稳 (restrict 遇见未知工具名会抛). 只保留 agent-instructions 作 system prompt 容器.
#
# 用法见 dsh_plugin 的 DOLORES_NOTE_RUN 路由: ctx.agents.create({seed, agentPreset:'dolores-note'}).

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
