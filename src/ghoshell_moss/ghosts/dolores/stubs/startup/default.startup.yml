description: Boot — activate session, warm up before the first interaction
created_at: "2026-09-25"
instruction: |
  Boot signal — you are online but the human has not spoken yet. Do not greet
  or reply. Take one round to warm up: get your bearings however you see fit
  — a light look around is enough to bring the loop alive. Your orientation
  frame is already loaded and will re-assert itself as context fills in; no
  need to force answers now.

# The frame block is injected as ghost.frame's init_frame — a named notice
# fragment that re-asserts itself on the refresh cadence. Edit the questions
# to fit this mode's opening self-model, or drop the whole block to boot
# without a seed.
frame:
  label: orientation
  description: Reconstruct the situation from context. Extraction questions only; nothing that cannot be answered from context.
  questions:
    - "What environment am I in? What is not in the prompt but I must keep track of?"
    - "Who am I talking to?"
    - "What style does the user prefer? What of that is not in the prompt?"
    - "What am I doing right now?"
    - "What information matters here — what must I not forget even when the context is compacted?"
