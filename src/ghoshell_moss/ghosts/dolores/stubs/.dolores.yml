# Dolores ghost home 实例配置 — stubs 同步时复制到 ghost_home/.dolores.yml.
# version 由 DoloresMeta.VERSION 驱动 (sync 时写入, 手动改无效).

dirs:
  - .dsh      # DSH_HOME: dsh 推理中枢的运行时领地 (profiles/settings/sessions)
  - skills    # Claude-compatible skills

dsh:
  binary: dsh
  profile: web
  port: 3083
  # home 省略 → 默认 ghost_home/.dsh

memento:
  # 距上次 commit 的窗口增量 token: 达 warn_tokens 提醒一次, 达 force_tokens 强制建锚点.
  # 调试锚点数据时可临时置 force_tokens=0 (每 turn commit) —— 那只是本地临时开关, 不随仓库发布.
  force_tokens: 100000
  warn_tokens: 50000
  # 启动补漏: 回扫尾部 N 条 commit, 给上次运行没产出 note 的补跑旁路 (主要是关停时被取消的那些).
  # 0 = 关掉补漏.
  resume_tail: 5
