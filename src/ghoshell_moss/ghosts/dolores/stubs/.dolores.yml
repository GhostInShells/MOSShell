# Dolores ghost home 实例配置 — stubs 同步时复制到 ghost_home/.dolores.yml.
# version 由 DoloresMeta.VERSION 驱动 (sync 时写入, 手动改无效).

dirs:
  - .dsh      # DSH_HOME: dsh 推理中枢的运行时领地 (profiles/settings/sessions)
  - skills    # Claude-compatible skills

dsh:
  # dsh 可执行路径不在这里配 — 属启动期配置, 归 ghost_home/.env 的 DSH_BINARY (见 .env.example).
  profile: web
  port: 3083
  # home 省略 → 默认 ghost_home/.dsh

memento:
  # 距上次 commit 的窗口增量 token: 达 warn_tokens 提醒一次, 达 force_tokens 强制建锚点.
  # 调试锚点数据时可临时置 force_tokens=0 (每 turn commit) —— 那只是本地临时开关, 不随仓库发布.
  force_tokens: 100000
  warn_tokens: 50000
  # 上下文**绝对**窗口上限 (最近一次调用的 prompt 大小). 达此值且上一 run 有效时, 下一个 run
  # 启动前原地 compact (surface replace 成 memory 视图), 保留最新一个 commit 的 span 作原文 tail.
  # deepseek-flash 窗口 1M, 取 ~60% 留输出/思维余量. 0 = 关闭自动 compact.
  compact_tokens: 600000
  # note 请求的输出上限 (thinking + title + body). 旁路用 low 思考档 — off 会换一条前缀缓存族.
  note_max_tokens: 4096
  # note 正文预算 —— 写进 commit note 规则, 给模型看的约束. title 另计.
  note_body_tokens: 1500
