<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>swarm · 04 · 戴森球（时间铺法）</title>
<style>
  :root{
    --bg:#03060d; --panel:#070d17; --ink:#dfe8ff; --ink2:#8fa4cf; --ink3:#40507a;
    --cool:#79c8ff; --warm:#ffb454; --ok:#6fe3ac; --bad:#ff6b8a; --star:#fff2cf;
    --line:#1a2440;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  body[data-theme="blueprint"]{
    --bg:#061323; --panel:#0a1c30; --ink:#d8f2ff; --ink2:#7fb2d0; --ink3:#2f5e7d;
    --cool:#4fd2ff; --warm:#ffd166; --ok:#5ee0a8; --bad:#ff7a8a; --star:#eaf8ff; --line:#123a55;
  }
  body[data-theme="ember"]{
    --bg:#0b0605; --panel:#150d0a; --ink:#ffe9d6; --ink2:#c9a189; --ink3:#6b4636;
    --cool:#ffb454; --warm:#ff7a45; --ok:#8fd694; --bad:#ff5b6e; --star:#fff0c9; --line:#2e1a12;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
    font:13px/1.6 ui-sans-serif,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased}
  svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  #grain{position:absolute;inset:-10%;pointer-events:none;opacity:.02;
    background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px}
  #vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(115% 85% at 50% 48%,transparent 50%,rgba(0,0,0,.72) 100%)}

  .ring{fill:none;stroke:var(--line);stroke-width:1}
  .ring.front{stroke:var(--cool);opacity:.18}
  .panel{stroke-width:1}
  .cell{fill:none;stroke:var(--line);stroke-width:1}
  .cell.feat{stroke-width:1.2;transition:stroke-width .15s,fill-opacity .15s}
  .cell.hot{stroke-width:2.2;stroke-opacity:1}
  .cell.feat.building{stroke:var(--warm);fill:var(--warm)}
  .cell.feat.done{stroke:var(--ok);fill:var(--ok);stroke-width:2;
    filter:drop-shadow(0 0 4px var(--ok))}
  .cell.feat.draft{stroke:var(--ink3);fill:var(--ink3)}
  .progring{stroke:var(--ink2)}
  .planet{fill:#081020;stroke:var(--cool)}
  .planetRing{fill:none;stroke:var(--cool)}
  .orbit{fill:none;stroke:var(--line)}
  .craft{fill:var(--warm);color:var(--warm)}
  .lbl{fill:var(--ink);font-size:11px}
  .lbl.sm{fill:var(--ink2);font-size:9.5px;letter-spacing:.06em}
  .lbl.xs{fill:var(--ink3);font-size:9px;letter-spacing:.16em}

  #hud{position:absolute;left:40px;top:34px;pointer-events:none}
  #hud .k{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink3)}
  #hud .t{font-size:14px;margin-top:6px}
  #hud .s{font-size:10px;margin-top:8px;color:var(--ink2);letter-spacing:.05em}

  #legend{position:absolute;left:40px;bottom:30px;font-size:10px;color:var(--ink3);line-height:1.9;
    letter-spacing:.04em}
  #legend b{color:var(--ink2);font-weight:400}
  #themes{position:absolute;right:40px;bottom:30px;display:flex;gap:6px}
  #themes button{font:9.5px/1 ui-monospace,monospace;letter-spacing:.1em;color:var(--ink2);
    background:transparent;border:1px solid var(--line);border-radius:4px;padding:5px 9px;cursor:pointer}
  #themes button[aria-pressed="true"]{color:var(--cool);border-color:var(--cool)}
  #themes button:hover{color:var(--ink)}
</style>
</head>
<body data-theme="deep">
<svg id="scene" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <g id="cam" style="transition:transform 900ms cubic-bezier(.22,1,.36,1)">
    <g id="stars"></g>
    <g id="orbitPath"></g>
    <g id="shell"></g>
    <g id="star"></g>
    <g id="planet"></g>
    <g id="crafts"></g>
    <g id="tip" style="opacity:0;transition:opacity .2s"></g>
    <path id="arc" fill="none" stroke-linecap="round" opacity=".0"></path>
  </g>
  <g id="ruler"></g>
</svg>
<div id="grain"></div><div id="vig"></div>
<div id="hud">
  <div class="k">dyson · features</div>
  <div class="t" id="hud-title">MOSShell</div>
  <div class="s" id="hud-sub"></div>
</div>
<div id="legend">
  <div><b>恒星</b> = workspace（被建设的那颗）</div>
  <div><b>球壳面板</b> = 一个 feature / workstream</div>
  <div><b>施工行星</b> = swarm 的 hive</div>
  <div><b>飞行的光点</b> = agent 带着 skill 去施工</div>
</div>
<div id="themes">
  <button data-layout="feature" aria-pressed="true">按 feature</button>
  <button data-layout="time">按时间</button>
  <span style="width:10px"></span>
  <button data-theme="deep" aria-pressed="true">深空</button>
  <button data-theme="blueprint">蓝图</button>
  <button data-theme="ember">余烬</button>
</div>

<script src="dyson-data.js"></script>
<script>
/* ============================================================
   投影：一个被压扁的球（正交 + 倾斜），面板按 Fibonacci 球面铺开
   ============================================================ */
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("scene");
const el = (t,a={},txt)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);
  if(txt!=null)n.textContent=txt;return n;};
const g = (id)=>{const n=el("g");document.getElementById(id).appendChild(n);return n;};

const CX = 800, CY = 470, R = 340;
const TILT = 24 * Math.PI / 180;

function project(lat, lon, rad = R){
  const cl = Math.cos(lat);
  const x3 = cl * Math.cos(lon), y3 = Math.sin(lat), z3 = cl * Math.sin(lon);
  const y2 = y3 * Math.cos(TILT) - z3 * Math.sin(TILT);
  const z2 = y3 * Math.sin(TILT) + z3 * Math.cos(TILT);
  return { x: CX + rad * x3, y: CY - rad * y2, z: z2 };
}

/* ---------- 星尘 ---------- */
const rnd = (s=>()=>(s=s*1664525+1013904223>>>0)/4294967296)(20261028);
const starsG = document.getElementById("stars");
for (let i=0;i<260;i++){
  starsG.appendChild(el("circle",{cx:(rnd()*1600).toFixed(1),cy:(rnd()*1000).toFixed(1),
    r:(rnd()*1.1+.2).toFixed(2),fill:"#c9d8ff",opacity:(.05+rnd()*.18).toFixed(3)}));
}

/* ---------- 恒星（workspace） ---------- */
const defs = el("defs"); svg.insertBefore(defs, svg.firstChild);
const starGrad = el("radialGradient",{id:"starGrad"});
starGrad.appendChild(el("stop",{offset:"0%","stop-color":"#fffdf2","stop-opacity":"1"}));
starGrad.appendChild(el("stop",{offset:"28%","stop-color":"#fff2cf","stop-opacity":".95"}));
starGrad.appendChild(el("stop",{offset:"70%","stop-color":"#ffcf87","stop-opacity":".35"}));
starGrad.appendChild(el("stop",{offset:"100%","stop-color":"#ffb454","stop-opacity":"0"}));
defs.appendChild(starGrad);

const starG = document.getElementById("star");
starG.appendChild(el("circle",{cx:CX,cy:CY,r:150,fill:"url(#starGrad)",opacity:".42",
  style:"animation:breath 7.5s ease-in-out infinite"}));
starG.appendChild(el("circle",{cx:CX,cy:CY,r:26,fill:"#fffdf2",opacity:".95"}));
starG.appendChild(el("circle",{cx:CX,cy:CY,r:34,fill:"none",stroke:"#ffd79a","stroke-width":"1",opacity:".5"}));
const st = el("text",{x:CX,y:CY+62,class:"lbl","text-anchor":"middle","font-size":"12px"}, "MOSShell");
starG.appendChild(st);

/* 呼吸 keyframe（内联，避免主题切换丢动画） */
const style = document.createElement("style");
style.textContent = "@keyframes breath{0%,100%{opacity:.42;transform:scale(.985)}50%{opacity:.66;transform:scale(1.02)}}";
document.head.appendChild(style);

/* ---------- 球壳：二十面体细分成的晶格（戴森壳的"脚手架"） ---------- */
const shellG = document.getElementById("shell");
const PHI = (1 + Math.sqrt(5)) / 2;
let V = [
  [-1, PHI, 0], [1, PHI, 0], [-1, -PHI, 0], [1, -PHI, 0],
  [0, -1, PHI], [0, 1, PHI], [0, -1, -PHI], [0, 1, -PHI],
  [PHI, 0, -1], [PHI, 0, 1], [-PHI, 0, -1], [-PHI, 0, 1]
].map(v => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0]/l, v[1]/l, v[2]/l]; });

const T0 = [
  [0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],
  [1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
  [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],
  [4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]
];
const mid = (a,b) => { const m = [a[0]+b[0], a[1]+b[1], a[2]+b[2]];
  const l = Math.hypot(m[0],m[1],m[2]); return [m[0]/l, m[1]/l, m[2]/l]; };

// 两次细分：20 → 80 → 320 面（细到像戴森壳的脚手架，而不是一颗低模球）
function subdivide(faces){
  const out = [];
  for (const [A,B,C] of faces){
    const AB = mid(A,B), BC = mid(B,C), CA = mid(C,A);
    out.push([A,AB,CA],[B,BC,AB],[C,CA,BC],[AB,BC,CA]);
  }
  return out;
}
let FACES = T0.map(([a,b,c])=>[V[a],V[b],V[c]]);
FACES = subdivide(subdivide(FACES));

// 顶点索引：同一顶点的 6 个三角面 = 一块六边形面板（戴森壳的一块）
const vkey = v => v.map(x => x.toFixed(3)).join(",");
const verts = new Map();           // key -> {pos, faces:[]}
FACES.forEach((tri, fi)=>{
  tri.forEach(v=>{
    const k = vkey(v);
    if (!verts.has(k)) verts.set(k, {pos: v, faces: []});
    verts.get(k).faces.push(fi);
  });
});

// 每个面一个 path
const faceEls = FACES.map(()=>{
  const p = el("path",{class:"cell"}); shellG.appendChild(p); return p;
});

/* ---------- 面板：一个 feature = 一块六边形面板（绕一个顶点的 6 个面） ---------- */
const FEATURES = (window.DYSON ? window.DYSON.features : []);
const N = FEATURES.length;

// 候选顶点：刚好 6 个面相聚的地方（内部顶点）
const cands = [...verts.entries()].filter(([,v]) => v.faces.length === 6);

function shuffleSeeded(arr, seed0){
  let seed = seed0;
  const out = arr.slice();
  for (let i=out.length-1;i>0;i--){
    seed = (seed * 1664525 + 1013904223) >>> 0;
    const j = seed % (i+1);
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

let faceFeature = new Array(FACES.length).fill(null);
let layoutMode = "feature";

function assign(mode){
  faceFeature = new Array(FACES.length).fill(null);
  FEATURES.forEach(f => { f.faces = []; });

  if (mode === "time"){
    // 纬度带 = 月份：越早越靠南（v[1] 是球面 y）
    const months = [...new Set(FEATURES.map(f=>f.month))].sort();
    const byLat = cands.slice().sort((a,b)=>a[1].pos[1]-b[1].pos[1]);
    const per = Math.floor(byLat.length / months.length);
    months.forEach((m,mi)=>{
      const band = byLat.slice(mi*per, (mi+1)*per);
      // 带内按经度排
      band.sort((a,b)=>Math.atan2(a[1].pos[2],a[1].pos[0])-Math.atan2(b[1].pos[2],b[1].pos[0]));
      const fs = FEATURES.filter(f=>f.month===m);
      fs.forEach((f,i)=>{
        const pick = band[Math.floor(i * band.length / Math.max(1,fs.length)) % band.length];
        if (!pick) return;
        f.faces = pick[1].faces.slice();
        f.dir = pick[1].pos;
        f.faces.forEach(fi => { faceFeature[fi] = f; });
      });
    });
  } else {
    const shuffled = shuffleSeeded(cands, 20261028);
    FEATURES.forEach((f,i)=>{
      const pick = shuffled[i % shuffled.length];
      if (!pick) return;
      f.faces = pick[1].faces.slice();
      f.dir = pick[1].pos;
      f.faces.forEach(fi => { faceFeature[fi] = f; });
    });
  }
}
assign("feature");

function stateClass(f){
  if (f.status === "completed") return "done";
  if (f.status === "draft" || f.status === "superseded") return "draft";
  return "building";
}

// 交互：每个面都挂监听，运行时按 faceFeature 派发（这样切换铺法不用重挂）
faceEls.forEach((elp, fi)=>{
  elp.style.pointerEvents = "all";
  elp.addEventListener("mouseenter", ()=>{
    const f = faceFeature[fi];
    if (!f) return;
    elp.classList.add("hot"); showTip(f);
  });
  elp.addEventListener("mouseleave", ()=>{ elp.classList.remove("hot"); hideTip(); });
  elp.addEventListener("click", ev=>{
    const f = faceFeature[fi];
    if (!f) return;
    ev.stopPropagation(); zoomTo(f);
  });
});

/* ---------- 施工行星（hive） ---------- */
const orbitG = document.getElementById("orbitPath");
orbitG.appendChild(el("ellipse",{cx:CX,cy:CY,rx:440,ry:440*Math.sin(TILT+0.55),
  class:"orbit","stroke-dasharray":"3 8",opacity:".35"}));
const planetG = document.getElementById("planet");
const planet = el("circle",{r:9,class:"planet","stroke-width":"1.4"});
const planetRing = el("ellipse",{rx:17,ry:5.5,class:"planetRing","stroke-width":"1",opacity:".55"});
const planetLbl = el("text",{class:"lbl sm","font-size":"10px"}, "hive · 施工中");
planetG.appendChild(planet); planetG.appendChild(planetRing); planetG.appendChild(planetLbl);

/* ---------- 施工中的光点 ---------- */
const craftG = document.getElementById("crafts");
const crafts = [];
function launch(){
  const cands = FEATURES.filter(f=>f.status === "in-progress" && f._sx != null);
  if (!cands.length) return;
  const f = cands[Math.floor(Math.random()*cands.length)];
  const c = el("circle",{r:2,class:"craft",opacity:".95",
    style:"filter:drop-shadow(0 0 5px currentColor)"});
  craftG.appendChild(c);
  crafts.push({el:c, f, t:0, from:{x:planetX,y:planetY}});
}
setInterval(()=>{ if (document.visibilityState === "visible") launch(); }, 1500);

/* ---------- 提示卡 ---------- */
const tipG = document.getElementById("tip");
function showTip(f){
  if (f._sx == null) return;
  tipG.innerHTML = "";
  const w = 236, h = 74;
  const x = Math.min(Math.max(20, f._sx - w/2), 1600 - w - 20);
  const y = Math.max(20, f._sy - h - 18);
  tipG.appendChild(el("rect",{x,y,width:w,height:h,rx:7,fill:"var(--panel)",
    stroke:"var(--line)","stroke-width":"1",opacity:".97"}));
  tipG.appendChild(el("text",{x:x+14,y:y+22,class:"lbl","font-size":"11px"}, trunc(f.name, 30)));
  tipG.appendChild(el("text",{x:x+14,y:y+40,class:"lbl sm"}, `${f.status} · ${f.progress}%`));
  tipG.appendChild(el("text",{x:x+14,y:y+58,class:"lbl sm","font-size":"9px"},
    trunc(f.desc || "—", 42)));
  tipG.style.opacity = 1;
}
function hideTip(){ tipG.style.opacity = 0; }
function trunc(s,n){ return s.length > n ? s.slice(0, n-1) + "…" : s; }

/* ---------- 相机 ---------- */
const cam = document.getElementById("cam");
const arcEl = document.getElementById("arc");
let zoomed = null;
function zoomTo(f){
  zoomed = f;
  const s = 2.1;
  cam.setAttribute("transform", `translate(${800 - f._sx*s} ${500 - f._sy*s}) scale(${s})`);
}
function resetCam(){ zoomed = null; cam.setAttribute("transform", ""); }
svg.addEventListener("click", resetCam);

/* ---------- 主循环：20fps，够用且便宜 ---------- */
let lon0 = 0, lastT = 0, acc = 0;
let planetX = CX + 430, planetY = CY;
function frame(t){
  requestAnimationFrame(frame);
  if (document.hidden) return;
  const dt = Math.min(80, t - lastT || 16); lastT = t;
  acc += dt;
  if (acc < 45) return;            // ≈22fps
  const step = acc; acc = 0;

  lon0 += 0.00035 * step;          // 缓慢自转 ≈ 80s 一圈

  // 晶格面
  for (let fi=0; fi<FACES.length; fi++){
    const tri = FACES[fi];
    let d = "", zsum = 0;
    for (let k=0;k<3;k++){
      const v = tri[k];
      const c = Math.cos(lon0), sn = Math.sin(lon0);
      const x1 =  v[0]*c + v[2]*sn;
      const z1 = -v[0]*sn + v[2]*c;
      const y1 =  v[1];
      const y2 = y1*Math.cos(TILT) - z1*Math.sin(TILT);
      const z2 = y1*Math.sin(TILT) + z1*Math.cos(TILT);
      zsum += z2;
      d += (k ? "L" : "M") + (CX + R*x1).toFixed(1) + " " + (CY - R*y2).toFixed(1);
    }
    d += "Z";
    const f = faceFeature[fi];
    const elp = faceEls[fi];
    elp.setAttribute("d", d);
    const front = zsum > 0;
    if (f){
      elp.setAttribute("class", "cell feat " + stateClass(f));
      const prog = Math.max(0, Math.min(100, f.progress)) / 100;
      elp.setAttribute("fill-opacity", (front ? .05 + .26*prog : .015).toFixed(2));
      elp.setAttribute("stroke-opacity", front ? ".95" : ".2");
      f._z = zsum;
      // 面板中心 = 面板顶点（法向）在屏幕上的投影，供光点飞行与缩放
      const v = f.dir, c = Math.cos(lon0), sn = Math.sin(lon0);
      const x1 = v[0]*c + v[2]*sn, z1 = -v[0]*sn + v[2]*c, y1 = v[1];
      const y2 = y1*Math.cos(TILT) - z1*Math.sin(TILT), z2 = y1*Math.sin(TILT) + z1*Math.cos(TILT);
      f._sx = CX + R*x1; f._sy = CY - R*y2; f._z = z2;
    } else {
      elp.setAttribute("class", "cell");
      elp.setAttribute("fill-opacity", front ? ".02" : "0");
      elp.setAttribute("stroke-opacity", front ? (zsum > .35 ? ".26" : ".14") : ".05");
    }
  }

  // 外壳完成度：沿轨道环画一段亮弧（诚实的总量，不装饰）
  if (arcEl){
    const pct = FEATURES.reduce((a,f)=>a+f.progress,0) / Math.max(1, FEATURES.length) / 100;
    const rx = 440, ry = 440*Math.sin(TILT+0.55);
    const a0 = -Math.PI/2, a1 = a0 + Math.PI*2*Math.max(.02, pct);
    const p0 = [CX + rx*Math.cos(a0), CY + ry*Math.sin(a0)];
    const p1 = [CX + rx*Math.cos(a1), CY + ry*Math.sin(a1)];
    const large = (a1-a0) > Math.PI ? 1 : 0;
    arcEl.setAttribute("d", `M ${p0[0]} ${p0[1]} A ${rx} ${ry} 0 ${large} 1 ${p1[0]} ${p1[1]}`);
    arcEl.setAttribute("stroke", "var(--cool)");
    arcEl.setAttribute("stroke-width", "2");
    arcEl.setAttribute("opacity", ".35");
  }

  // 行星（在球外的椭圆轨道上）
  const ph = lon0 * 3.1 + 1.1;
  planetX = CX + 440 * Math.cos(ph);
  planetY = CY + 440 * Math.sin(ph) * Math.sin(TILT + 0.55);
  planet.setAttribute("cx", planetX); planet.setAttribute("cy", planetY);
  planetRing.setAttribute("cx", planetX); planetRing.setAttribute("cy", planetY);
  planetRing.setAttribute("transform", `rotate(-18 ${planetX} ${planetY})`);
  planetLbl.setAttribute("x", planetX + (planetX>CX?18:-18));
  planetLbl.setAttribute("y", planetY + (planetY>CY?16:-10));
  planetLbl.setAttribute("text-anchor", planetX>CX ? "start":"end");
  planetLbl.setAttribute("opacity", ".75");

  // 施工光点：行星 → 面板，走一条朝恒星微弯的弧
  for (let i=crafts.length-1;i>=0;i--){
    const c = crafts[i];
    c.t += step / 2400;
    if (c.t >= 1){
      c.f.progress = Math.min(100, c.f.progress + 1);
      c.el.remove(); crafts.splice(i,1); continue;
    }
    const a = c.from, b = {x:c.f._sx, y:c.f._sy};
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    const dx = CX-mx, dy = CY-my, dl = Math.hypot(dx,dy)||1;
    const cx = mx + dx/dl*90, cy = my + dy/dl*90;
    const t = c.t, u = 1-t;
    const x = u*u*a.x + 2*u*t*cx + t*t*b.x;
    const y = u*u*a.y + 2*u*t*cy + t*t*b.y;
    c.el.setAttribute("cx", x); c.el.setAttribute("cy", y);
    c.el.setAttribute("opacity", (0.3 + 0.7*Math.sin(Math.PI*t)).toFixed(2));
  }
}
requestAnimationFrame(frame);

/* ---------- 底部标尺：像仪器，不像仪表盘 ---------- */
(function ruler(){
  const gEl = document.getElementById("ruler");
  const y = 930, x0 = 520, x1 = 1220, n = 6;
  gEl.appendChild(el("line",{x1:x0,y1:y,x2:x1,y2:y,stroke:"var(--line)","stroke-width":"1"}));
  const months = ["05","06","07","08","09","10"];
  for (let i=0;i<=60;i++){
    const x = x0 + (x1-x0)*i/60;
    const major = i % 10 === 0;
    gEl.appendChild(el("line",{x1:x,y1:y,x2:x,y2:y-(major?9:4),
      stroke:"var(--line)","stroke-width":"1",opacity:major?".9":".5"}));
    if (major && i/10 < n){
      gEl.appendChild(el("text",{x,y:y+16,"text-anchor":"middle","font-size":"9px",
        fill:"var(--ink2)","letter-spacing":".14em"},"MO "+months[i/10]));
    }
  }
  gEl.appendChild(el("text",{x:x0,y:y+32,"font-size":"9px",fill:"var(--ink3)","letter-spacing":".14em"},
    "2026 · 181 WORKSTREAMS"));
})();

/* ---------- 主题 ---------- */
document.querySelectorAll("#themes button").forEach(b=>{
  b.addEventListener("click", e=>{
    e.stopPropagation();
    if (b.dataset.layout){
      assign(b.dataset.layout);
      document.querySelectorAll("[data-layout]").forEach(x=>
        x.setAttribute("aria-pressed", x===b ? "true":"false"));
      level = b.dataset.layout;
      document.getElementById("hud-sub").textContent = subText();
      return;
    }
    document.body.dataset.theme = b.dataset.theme;
    document.querySelectorAll("[data-theme]").forEach(x=>
      x.setAttribute("aria-pressed", x===b ? "true":"false"));
  });
});

/* ---------- HUD ---------- */
const total = FEATURES.length;
const building = FEATURES.filter(f=>f.status==="in-progress").length;
const done = FEATURES.filter(f=>f.status==="completed").length;
document.getElementById("hud-title").textContent = window.DYSON ? window.DYSON.workspace : "MOSShell";
let level = "feature";
function subText(){
  const avg = Math.round(FEATURES.reduce((a,f)=>a+f.progress,0) / Math.max(1,total));
  const mode = level === "time" ? "铺法：纬度带 = 月份（南=早，北=新）" : "铺法：每块晶格面 = 一条 workstream";
  return `${total} FEATURES · ${building} BUILDING · ${done} COMPLETED · SHELL ${avg}% · ${mode}`;
}
document.getElementById("hud-sub").textContent = subText();
</script>
<script>
// 这一份是"时间铺法"的展品：打开即按纬度带=月份铺开
document.querySelector('[data-layout="time"]').click();
</script>
</body>
</html>
