[project]
name = "ghoshell-agent-swarm"
version = "0.1.0.dev0"
description = "A programmable agent swarm for MOSS — tasks as first-class citizens, facts over ledgers"
authors = [{ name = "thirdgerb" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The swarm builds on the shell layer, never the other way round: MOSS has no
    # dependency on this distribution, and nothing here ships inside it.
    "ghoshell-moss[matrix]",
]

[tool.uv.sources]
# Resolved from the monorepo workspace (root pyproject: [tool.uv.workspace]),
# so edits to ../ghoshell_moss are live while the swarm is being developed.
ghoshell-moss = { workspace = true }

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ghoshell_agent_swarm*"]
