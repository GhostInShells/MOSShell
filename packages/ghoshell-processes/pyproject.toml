[project]
name = "ghoshell-processes"
version = "0.1.0.dev0"
description = "Child-process governance for the GhostInShells monorepo — spawn, observe, and reap processes that never outlive their owner"
authors = [{ name = "thirdgerb" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "typing-extensions>=4.12.0",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ghoshell_processes*"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
