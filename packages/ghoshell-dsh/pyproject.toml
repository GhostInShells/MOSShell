[project]
name = "ghoshell-dsh"
version = "0.1.0.dev0"
description = "Multi-version dsh compatibility layer — launch and manage several dsh versions from Python"
authors = [{ name = "thirdgerb" }]
license = { text = "MIT" }
requires-python = ">=3.10"

# One dependency, and it is a mechanism layer, not MOSShell: child-process governance comes
# from `ghoshell-processes` in this workspace. Nothing here imports `ghoshell-moss` — the
# MOSS-facing pieces (channel, message mapper, runtime) live there, not here.
dependencies = ["ghoshell-processes"]

[tool.uv.sources]
ghoshell-processes = { workspace = true }

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ghoshell_dsh*"]

# Skills ship with the package: they are the usage documentation *and* the verification
# samples, so a consumer that installed the wheel gets them too. Data lives inside the
# package because a root-level directory reaches the sdist but not the wheel.
[tool.setuptools.package-data]
ghoshell_dsh = ["skills/*/*.md", "skills/*/*.py"]

# Test and lint tooling. The same three the monorepo root uses, kept separate so this package
# can be worked on without the root's heavier extras (mcp, fastapi, docs tooling).
[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.15.0",
]

# Unit tests only: they need nothing outside this package. Verification against a real dsh
# lives in `skills/` — runnable samples that double as documentation, not in the test suite.
[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "strict"
