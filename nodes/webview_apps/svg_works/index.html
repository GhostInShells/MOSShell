<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>svg works</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #10151b; --line: #2b313b; --line-strong: #46515f;
    --fg: #dfe9f2; --dim: #8a97a4; --accent: #3ddc8f; --wait: #ffb454;
    --col: 320px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-columns: 1fr var(--col);
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-monospace, "PingFang SC", "Noto Sans CJK SC", monospace;
    overflow: hidden;
  }

  /* ===== 左：画布 =====
     画布永远不重建：它只是在原地被 ops 改动。滚动、动画、选中都留在原地。 */
  #canvas {
    position: relative; overflow: hidden; background: var(--panel);
    border-right: 1px solid var(--line-strong); cursor: grab;
  }
  #canvas.panning { cursor: grabbing; }
  #stage { display: block; width: 100%; height: 100%; }
  #stage .live { opacity: .55; }
  /* 人被指到的那一块：闪一下。它不改变内容，只是"我看的是这里"。 */
  #stage .picked { filter: drop-shadow(0 0 6px #3ddc8f) drop-shadow(0 0 14px #3ddc8f); }          /* 正在流的预览，还没成为一条 op */
  #hint {
    position: absolute; left: 14px; bottom: 12px; color: #55636f; font-size: 11.5px;
    pointer-events: none;
  }
  #empty {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: #55636f; font-size: 13px;
  }
  #empty[hidden] { display: none; }

  /* 我指过去的那一块：亮起来。**只有高亮** —— 问话属于屏幕，不属于画布：
     画布表达"这里"，句子由我的声音或屏幕去说。 */
  @keyframes pulse { 0%,100% { filter: drop-shadow(0 0 4px #3ddc8f); }
                     50% { filter: drop-shadow(0 0 16px #3ddc8f); } }
  #stage .asking { animation: pulse 1.6s ease-in-out infinite; }


  /* ===== 右：动作列 ===== */
  #side { display: flex; flex-direction: column; min-width: 0; background: #0d1218; }
  #side header {
    padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex;
    align-items: baseline; gap: 8px;
  }
  /* 画布优先的开关：收的是卡，不是记录。收起来之后由右边那条窄条换回来。 */
  #canvas-first {
    margin-left: auto; background: transparent; border: 1px solid var(--line);
    border-radius: 4px; color: var(--dim); font: inherit; font-size: 11px;
    padding: 2px 8px; cursor: pointer;
  }
  #canvas-first:hover { color: var(--fg); border-color: var(--line-strong); }

  /* 作品切换：和切分组同一类动作 —— 换的是"看哪个"，不动任何作品的内容。 */
  #work-picker {
    background: #10151b; color: var(--accent); border: 1px solid var(--line);
    border-radius: 4px; font: inherit; font-weight: 600; padding: 2px 4px; cursor: pointer;
    max-width: 40%;
  }
  #work-picker:focus { outline: none; border-color: var(--line-strong); }
  #page-picker {
    background: #10151b; color: var(--dim); border: 1px solid var(--line);
    border-radius: 4px; font: inherit; font-size: 11.5px; padding: 2px 4px; cursor: pointer;
    max-width: 32%;
  }
  #work-name { color: var(--accent); font-weight: 600; }
  #work-meta { color: var(--dim); font-size: 11.5px; }
  #cards { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  #cards:empty::after {
    content: "no ops yet — the first write opens the record";
    color: #55636f; font-size: 11.5px; padding: 8px;
  }

  /* 一张卡 = 一条 op。它同时是"刚才做了什么"和"跳到这里"的把手。 */
  .card {
    border: 1px solid var(--line); border-radius: 5px; padding: 7px 9px;
    background: #14181e; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .card:hover { border-color: var(--line-strong); background: #171d24; }
  .card .title { color: var(--fg); }
  .card .mech { color: var(--dim); font-size: 11.5px; margin-top: 2px; }
  .card .mech b { color: #9fb3c8; font-weight: 600; }
  .card .warn { color: var(--wait); font-size: 11.5px; margin-top: 3px; }
  .card.done .title { color: #9fb3c8; }
  .card.reader { border-color: var(--accent); }
  .card.reader .title { color: var(--accent); }
  .card.ahead { opacity: .38; }            /* reader 之后还没重放的 op */
  .card.page { border-left: 3px solid var(--accent); }   /* 一页：导出时它就是一个跳转点 */

  /* ===== 底部：连接态 ===== */
  #foot {
    border-top: 1px solid var(--line); padding: 7px 12px; color: var(--dim);
    font-size: 11.5px; display: flex; justify-content: space-between;
  }
  #foot .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #55636f; margin-right: 5px; vertical-align: middle; }
  body.live #foot .dot { background: var(--accent); }

  /* ===== 收起动作列 =====
     全屏时收起的只是"卡"，不是"记录"：留下一条能点开的窄条，读点还在上面。 */
  body.panelless { grid-template-columns: 1fr 26px; }
  body.panelless #side > *:not(#strip) { display: none; }
  #strip {
    display: none; height: 100%; cursor: pointer; position: relative;
    border-left: 1px solid var(--line); background: #0d1218;
  }
  body.panelless #strip { display: block; }
  #strip .tick {
    position: absolute; left: 9px; width: 7px; height: 7px; border-radius: 50%;
    background: #2b313b; transform: translateY(-50%);
  }
  #strip .tick.reader { background: var(--accent); }
  #strip .count {
    position: absolute; bottom: 8px; left: 0; right: 0; text-align: center;
    color: var(--dim); font-size: 10px; writing-mode: vertical-rl;
  }
</style>
</head>
<body>
<div id="canvas">
  <svg id="stage" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"
       xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="empty">open_work(name), then write into an address</div>
  <div id="hint">ops land in place — nothing here reloads · drag to pan · wheel to zoom · double-click to fit</div>

</div>

<aside id="side">
  <header>
    <select id="work-picker" title="switch work — a view action, no work is changed"></select>
    <select id="page-picker" title="jump to a page — a view action, the reader moves"></select>
    <span id="work-meta"></span>
    <button id="canvas-first" title="canvas first — hides the cards, keeps the record">canvas</button>
  </header>
  <div id="cards"></div>
  <div id="foot"><span><i class="dot"></i><span id="conn">connecting…</span></span><span id="cursor"></span></div>
  <div id="strip" title="show the action column"><span class="count"></span></div>
</aside>

<script>
const SVG_NS = "http://www.w3.org/2000/svg";
const stage = document.getElementById("stage");
const cards = document.getElementById("cards");
const empty = document.getElementById("empty");
const workName = document.getElementById("work-name");
const workMeta = document.getElementById("work-meta");
const picker = document.getElementById("work-picker");
const pagePicker = document.getElementById("page-picker");
const connEl = document.getElementById("conn");
const cursorEl = document.getElementById("cursor");
const strip = document.getElementById("strip");

let ops = [];       // 这一份作品的 action log（服务端才是真相，这里是它的投影）
let cursor = 0;     // reader 站在第几个 op 之后
let previews = new Map();
let askAddr = "";           // 我正在等答案的那个地址   // addr -> 正在流的预览节点

// ---- 寻址 ---------------------------------------------------------------
// 地址就是 CSS 选择器。找不到时返回 null，而不是猜一个 —— "改了没反应"和
// "改错了地方"必须能分开。
function find(addr) {
  try { return stage.querySelector(addr) || document.querySelector(addr); }
  catch (e) { return null; }
}

// ---- 把一个片段挂到某个节点下面 ------------------------------------------
// SVG 里的片段要用 SVG 命名空间解析；用 innerHTML 直接塞会得到没有命名空间的元素，
// 画得出来但属性全不生效 —— 这一类错误看起来像"没画出来"，其实是解析错了。
function parseInto(parent, html) {
  const inSvg = parent.namespaceURI === SVG_NS;
  const holder = inSvg
    ? document.createElementNS(SVG_NS, "svg")
    : document.createElement("div");
  holder.innerHTML = html;
  const nodes = Array.from(holder.childNodes);
  const added = [];
  for (const node of nodes) {
    if (inSvg && node.nodeType === 1 && node.namespaceURI !== SVG_NS) {
      const converted = document.importNode(node, true);
      const wrap = document.createElementNS(SVG_NS, "g");
      wrap.appendChild(converted);
      parent.appendChild(wrap);
      added.push(wrap);
    } else {
      parent.appendChild(node);
      if (node.nodeType === 1) added.push(node);
    }
  }
  return added;
}

// SVG 里有些元素天生装不了孩子（path / circle / line …）。往里 append 在 DOM 上
// 是成功的、在画面上却什么都不出现 —— "这块地方装不下"和"这一笔坏了"必须能分开。
const VOID_SHAPES = new Set([
  "PATH", "LINE", "POLYLINE", "POLYGON", "CIRCLE", "ELLIPSE", "RECT", "IMAGE", "USE",
]);

// ---- 应用一条 op ---------------------------------------------------------
function apply(op) {
  if (op.kind === "insert") {
    // 地址找不到时不要偷偷落到 stage 上：那是"改错了地方"，必须说出来。
    let parent = find(op.addr);
    if (!parent && op.addr !== "#stage") {
      op.warn = `no node at ${op.addr} — this op did not land`;
      return false;
    }
    parent = parent || stage;
    // 注意 SVG 元素的 tagName 保留小写（"path"），HTML 元素才是全大写 —— 两边都归一。
    if (VOID_SHAPES.has(String(parent.tagName).toUpperCase())) {
      op.warn = `<${parent.tagName.toLowerCase()}> cannot hold children — use a <g>`;
    }
    // 预览被 op 接管：先撤掉预览，避免同一段内容出现两次
    const live = previews.get(op.addr)?.node;
    if (live && live.parentNode) live.remove();
    previews.delete(op.addr);
    parseInto(parent, op.payload.html || "");
    return true;
  }
  if (op.kind === "set") {
    const el = find(op.addr);
    if (!el) { op.warn = `no node at ${op.addr} — attribute not set`; return false; }
    el.setAttribute(op.payload.attr, op.payload.value);
    return true;
  }
  if (op.kind === "style") {
    const tag = document.createElementNS(SVG_NS, "style");
    tag.textContent = op.payload.css || "";
    stage.appendChild(tag);
    return true;
  }
  if (op.kind === "frame") return true;   // 页是一个标记：它什么也不画
  if (op.kind === "remove") {
    const el = find(op.addr);
    if (!el) { op.warn = `no node at ${op.addr} — nothing to remove`; return false; }
    el.remove();
    return true;
  }
  return false;
}

// ---- 重放：不是撤销，是把读点挪回去再走一遍 ------------------------------
function replay(to) {
  stage.replaceChildren();
  previews.forEach((p) => p.node && p.node.remove());
  previews.clear();
  for (let i = 0; i < to; i += 1) apply(ops[i]);
  cursor = to;
  renderCards();
}

// ---- 看的人的面：平移与缩放 ---------------------------------------------
// 画布只负责画；"我看哪一块"是读的人的事，所以这一层不落成 op —— 它不改作品，
// 只是同一份记录换了个看的位置。判据还是那条：读的归人，写的归我。
const BASE = { x: 0, y: 0, w: 1000, h: 700 };
const canvasEl = document.getElementById("canvas");
let view = { ...BASE };
let shownWork = null;

function applyView() {
  stage.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
}

// 指针到画面坐标的映射只能问渲染器要：preserveAspectRatio 自己会做居中缩放，
// 手算一遍迟早算歪。
function toSvg(ev) {
  const m = stage.getScreenCTM();
  if (!m) return { x: 0, y: 0 };
  return new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m.inverse());
}

function fitToContent() {
  let b = null;
  try { b = stage.getBBox(); } catch (e) { b = null; }
  if (!b || !(b.width > 0) || !(b.height > 0)) {
    view = { ...BASE };
    applyView();
    return;
  }
  const pad = Math.max(b.width, b.height) * 0.06;
  view = { x: b.x - pad, y: b.y - pad, w: b.width + pad * 2, h: b.height + pad * 2 };
  applyView();
}

canvasEl.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const p = toSvg(ev);
  const w = Math.min(BASE.w * 8, Math.max(BASE.w * 0.08, view.w * (ev.deltaY < 0 ? 0.88 : 1 / 0.88)));
  const h = w * (view.h / view.w);
  // 缩放锚在指针底下：放大时手指按住的那一点不动，这是"我能看细节"的前提。
  view.x = p.x - (p.x - view.x) * (w / view.w);
  view.y = p.y - (p.y - view.y) * (h / view.h);
  view.w = w;
  view.h = h;
  applyView();
}, { passive: false });

let pan = null;
canvasEl.addEventListener("pointerdown", (ev) => {
  if (ev.button !== 0) return;
  pan = { sx: ev.clientX, sy: ev.clientY, vx: view.x, vy: view.y, moved: false };
});
window.addEventListener("pointermove", (ev) => {
  if (!pan) return;
  const dx = ev.clientX - pan.sx;
  const dy = ev.clientY - pan.sy;
  if (!pan.moved && Math.hypot(dx, dy) < 4) return;   // 抖一下不算拖
  pan.moved = true;
  const r = stage.getBoundingClientRect();
  const scale = Math.min(r.width / view.w, r.height / view.h) || 1;
  view.x = pan.vx - dx / scale;
  view.y = pan.vy - dy / scale;
  canvasEl.classList.add("panning");
  applyView();
});
window.addEventListener("pointerup", () => {
  if (pan) canvasEl.classList.remove("panning");
  pan = null;
});
canvasEl.addEventListener("dblclick", fitToContent);
applyView();

// ---- 动作列 -------------------------------------------------------------
function opLine(op) {
  if (op.kind === "insert") {
    const n = (op.payload.html || "").length;
    return `insert <b>${esc(op.addr)}</b> · ${n} chars`;
  }
  if (op.kind === "set") return `set <b>${esc(op.addr)}</b>[${esc(op.payload.attr)}]`;
  if (op.kind === "remove") return `remove <b>${esc(op.addr)}</b>`;
  if (op.kind === "style") return `style · ${(op.payload.css || "").length} chars`;
  if (op.kind === "frame") return "page";
  return op.kind;
}

function renderCards() {
  cards.replaceChildren();
  // 倒序：最新的一条在最上面。动作列是"正在发生"的地方，新的一直在来；
  // 放底部就得一直追着滚，而追滚的代价是看不见自己刚做了什么。
  // 顺序仍然看得见 —— 每张卡带编号。
  const rows = ops.map((op, idx) => [op, idx]);
  rows.reverse();
  rows.forEach(([op, idx]) => {
    const card = document.createElement("div");
    card.className = "card" + (op.kind === "frame" ? " page" : "")
      + (idx + 1 <= cursor ? " done" : " ahead")
      + (idx + 1 === cursor ? " reader" : "");
    const title = document.createElement("div");
    title.className = "title";
    // 卡上先给人看动机（模型的 note），没有才退回机制描述；编号永远带着，倒序里它是顺序的证据。
    title.textContent = `${op.n || idx + 1}. ${op.note || op.kind}`;
    const mech = document.createElement("div");
    mech.className = "mech";
    mech.innerHTML = opLine(op);
    card.append(title, mech);
    if (op.warn) {
      const warn = document.createElement("div");
      warn.className = "warn";
      warn.textContent = op.warn;
      card.appendChild(warn);
    }
    card.title = "move the reader here";
    card.addEventListener("click", () => {
      // 人点卡 = 一个视图动作，所以发上去让服务端把读点也挪过去（两边同一个数）。
      send({ type: "user.checkout", n: idx + 1 });
      replay(idx + 1);
    });
    cards.appendChild(card);
  });
  cursorEl.textContent = ops.length ? `reader ${cursor}/${ops.length}` : "";
  empty.hidden = ops.length > 0;
  renderStrip();
}

// 收起后剩下的那条窄条：读点还在上面，点一下展开。
// 收的是"卡"，不是"记录" —— 所以它能被点回来，读点也不会跟着消失。
function renderStrip() {
  strip.replaceChildren();
  const n = ops.length;
  ops.forEach((op, idx) => {
    const tick = document.createElement("i");
    tick.className = "tick" + (idx + 1 === cursor ? " reader" : "");
    tick.style.top = n > 1 ? `${(idx / (n - 1)) * 78 + 8}%` : "45%";
    tick.title = op.note || op.kind;
    strip.appendChild(tick);
  });
  const count = document.createElement("span");
  count.className = "count";
  count.textContent = n ? `${cursor}/${n}` : "";
  strip.appendChild(count);
}

// 人往画面上点一下 = 指了一个地址。这是"读"：不改任何东西，只告诉我他指的是哪一块。
// 地址由画面产出（data-addr），所以点到的和我说的是同一个坐标 —— 不靠坐标换算。
stage.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-addr]");
  if (!el) return;
  const addr = "[data-addr=\"" + el.getAttribute("data-addr") + "\"]";
  send({ type: "user.pick", addr, work: picker.value });
  el.classList.add("picked");
  setTimeout(() => el.classList.remove("picked"), 700);
});

strip.addEventListener("click", () => {
  document.body.classList.remove("panelless");
  renderStrip();
});

// 人的开关和模型下发的 panel 命令走同一条路：都是把 panelless 拨一下。
// 区别只有一个——人这边不回传服务端（它是视图动作，通知服务端只是噪音）。
document.getElementById("canvas-first").addEventListener("click", () => {
  document.body.classList.add("panelless");
  renderStrip();
});

function esc(s) { return String(s).replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c])); }

// ---- 帧路由 -------------------------------------------------------------
function onState(f) {
  const rows = f.works || [];
  const current = rows.find((w) => w.name === f.current) || null;
  picker.replaceChildren();
  rows.forEach((w) => {
    const opt = document.createElement("option");
    opt.value = w.name;
    opt.textContent = `${w.name} · ${w.ops}`;
    if (current && w.name === current.name) opt.selected = true;
    picker.appendChild(opt);
  });
  picker.disabled = rows.length === 0;
  pagePicker.replaceChildren();
  const pages = (current && current.pages) || [];
  pages.forEach((pg) => {
    const opt = document.createElement("option");
    opt.value = String(pg.n);
    opt.textContent = pg.label || `page ${pg.n}`;
    pagePicker.appendChild(opt);
  });
  pagePicker.hidden = pages.length === 0;
  const switched = !!current && current.name !== shownWork;
  shownWork = current ? current.name : null;
  ops = f.ops || [];
  replay(f.cursor == null ? ops.length : f.cursor);
  // 换了一份作品就把它整张放进视野：读的人接手时先看到全貌，之后怎么挪由他。
  if (switched) fitToContent();
  replay(f.cursor == null ? ops.length : f.cursor);
}

// 人切作品：一路都是视图动作，服务端只回一帧 state，谁的内容都不改。
// 跳页 = 把读点挪到那一页之后。和拖滑杆、点卡片是同一条路。
pagePicker.addEventListener("change", () => {
  const n = Number(pagePicker.value);
  replay(n);
  send({ type: "user.checkout", n });
});

picker.addEventListener("change", () => {
  send({ type: "user.open", name: picker.value });
});

function onFrame(f) {
  if (f.type === "state") return onState(f);
  if (f.type === "op") {
    ops.push(f.op);
    // 只把这条 op 应用上去：不重放、不重建 —— 这一条就是"不重载"的全部意义。
    if (ops.length === cursor + 1) { apply(f.op); cursor = ops.length; }
    renderCards();
    return;
  }
  if (f.type === "stream") {
    // 全流式：不看"这是一个 chunk"，看"地址上现在应该长什么样"。
    // 每个 delta 把缓冲区重解析一遍，挂回同一个预览组 —— 元素完整一只就出现一只，
    // 而不是等整段写完再"啪"地跳出来。动画在流式期间会重起，落到 op 时归位。
    const parent = find(f.addr);
    if (!parent) return;
    const buf = (previews.get(f.addr)?.buf || "") + f.text;
    let live = previews.get(f.addr)?.node;
    if (!live || !live.parentNode) {
      live = document.createElementNS(SVG_NS, "g");
      live.setAttribute("class", "live");
      parent.appendChild(live);
    }
    live.replaceChildren();
    parseInto(live, buf);
    previews.set(f.addr, { node: live, buf });
    return;
  }
  if (f.type === "replay") {
    ops = ops.slice(0, Math.max(0, (f.ops || []).length)) ;
    replay(f.n);
    return;
  }
  if (f.type === "cursor") {
    if (f.n !== cursor) replay(f.n);
    return;
  }
  if (f.type === "point") {
    document.querySelectorAll("#stage .asking").forEach((n) => n.classList.remove("asking"));
    const el = find(f.addr);
    if (el) el.classList.add("asking");
    askAddr = f.addr;
    return;
  }
  if (f.type === "panel") {
    document.body.classList.toggle("panelless", !f.show);
    renderStrip();
  }
}

// ---- 连接 ---------------------------------------------------------------
let sock = null;
function send(frame) {
  if (sock && sock.readyState === 1) sock.send(JSON.stringify(frame));
}
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  sock = new WebSocket(`${proto}://${location.host}/ws`);
  sock.addEventListener("open", () => {
    document.body.classList.add("live");
    connEl.textContent = "live";
  });
  sock.addEventListener("close", () => {
    document.body.classList.remove("live");
    connEl.textContent = "disconnected — retrying";
    setTimeout(connect, 1200);
  });
  sock.addEventListener("message", (ev) => {
    try { onFrame(JSON.parse(ev.data)); } catch (e) { console.warn("frame:", e, ev.data); }
  });
}
connect();
</script>
