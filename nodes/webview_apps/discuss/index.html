<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>discuss — timeline</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #10151b; --line: #2b313b; --line-strong: #46515f;
    --fg: #dfe9f2; --dim: #8a97a4; --faint: #55636f; --accent: #3ddc8f;
    --landed: #7fb6ff; --dropped: #a05a5a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); overflow: hidden;
    font: 13px/1.5 ui-monospace, "PingFang SC", "Noto Sans CJK SC", monospace;
    display: flex; flex-direction: column;
  }
  #head {
    display: flex; align-items: baseline; gap: 12px; padding: 10px 16px 6px;
    border-bottom: 1px solid var(--line);
  }
  #topic { color: var(--fg); font-weight: 600; }
  #meta { color: var(--dim); font-size: 12px; }
  #follow {
    margin-left: auto; background: transparent; border: 1px solid var(--line);
    border-radius: 4px; color: var(--dim); font: inherit; font-size: 11.5px;
    padding: 2px 9px; cursor: pointer;
  }
  #follow.on { color: var(--accent); border-color: rgba(61,220,143,.5); }
  #body { flex: 1; min-height: 0; display: flex; }
  #stage { flex: 1; min-width: 0; height: 100%; display: block; }
  text { font-family: ui-monospace, "PingFang SC", monospace; }

  /* 右边：选中那条分支的全部记录。三栏 —— 选哪条是人的点击。 */
  #aside {
    width: 330px; flex: none; border-left: 1px solid var(--line);
    background: var(--panel); display: flex; flex-direction: column; min-height: 0;
  }
  #aside[hidden] { display: none; }
  #aside-head {
    padding: 10px 14px 8px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  #aside-title { color: var(--fg); font-weight: 600; }
  #aside-state { font-size: 11.5px; }
  #aside-close {
    margin-left: auto; background: transparent; border: 0; color: var(--faint);
    font: inherit; cursor: pointer; padding: 0 4px;
  }
  #aside-close:hover { color: var(--fg); }
  #aside-list { flex: 1; overflow-y: auto; padding: 8px 10px 24px; }
  .rec { padding: 7px 9px; border-left: 2px solid var(--line-strong); margin-bottom: 6px;
    background: #0d1218; border-radius: 0 4px 4px 0; }
  .rec .t { color: var(--faint); font-size: 11px; }
  .rec .k { color: var(--dim); font-size: 11px; margin-left: 6px; }
  .rec .x { color: var(--fg); font-size: 12.5px; margin-top: 2px; }
  .rec.fork { border-left-color: var(--accent); }
  .rec.state { border-left-color: var(--landed); }
  #aside-empty { color: var(--faint); padding: 14px 6px; font-size: 12px; }
  @keyframes flash { from { background: #1b3a2c; } to { background: #0d1218; } }
  .rec.hit { animation: flash 1.6s ease-out; }
</style>
</head>
<body>
<div id="head">
  <span id="topic">discuss</span>
  <span id="meta"></span>
  <button id="follow" class="on" title="follow the newest record; dragging back turns it off">following</button>
</div>
<div id="body">
  <svg id="stage" xmlns="http://www.w3.org/2000/svg"><g id="pic"></g></svg>
  <aside id="aside" hidden>
    <div id="aside-head">
      <span id="aside-title"></span>
      <span id="aside-state"></span>
      <button id="aside-close" title="close">✕</button>
    </div>
    <div id="aside-list"></div>
  </aside>
</div>

<script>
// 三栏：左边一条分支一个按钮，中间是时间轴，右边是选中那条线的记录。
// 心电图式：窗口包住这批记录，新记录自动跟到最右；人往回拖就停止跟随，
// 因为"把它拽回最新"和"打断一个正在看别处的人"是同一件事。
const NS = "http://www.w3.org/2000/svg";
const stage = document.getElementById("stage");
const pic = document.getElementById("pic");
const topicEl = document.getElementById("topic");
const metaEl = document.getElementById("meta");
const followBtn = document.getElementById("follow");
const aside = document.getElementById("aside");
const asideTitle = document.getElementById("aside-title");
const asideState = document.getElementById("aside-state");
const asideList = document.getElementById("aside-list");
const asideClose = document.getElementById("aside-close");

const WINDOW_MS = 30 * 60 * 1000;
const MAX_EVENTS = 40;
const TOP = 62;
const GUTTER = 286;       // 左边按钮栏的宽度 —— 时间轴从这里开始
const CHIP_W = 266;
const CHIP_H = 44;
const PAD_R = 48;

let recs = [], branches = [], topic = "", now = Date.now() / 1000;
let following = true, viewEnd = null, zoom = 1, selected = "";

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function text(x, y, s, attrs = {}) {
  const t = el("text", { x, y, fill: "var(--dim)", "font-size": 12.5, ...attrs });
  t.textContent = s;
  return t;
}
function fmtTime(t) {
  const d = new Date(t * 1000);
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function clip(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function stateColor(s) {
  return s === "landed" ? "var(--landed)" : s === "dropped" ? "var(--dropped)" : "var(--accent)";
}
function stateName(s) {
  return s === "landed" ? "已落地" : s === "dropped" ? "已否" : "还开着";
}

function viewWindow() {
  const first = recs.length ? recs[0].t : now;
  const last = recs.length ? recs[recs.length - 1].t : now;
  const pad = Math.max(2, Math.min(20, (last - first) * 0.15));
  let start = first - pad;
  let end = last + pad;
  const maxSpan = WINDOW_MS / 1000 / zoom;
  if (end - start > maxSpan) start = end - maxSpan;
  if (end - start < 6) { const mid = (start + end) / 2; start = mid - 3; end = mid + 3; }
  if (!following && viewEnd != null) { const w = end - start; end = viewEnd; start = end - w; }
  return { start, end: Math.max(end, start + 1) };
}
function laneOf(id) {
  const i = branches.findIndex((b) => b.id === id);
  return i < 0 ? 0 : i;
}

function draw() {
  const box = stage.getBoundingClientRect();
  const W = Math.max(320, box.width), H = Math.max(200, box.height);
  stage.setAttribute("viewBox", `0 0 ${W} ${H}`);
  pic.replaceChildren();

  const n = Math.max(1, branches.length);
  const laneH = Math.max(CHIP_H + 14, Math.min(112, (H - TOP - 60) / n));
  const { start, end } = viewWindow();
  const X = (t) => GUTTER + ((t - start) / (end - start)) * (W - GUTTER - PAD_R);
  const mainY = TOP;

  pic.appendChild(el("line", { x1: GUTTER - 8, y1: mainY, x2: W - PAD_R, y2: mainY,
    stroke: "var(--line-strong)", "stroke-width": 3 }));
  pic.appendChild(text(GUTTER - 8, mainY - 12, "main", { fill: "var(--dim)", "font-size": 11.5 }));

  // 同一刻岔出的几条共用一根竖干，否则挤成一团黑线。
  const fans = [];
  branches.forEach((b) => {
    const x = X(b.t);
    let fan = fans.find((f) => Math.abs(f.x - x) < 16);
    if (!fan) { fan = { x, ids: [] }; fans.push(fan); }
    fan.ids.push(b.id);
  });
  fans.forEach((f) => {
    if (f.ids.length < 2) return;
    const lanes = f.ids.map((id) => TOP + (laneOf(id) + 1) * laneH);
    pic.appendChild(el("line", { x1: f.x, y1: mainY, x2: f.x, y2: Math.max(...lanes),
      stroke: "var(--line-strong)", "stroke-width": 2 }));
    pic.appendChild(el("circle", { cx: f.x, cy: mainY, r: 4.5, fill: "var(--fg)" }));
  });

  branches.forEach((b, i) => {
    const y = TOP + (i + 1) * laneH;
    const c = stateColor(b.state);
    const on = b.id === selected;
    const x0 = X(b.t);
    const fan = fans.find((f) => f.ids.includes(b.id));

    if (b.t >= start && fan.ids.length === 1) {
      pic.appendChild(el("path", {
        d: `M${x0} ${mainY} C ${x0 + 12} ${mainY} ${x0 + 12} ${y} ${x0 + 24} ${y}`,
        fill: "none", stroke: c, "stroke-width": on ? 3 : 2,
      }));
      pic.appendChild(el("circle", { cx: x0, cy: mainY, r: 4.5, fill: c }));
    }
    const fromX = b.t >= start ? (fan.ids.length > 1 ? x0 : x0 + 24) : GUTTER;

    const mine = recs.filter((r) => r.id === b.id);
    const lastT = mine.length ? mine[mine.length - 1].t : b.t;
    const x1 = b.state === "open" ? W - PAD_R : X(Math.max(b.t, lastT, start));
    pic.appendChild(el("line", {
      x1: fromX, y1: y, x2: Math.max(fromX, x1), y2: y, stroke: c,
      "stroke-width": on ? 3 : 2,
      "stroke-dasharray": b.state === "open" ? "6 5" : "",
      opacity: b.state === "dropped" ? .55 : .95,
    }));
    if (b.state === "dropped") {
      pic.appendChild(el("path", {
        d: `M${x1 - 5} ${y - 5} l10 10 M${x1 + 5} ${y - 5} l-10 10`,
        stroke: c, "stroke-width": 2,
      }));
    }
    if (b.state === "landed") {
      pic.appendChild(el("path", {
        d: `M${x1} ${y} C ${x1 + 14} ${y} ${x1 + 14} ${mainY} ${x1 + 28} ${mainY}`,
        fill: "none", stroke: c, "stroke-width": 2,
      }));
    }

    // 左边：一条分支 = 一个按钮。点它是人的动作。
    // 两行：第一行是它叫什么（读得清），第二行是代号、状态和条数（查得到）。
    const chipX = 12, chipY = y - CHIP_H / 2;
    const chip = el("g", { style: "cursor:pointer" });
    const rect = el("rect", {
      x: chipX, y: chipY, width: CHIP_W, height: CHIP_H, rx: 6,
      fill: on ? "#16241e" : "var(--panel)", stroke: c,
      "stroke-width": on ? 1.6 : 1, "stroke-opacity": on ? .95 : .38,
    });
    chip.appendChild(rect);
    // 左边一条状态竖条：不靠颜色深浅猜状态。
    chip.appendChild(el("rect", {
      x: chipX, y: chipY + 8, width: 3, height: CHIP_H - 16, rx: 1.5, fill: c,
      opacity: b.state === "dropped" ? .5 : 1,
    }));
    chip.appendChild(text(chipX + 13, chipY + 19, clip(b.text, 17),
      { fill: on ? "var(--fg)" : "#c6d3df", "font-size": 13, "font-weight": on ? 600 : 400 }));
    chip.appendChild(text(chipX + 13, chipY + 34,
      `${b.id} · ${stateName(b.state)} · ${Math.max(0, mine.length - 1)} 条`,
      { fill: c, "font-size": 10.5, "fill-opacity": .85 }));
    chip.addEventListener("click", () => select(b.id));
    chip.addEventListener("mouseenter", () => rect.setAttribute("stroke-opacity", "1"));
    chip.addEventListener("mouseleave", () => rect.setAttribute("stroke-opacity", on ? ".95" : ".38"));
    pic.appendChild(chip);
  });

  recs.forEach((r, idx) => {
    if (r.t < start || r.t > end) return;
    const y = r.kind === "fork" ? mainY : TOP + (laneOf(r.id) + 1) * laneH;
    const b = branches.find((x) => x.id === r.id);
    const c = r.kind === "fork" ? "var(--fg)" : stateColor(b ? b.state : "open");
    pic.appendChild(el("circle", { cx: X(r.t), cy: y, r: r.kind === "fork" ? 5 : 3.5, fill: c }));
    // 点一个点 = 跳到这一条记录：选中它那条线，右边滚到它。
    const hit = el("circle", { cx: X(r.t), cy: y, r: 11, fill: "transparent",
      style: "cursor:pointer" });
    hit.addEventListener("click", () => focusRec(r.id, idx));
    pic.appendChild(hit);
  });

  if (following) {
    const xn = W - PAD_R;
    pic.appendChild(el("line", { x1: xn, y1: mainY - 24, x2: xn, y2: TOP + (branches.length + 1) * laneH,
      stroke: "var(--line)", "stroke-width": 1, "stroke-dasharray": "4 4" }));
    pic.appendChild(text(xn - 6, mainY - 28, "now", { "text-anchor": "end", "font-size": 11 }));
  }

  metaEl.textContent = `${branches.length} branches · ${recs.length} recs · ${fmtTime(start)}–${fmtTime(end)}`;
}

// 选一条分支 = 把它的全部记录摆到右边。再点一次收起。
function select(id) {
  selected = selected === id ? "" : id;
  renderAside();
  draw();
}

// 从时间轴上的点跳进右边：同一条线里定位到那一条记录，闪一下。
function focusRec(id, idx) {
  selected = id;
  renderAside(idx);
  draw();
}
function renderAside(focusIdx = -1) {
  const b = branches.find((x) => x.id === selected);
  aside.hidden = !b;
  if (!b) return;
  asideTitle.textContent = `${b.id} · ${b.text}`;
  asideState.textContent = stateName(b.state);
  asideState.style.color = stateColor(b.state);
  asideList.replaceChildren();
  const mine = recs.filter((r) => r.id === b.id);
  if (mine.length < 2) {
    const p = document.createElement("div");
    p.id = "aside-empty";
    p.textContent = "这条线只有一个分叉点，还没有别的记录";
    asideList.append(p);
    return;
  }
  const base = recs.findIndex((x) => x.id === b.id);
  let hitEl = null;
  mine.forEach((r, i) => {
    const d = document.createElement("div");
    d.className = `rec ${r.kind}`;
    const head = document.createElement("div");
    const t = document.createElement("span");
    t.className = "t"; t.textContent = fmtTime(r.t);
    const k = document.createElement("span");
    k.className = "k"; k.textContent = r.kind;
    head.append(t, k);
    const x = document.createElement("div");
    x.className = "x"; x.textContent = r.text;
    d.append(head, x);
    asideList.append(d);
    if (base + i === focusIdx) hitEl = d;
  });
  if (hitEl) {
    hitEl.classList.add("hit");
    hitEl.scrollIntoView({ block: "center" });
  }
}
asideClose.addEventListener("click", () => { selected = ""; renderAside(); draw(); });

function setFollow(on) {
  following = on;
  followBtn.classList.toggle("on", on);
  followBtn.textContent = on ? "following" : "paused";
  if (on) viewEnd = null;
  draw();
}
followBtn.addEventListener("click", () => setFollow(!following));

stage.addEventListener("wheel", (e) => {
  e.preventDefault();
  zoom = Math.min(8, Math.max(0.5, zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
  draw();
}, { passive: false });

let dragX = null;
stage.addEventListener("pointerdown", (e) => { dragX = e.clientX; });
stage.addEventListener("pointerup", () => { dragX = null; });
stage.addEventListener("pointermove", (e) => {
  if (dragX == null) return;
  const dx = e.clientX - dragX;
  if (Math.abs(dx) < 3) return;
  const box = stage.getBoundingClientRect();
  const { start, end } = viewWindow();
  const perPx = (end - start) / Math.max(1, box.width - GUTTER - PAD_R);
  viewEnd = (following ? end : viewEnd == null ? end : viewEnd) - dx * perPx;
  following = false;
  followBtn.classList.remove("on");
  followBtn.textContent = "paused";
  dragX = e.clientX;
  draw();
});

// ---- 连接 -----------------------------------------------------------------
let sock = null;
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  sock = new WebSocket(`${proto}://${location.host}/ws`);
  sock.addEventListener("message", (ev) => {
    let f;
    try { f = JSON.parse(ev.data); } catch (e) { return; }
    if (f.type === "state") {
      recs = f.recs || []; branches = f.branches || []; topic = f.topic || "";
      now = f.now || Date.now() / 1000;
      topicEl.textContent = topic || "untitled discussion";
      renderAside(); draw();
    } else if (f.type === "rec") {
      recs.push(f.rec);
      branches = f.branches || branches;
      now = Date.now() / 1000;
      renderAside(); draw();
    }
  });
  sock.addEventListener("close", () => setTimeout(connect, 1200));
}
connect();

setInterval(() => { if (!following) return; now = Date.now() / 1000; draw(); }, 500);
addEventListener("resize", draw);
</script>
</body></html>
