const PEAK_DECAY_DB = 0.25;        // 每行峰值衰减（≈1.25 dB/s）
const EMA_ALPHA = 0.08;            // 每频带慢速均值的更新率（≈2.5s 时间常数）
const DEV_FLOOR = 2.5;             // 白化门限：高出自己均值这么多分贝才出声（越高越疏）
const DEV_FULL = 12.0;             // 高出这么多分贝 = 满亮度
const CELL_STRIDE = 1;             // 段内每 N 列画一个字（密度旋钮）
const GLYPH_TRIES = 6;             // 同一条内不重复，最多重抽几次

let rows = [];                     // rows[0] = 最新一行：{ g: 字形或 null, a: 透明度 }
let rowTickAt = 0;                 // 上一次产出时刻 = 前端时钟的相位
let ema = [];                      // 每个频带自己的慢速均值（白化基线）
let rmsPeak = -120;                // 衰减峰值：门限拿它当参照
let bmax = [], bmin = [];          // 每频带的衰减最高/抬升最低（逐带 AGC 的两端）
let loudSmooth = 0;                // 平滑后的"呼吸量"：直接用它会让整片 5Hz 闪

// 逐频带 AGC：每个频带按**它自己的**历史区间归一，所以"能量天然堆在低频"这件事
// 不再把整屏压到左边。返回每个频带 0..1 的能量。
function agcEnergies(bins, dt) {
  const nb = bins.length;
  if (bmax.length !== nb) { bmax = bins.slice(); bmin = bins.slice(); }
  const out = new Array(nb);
  for (let k = 0; k < nb; k++) {
    const db = bins[k];
    bmax[k] = Math.max(db, bmax[k] - AGC_DECAY_DB * dt);
    bmin[k] = Math.min(db, bmin[k] + AGC_DECAY_DB * dt);
    const range = bmax[k] - bmin[k];
    out[k] = (bmax[k] > AGC_ABS_FLOOR && range >= AGC_MIN_RANGE)
      ? Math.min(1, Math.max(0, (db - bmin[k]) / range))
      : 0;                          // 这一带从来没出过声 / 只有噪声：不参与
  }
  return out;
}

// 雨只铺到升字区上沿：两层各占各的地，谁也不盖谁。升字区高度固定，所以这个界限
// 只跟窗口高度有关，与列数无关。
function rainCapacity() {
  const floorY = Math.max(0, BAR_FLOOR_Y());
  return Math.max(1, Math.floor(floorY / ROW_PITCH) + 2);
}

// 频带 → 列区间的分配表：累计权重取整，保证每段至少一列、末段收在总宽上。
function bandSpans(nb, total) {
  const raw = [];
  let sum = 0;
  for (let k = 0; k < nb; k++) { const v = 1 / Math.pow(k + 1, BAND_TILT); raw.push(v); sum += v; }
  const spans = [];
  let acc = 0, prev = 0;
  for (let k = 0; k < nb; k++) {
    acc += raw[k];
    let end = Math.round((total * acc) / sum);
    if (end < prev + 1) end = prev + 1;
    if (end > total) end = total;
    spans.push({ lo: prev, hi: end });
    prev = end;
  }
  if (spans.length) spans[spans.length - 1].hi = total;   // 收尾对齐右边界
  return spans;
}
let bands = bandSpans((feed.spectrum_bins || []).length || 16, RAIN_COLS);

const randGlyph = () => Math.floor(Math.random() * CHARSET.length);

// 同一条（段）内不重复：重抽几次，抽不到就用最后一次，避免退化成死循环。
function glyphUniqueIn(used) {
  let g = randGlyph();
  for (let t = 0; t < GLYPH_TRIES && used.has(g); t++) g = randGlyph();
  used.add(g);
  return g;
}

// 帧内相对高低：每帧摊满 0..1，跟绝对分贝无关。
function frameShape(bins) {
  const lo = Math.min(...bins), hi = Math.max(...bins);
  const span = Math.max(1e-6, hi - lo);
  return (db) => (db - lo) / span;
}

// 'hybrid'：白化决定出声与亮度，帧内归一决定段长。
function fillHybrid(g, a, bins) {
  const shape = frameShape(bins);
  for (let k = 0; k < bins.length && k < bands.length; k++) {
    const dev = bins[k] - ema[k];
    if (dev < DEV_FLOOR) continue;                 // 不比自己的基线响：这一行这段不出声
    const sp = bands[k], width = sp.hi - sp.lo;
    const len = Math.max(1, Math.round(shape(bins[k]) * width));
    const alpha = 0.5 + 0.5 * Math.min(1, dev / DEV_FULL);
    const used = new Set();
    for (let c = sp.lo; c < sp.lo + len && c < g.length; c += CELL_STRIDE) {
      g[c] = glyphUniqueIn(used);
      a[c] = alpha;
    }
  }
}

// 'bars'：帧内归一的条形图，不做白化。
function fillBars(g, a, bins) {
  const shape = frameShape(bins);
  for (let k = 0; k < bins.length && k < bands.length; k++) {
    const sp = bands[k], width = sp.hi - sp.lo;
    const len = Math.round(shape(bins[k]) * width);
    const used = new Set();
    for (let c = sp.lo; c < sp.lo + len && c < g.length; c += CELL_STRIDE) {
      g[c] = glyphUniqueIn(used);
      a[c] = 1;
    }
  }
}

// 'edge'：每段只落一个点，位置由帧内归一决定。
function fillEdge(g, a, bins) {
  const shape = frameShape(bins);
  for (let k = 0; k < bins.length && k < bands.length; k++) {
    const sp = bands[k], width = sp.hi - sp.lo;
    const col = sp.lo + Math.min(width - 1, Math.floor(shape(bins[k]) * width));
    g[col] = randGlyph();
    a[col] = 1;
  }
}

// 产出一行：门限开着就按当前这帧 topic 算字，否则整行空。
function produceRow(now) {
  const n = RAIN_COLS;
  const g = new Array(n).fill(null);
  const a = new Array(n).fill(0);
  const bins = feed.spectrum_bins;
  if (bins.length && ema.length !== bins.length) ema = new Array(bins.length).fill(null);

  // 白化基线始终跟着更新（静音也更新），否则声音回来时基线是旧的，会误判成"变化"
  for (let k = 0; k < bins.length; k++) {
    ema[k] = ema[k] === null ? bins[k] : ema[k] + EMA_ALPHA * (bins[k] - ema[k]);
  }
  rmsPeak = Math.max(feed.rms_db, rmsPeak - PEAK_DECAY_DB);

  const fresh = feed.role === 'ghost' && now - ghostAt <= FRAME_MS * 1.5;
  const gateFloor = Math.max(RMS_FLOOR, rmsPeak - GATE_DROP_DB);
  const gateOpen = fresh && feed.rms_db > gateFloor;
  // 这一行的"呼吸量"：0 = 刚到门限，1 = 达到最近峰值。整片的亮度与字的大小都跟着它。
  const loud = Math.min(1, Math.max(0, (feed.rms_db - gateFloor) / GATE_DROP_DB));
  if (gateOpen && bins.length) {
    if (bands.length !== bins.length) bands = bandSpans(bins.length, RAIN_COLS);
    if (RAIN_MODE === 'hybrid') fillHybrid(g, a, bins);
    else if (RAIN_MODE === 'bars') fillBars(g, a, bins);
    else fillEdge(g, a, bins);
  }

  rows.unshift({ g, a, loud });
  while (rows.length > rainCapacity()) rows.pop();
  rowTickAt = now;
}

// ── 'columns'：逐列独立的 Matrix 列雨 ──────────────────────────────────
// 每一列一个粒子队列。列的横坐标 t ∈ [0,1] 映射到一个频点（16 个桶线性插值），
// 该频点此刻的能量 e 决定这一列的一切：
//     下落速度  v = SPEED_MIN + (SPEED_MAX-SPEED_MIN) * e
//     落字间隔  T = 字距 / v，字距 = 从一格到三格随 e 变（强列密，弱列疏）
//     尾迹长度  点亮 TAIL_LIT 个字，再往上的尾部淡到 TAIL_DIM
// 于是"哪几列在下雨"就是"哪几个频带在出声"，元音一变活跃的列就换一批。
function stepRainColumns(dt, now, loud, gateOpen) {
  const bins = feed.spectrum_bins;
  const nb = bins.length;
  const colE = nb ? agcEnergies(bins, dt) : [];
  const n = cols.length;
  for (let i = 0; i < n; i++) {
    const c = cols[i];
    const t = n > 1 ? i / (n - 1) : 0;
    let target = 0;
    if (gateOpen && nb) {
      // 这一列的横坐标落在哪两个频带之间 → 把两带的能量插值给它
      const pos = t * (nb - 1), bi = Math.floor(pos), fr = pos - bi;
      const e0 = colE[Math.min(bi, nb - 1)], e1 = colE[Math.min(bi + 1, nb - 1)];
      target = (e0 + (e1 - e0) * fr) * (0.15 + 0.85 * loud);
    }
    c.e += (target - c.e) * Math.min(1, dt * 6);      // 平滑：能量抖动不该让列抽筋

    const v = (SPEED_MIN + (SPEED_MAX - SPEED_MIN) * c.e) * c.jitter;

    // **一列一个速度**：整列的字一起落，速度听这一列此刻的能量。
    // 试过"每颗字在出生时定死速度"（想让声音停了以后旧字赶紧走完），代价是快的会追上慢的：
    // 要么穿过去（同一处被不同字形反复覆盖 = 闪），要么加一道最小间距闸——但那样快的字
    // 会**堆在慢的后面**，整列退化成跟着最慢那颗走。两个都不是雨该有的样子。
    // 现在回到整列同速：不可能追尾（间距就是落字时的间距），速度也照样跟着声音走。
    // 声音停了旧字会一起慢下来这件事，靠把 SPEED_MIN 抬高解决（见常量）。
    const fall = v * dt;

    if (c.e > EMIT_EPS) {
      const spacing = SPACE_MIN + (SPACE_MAX - SPACE_MIN) * (1 - c.e);
      if (now >= c.nextAt) {
        c.parts.push({ g: randGlyph(), y: -GH });
        c.nextAt = now + (spacing / Math.max(1, v)) * 1000;
      }
    } else {
      c.nextAt = now;                                  // 停了就随时可以从头开始下
    }

    for (const p of c.parts) p.y += fall;
    const rainFloor = Math.max(0, BAR_FLOOR_Y());
    let alive = 0;
    for (let k = 0; k < c.parts.length; k++) {          // 淘汰过底线的（最老的在前）
      if (c.parts[k].y <= rainFloor) break;
      alive++;
    }
    if (alive) c.parts.splice(0, alive);
    if (c.parts.length > TAIL_LIT * 2) c.parts.splice(0, c.parts.length - TAIL_LIT * 2);

    const base = BREATH_MIN + (1 - BREATH_MIN) * loud;  // 呼吸：整片随音量亮暗
    const zoom = 1 + BREATH_SCALE * loud;
    const w = GW * zoom, h = GH * zoom;
    const cnt = c.parts.length;
    for (let k = 0; k < cnt; k++) {
      const p = c.parts[k];
      const age = cnt - 1 - k;                          // 0 = 最新的那颗（雨头）
      // 雨头就是最新那颗，直接给满亮度、用白字。曾试过按年龄淡入（想压掉顶端那点闪），
      // 但闪的是**听侧**那一波浪，不是雨这边 —— 那一下只是把白雨头压暗了，观感反而变差。
      // 恢复原样：雨头干脆、白亮。
      const fade = age === 0 ? 1 : Math.max(TAIL_DIM, 1 - age / TAIL_LIT);
      const edge = Math.max(0, Math.min(1, (rainFloor - p.y) / RAIN_FLOOR_FADE));
      bctx.globalAlpha = Math.min(1, base * fade * edge);
      const img = age === 0 ? headAtlas : atlas;        // 雨头白亮，尾绿
      bctx.drawImage(img, p.g * GW, 0, GW, GH,
        c.x + (GW - w) / 2, p.y + (GH - h) / 2, w, h);
    }
  }
  bctx.globalAlpha = 1;
}

function stepRain(dt, now) {
  if (RAIN_MODE === 'columns') {
    const gateFloor = Math.max(RMS_FLOOR, rmsPeak - GATE_DROP_DB);
    rmsPeak = Math.max(feed.rms_db, rmsPeak - PEAK_DECAY_DB * (dt * 5));
    const fresh = feed.role === 'ghost' && now - ghostAt <= FEED_STALE_MS;
    const gateOpen = fresh && feed.rms_db > gateFloor;
    const loud = gateOpen ? Math.min(1, Math.max(0, (feed.rms_db - gateFloor) / GATE_DROP_DB)) : 0;
    // 平滑：topic 是 5Hz 来的，直接用会让整片亮度每秒跳五次 —— 那就是看到的"闪"
    loudSmooth += (loud - loudSmooth) * Math.min(1, dt * LOUD_SMOOTH);
    stepRainColumns(dt, now, loudSmooth, gateOpen);
    return;
  }

  if (!rowTickAt) rowTickAt = now - FRAME_MS;
  let produced = 0;
  while (now - rowTickAt >= FRAME_MS && produced < CATCHUP_MAX) {
    produceRow(rowTickAt + FRAME_MS);     // 按时间轴补产：补出来的行多为空白（手上没有新帧）
    produced++;
  }

  // 分数位移：一行的间距在一整个 200ms 里平滑铺开，所以 5Hz 的生产看起来是连续下落
  const shift = Math.min(1, (now - rowTickAt) / FRAME_MS) * ROW_PITCH;
  const cap = rows.length;
  const zoom = 1 + BREATH_SCALE * (rows.length ? rows[0].loud : 0);   // 呼吸：整片随音量微微胀缩
  const w = GW * zoom, h = GH * zoom;
  const floorY = BAR_FLOOR_Y();   // 升字区上沿：雨到这儿为止，不盖住人说话那层
  for (let r = 0; r < cap; r++) {
    const y = (r - 1) * ROW_PITCH + shift;   // 最新一行从屏幕上方一格滑入
    if (y > floorY) break;
    const row = rows[r];
    // 渐隐（位置越靠下越淡，但不归零：位置仍是时间） × 呼吸（整片随当前音量亮暗）
    const base = (FADE_BOTTOM + (1 - FADE_BOTTOM) * Math.max(0, 1 - y / viewH))
      * (BREATH_MIN + (1 - BREATH_MIN) * row.loud);
    if (base <= 0.01) continue;
    for (let i = 0; i < row.g.length; i++) {
      const gg = row.g[i];
      if (gg === null) continue;
      bctx.globalAlpha = Math.min(1, base * (row.a[i] || 1));
      bctx.drawImage(atlas, gg * GW, 0, GW, GH,
        cols[i].x + (GW - w) / 2, y + (GH - h) / 2, w, h);
    }
  }
  bctx.globalAlpha = 1;
}
// 16 个频带 → 48 格：线性插值铺满。0dB 的绝对电平没有意义，所以用固定窗口
// (floor..ceil) 而不是自适应 —— 自适应会让安静时的底噪被放大成满格。
function resampleBins(bins) {
  const n = bins.length;
  if (barSrc.length !== BAR_CELLS) barSrc = new Array(BAR_CELLS).fill(0);
  if (!n) { for (let i = 0; i < BAR_CELLS; i++) barSrc[i] = 0; return barSrc; }
  for (let i = 0; i < BAR_CELLS; i++) {
    const pos = (i / (BAR_CELLS - 1)) * (n - 1);
    const lo = Math.floor(pos), hi = Math.min(lo + 1, n - 1), fr = pos - lo;
    const db = bins[lo] + (bins[hi] - bins[lo]) * fr;
    const t = (db - BAR_DB_FLOOR) / (BAR_DB_CEIL - BAR_DB_FLOOR);
    barSrc[i] = Math.max(0, Math.min(1, t));
  }
  return barSrc;
}

// 每一格 = 一个频点：这一格此刻有多响，就决定它长出多高的一串字。
// 一层 = 一格字高。想让浪更连续，密的是列、不是层：层数固定，宽度用来铺满。
const RISE_COLS = 28;              // 升字列数 —— 比雨的 60 列疏，浪才看得出形状
const RISE_SMOOTH = 0.35;          // 相邻列的能量平滑：锯齿来自频带跳变，不是声音本身
const RISE_BELL = 0.62;            // 钟形包络强度：0 = 平坦，1 = 完全按正态分布压

function drawListenerRise(dt, now) {
  const bins = userFeed.spectrum_bins || [];
  // 门限与画法必须同尺度：GATE 是 rms_db 的门（-45），而 bins 是各帧自归一化后的
  // 相对值（安静时最强桶也只到 -20 上下）。拿 GATE 去比 bins，等于用一把尺量另一把
  // 尺的量出的数——人说话时两侧都过门，一静下来 bin 落回 -25 就误判成"没声音"，
  // 一层字都不画。所以这里按 rms_db 判活，画幅交给 BAR_DB_FLOOR..BAR_DB_CEIL。
  // 门就取 BAR_DB_FLOOR：显示窗口的下沿才定义"这帧能不能长出字"，两个门没必要分开。
  const live = userFeed.rms_db > BAR_DB_FLOOR && now - userAt <= FEED_STALE_MS;
  resampleBins(live ? bins : []);

  // 层数 = 屏高 × 目标比例 ÷ 字高。原来写死 7 层 —— 812 高的屏上只有 140px ≈ 17%，
  // 浪只像底部一层毛边，而且"一格最多长 7 层"这件事跟屏多大无关，本来就不该写死。
  const needRows = Math.max(6, Math.round((viewH * RISE_TARGET_FRAC) / GH));
  if (RISE_ROWS !== needRows) {
    RISE_ROWS = needRows;
    riseHeights = []; riseFilled = []; riseGlyphs = [];
  }
  if (riseHeights.length !== RISE_COLS) {
    riseHeights = new Array(RISE_COLS).fill(0);
    riseFilled = new Array(RISE_COLS).fill(0);
    riseGlyphs = Array.from({ length: RISE_COLS }, () =>
      Array.from({ length: RISE_ROWS }, () => randGlyph()));
  }

  // 把 48 格的 barSrc 再抽到 RISE_COLS 列，并做一次横向平滑 —— 浪要连成起伏，
  // 不是一排各自独立的钉子。
  const colV = [];
  for (let i = 0; i < RISE_COLS; i++) {
    const pos = (i / (RISE_COLS - 1)) * (BAR_CELLS - 1);
    const lo = Math.floor(pos), hi = Math.min(lo + 1, BAR_CELLS - 1), fr = pos - lo;
    colV.push(barSrc[lo] + (barSrc[hi] - barSrc[lo]) * fr);
  }
  const colS = colV.slice();
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 1; i < RISE_COLS - 1; i++) {
      colS[i] += (colV[i - 1] + colV[i + 1] - 2 * colV[i]) * RISE_SMOOTH;
    }
  }

  // 钟形包络：字不该挤在某一侧，而该像正态分布 —— 中段最盛、两侧渐稀。
  // 这是**画法**不是数据：频谱本身长什么样仍由 colS 决定，钟形只给它一个重心。
  const mid = (RISE_COLS - 1) / 2;
  for (let i = 0; i < RISE_COLS; i++) {
    const z = (i - mid) / (RISE_COLS * 0.32);   // 标准差 ≈ 屏宽的 32%
    const bell = Math.exp(-0.5 * z * z);
    colS[i] = colS[i] * ((1 - RISE_BELL) + bell * RISE_BELL);
  }

  // 列能量的**时间**平滑。频谱帧是 5Hz 来的：每一帧直接拿来当高度，等于让整个浪头
  // 每秒上下抖五次 —— 横向平滑解决不了这个，那是空间上的锯齿，这是时间上的。
  // 涨得快、落得慢，浪才是"起伏"，而不是一排各自跳动的钉子。
  if (riseEnv.length !== RISE_COLS) riseEnv = new Array(RISE_COLS).fill(0);
  for (let i = 0; i < RISE_COLS; i++) {
    const tau = colS[i] > riseEnv[i] ? RISE_ENV_ATTACK_S : RISE_ENV_RELEASE_S;
    riseEnv[i] += (colS[i] - riseEnv[i]) * Math.min(1, dt / tau);
  }

  // 归一化：让**最强的列**长到 RISE_ROWS 的 RISE_PEAK_TARGET 那么高。这样"浪的平均高度"
  // 钉在屏高的一定比例上，不会随话筒电平、说话远近整体上下漂 —— 形状仍由 colS 决定，
  // 归一化只决定它画多大。参考峰慢慢回落（不是每帧重算），所以它不会自己抖。
  let peak = 0;
  for (let i = 0; i < RISE_COLS; i++) peak = Math.max(peak, riseEnv[i]);
  riseRef = Math.max(peak, riseRef - (dt / RISE_REF_FALL_S) * riseRef);
  const norm = RISE_PEAK_TARGET / Math.max(riseRef, RISE_REF_FLOOR);

  // 列宽 = 屏宽 / 列数，但字形按格距居中：字比格窄，所以列与列之间自然有缝，
  // 而那点缝正好让浪看起来是"一串字"而不是一堵墙。
  const colW = viewW / RISE_COLS;
  const baseY = viewH - 2;
  const RISE_OFFSET = GH / 2;        // 与雨错开半格：两条浪不落在同一行上
  // 每列的字横坐标：整列共用，避免逐层算出来错位
  for (let i = 0; i < RISE_COLS; i++) {
    const want = Math.max(0, Math.min(1, riseEnv[i] * norm)) * RISE_ROWS;
    // 按**时间常数**逼近期望高度，而不是每帧按固定比例衰减：帧率一变，观感就变。
    const tau = want > riseHeights[i] ? RISE_ATTACK_S : RISE_RELEASE_S;
    riseHeights[i] += (want - riseHeights[i]) * Math.min(1, dt / tau);
    const h = riseHeights[i];
    const full = Math.floor(h);
    const x = i * colW + colW / 2;
    const energy = Math.max(0, Math.min(1, colS[i]));
    // 换字只换**这一帧刚长出来的**那几层。原来每帧对每一层都掷 10%×energy 的骰子，
    // 浪头那颗字一秒钟要换好几次 —— 那才是"疯狂闪烁"的直接来源。
    for (let k = riseFilled[i]; k < full && k < RISE_ROWS; k++) riseGlyphs[i][k] = randGlyph();
    riseFilled[i] = Math.min(full, RISE_ROWS);
    // 真静音时一格都不画。此前 k <= full 在 full=0 时会留下一层底痕 —— 那让"没声音"
    // 也看着有字，正是要避免的。层的存在必须完全由高度决定。
    for (let k = 0; k < full && k < RISE_ROWS; k++) {
      const y = baseY - (k + 1) * GH - RISE_OFFSET;
      const dim = k / RISE_ROWS;                      // 越高越淡：尾部渐隐
      const top = k === Math.min(full, RISE_ROWS) - 1;  // 最上面那格才是"浪头"
      bctx.globalAlpha = (0.35 + 0.65 * (1 - dim)) * (0.30 + 0.70 * energy);
      bctx.drawImage(
        top ? headAtlas : atlas,
        riseGlyphs[i][k] * GW, 0, GW, GH,
        x - GW / 2, y, GW, GH);
    }
  }
  bctx.globalAlpha = 1;
}

let lastB = performance.now();
let fpsFrames = 0, fpsAt = performance.now();
function bgLoop() {
  requestAnimationFrame(bgLoop);
  const now = performance.now();
  const dt = (now - lastB) / 1000; lastB = now;

  fpsFrames++;
  if (now - fpsAt >= 500) {
    fps = Math.round((fpsFrames * 1000) / (now - fpsAt));
    fpsFrames = 0; fpsAt = now;
    renderLink();
  }

  bctx.clearRect(0, 0, viewW, viewH);
  // 灯：只由"最近一次心跳有多新"决定，与有没有收到 state 帧无关。
  if (thinkEl) {
    thinkEl.classList.toggle('on', ghostBeatAt > 0 && now - ghostBeatAt < GHOST_KEEP_MS);
  }
  const speaking = feed.rms_db > GATE && feedFresh();
  // MOSS 文字吃断线判定：链路死了它就不该继续发光（传导，不是恢复）
  mossEl.classList.toggle('alive', speaking && feed.role === 'ghost');
  // 雨永远在画：它是"最近约十秒的录音带"，静音只是让空白行把旧内容顶出去，
  // 而不是让画面停住或当场清空。
  stepRain(dt, now);
  // 听侧常画：静音时只剩一格底痕，但那一层始终在 —— 人不需要先出声才发现自己被听着。
  drawListenerRise(dt, now);
  // 池子：home 空闲时，所有 item 的那片场（缓慢漂移，视差分档）
  stepPool(dt);
}
requestAnimationFrame(bgLoop);

// ===== pool：home 的池子 =====
// home = 舞台空闲。空闲时不该是一片虚空：**所有开着的 item**（含已入组的）都在这里，
// 按 recency 排成前景 / 中景 / 远景 —— 越老越远、越小、越糊，糊就是"现在不是说它"
// （这个语法取自《极限审判》里 AI 法官开场那一片物料）。
//
// 这一层只画画像（脸 + 名字），不画 iframe —— 活页由 awake 那一层在指针进场时摆上来。
const poolEl = $('#pool');
const tiles = new Map();     // id -> { el, band, bl }
let poolHover = null;        // 指针正停在哪一张上（焦点拉伸系数的来源）
let poolPhase = 0;           // 漂移相位（一直在走：那是"活着"）
let poolRot = 0;             // 螺旋的整体转角
const POOL_SPIN = 0.055;     // 约 2 分钟一圈：慢到不打扰，快到看得见
let poolSpin = POOL_SPIN;    // 当前角速度（rad/s）—— 缓动，不是开关
let poolSpinWant = POOL_SPIN;
let tileSeed = 0;            // 每块砖出生时领一个稳定序号（漂移相位的身份，不是池序）
// 醒（awake）：指针**停稳**在一块砖上 = 整片从"画像"变"屏幕"。
//
// 判据分两半，缺一不可：
//   · 时间 —— 在一块砖上累计待够 AWAKE_DWELL 毫秒（划过不算：停在那里和路过，在时间上
//     长得一样，光看时间分不开）；
//   · 位移 —— 这段时间里指针没走够 AWAKE_TRAVEL 像素（手还在走，就不算"停"）。
// 这两条是"悬停"这个词的可执行定义。落点不重要（一停十块都变），但没有这两条，
// 一滑过去整片就闪一次 —— 那读成"抽搐"，不是"场活了"。
const AWAKE_DWELL = 260;    // 悬停多久才算"停"（等于场停稳所需的时间）
const AWAKE_TRAVEL = 8;     // 这段时间里允许的累计位移（px）——超过就重新起算
const AWAKE_LEAVE_MS = 180; // 离场滞回：砖一直在漂，指针不动也会 enter/leave 抖
let awakeIds = [];          // 此刻亮着的活页（同一时刻一起亮、一起收）
let awakeLeaveAt = 0;       // 离场后的收回时刻（0 = 指针在场）
let hoverSince = 0;         // 指针停在这块砖上、且没走动的起点
let hoverTravel = 0;        // 从那个起点起累计走过的距离
let ptrX = -1, ptrY = -1;

const POOL_MAX = 14;         // 再老的不画 —— 不活跃的东西不该占视野
const GOLDEN = 2.399963229728653;   // 黄金角 137.5°（弧度）—— 向日葵螺旋的种子序
const POOL_EASE = 6;         // 槽位缓动速率（1/s）：排序一变，卡片是滑过去的，不是瞬移

// 池序从服务端来 —— 它是模型的决定（`raise` 写的），不是页面能从插入序猜出来的。
// 页面自己再算一遍 = 对同一件事有两个权威，那种账今天已经付过一次了。
let poolIds = [];
function poolOrder() { return poolIds.filter((id) => items.has(id)); }

function tileFace(id) {
  const t = tiles.get(id); if (!t) return;
  const it = items.get(id); if (!it) return;
  const art = it.face_art, line = it.face_line;
  el_setText(t.name, it.label || it.id);
  el_setText(t.line, line || '');
  t.line.style.display = line ? '' : 'none';
  t.el.classList.toggle('faced', !!line);
  // 图是可选项：节点不给，就不画 —— 一行字加一个名字已经是一张能认的脸。
  if (art) {
    if (t.art.getAttribute('src') !== art) t.art.setAttribute('src', art);
    t.art.style.display = ''; t.el.classList.add('arted');
  } else {
    t.art.removeAttribute('src'); t.art.style.display = 'none';
    t.el.classList.remove('arted');
  }
}

function el_setText(el, text) { if (el.textContent !== text) el.textContent = text; }

function makeTile(it) {
  const el = document.createElement('div');
  el.className = 'tile';
  const art = document.createElement('img'); art.className = 'tile-art';
  art.alt = ''; art.style.display = 'none';
  const line = document.createElement('span'); line.className = 'tile-line';
  const name = document.createElement('span'); name.className = 'tile-name';
  const caption = document.createElement('div'); caption.className = 'tile-caption';
  caption.append(line, name);
  el.append(art, caption);
  // hover = 焦点拉伸的入口，也是"醒"的计时器起点。只做"变大变清"，**绝不移动**
  // （理由见 layoutPool）。亮不亮由"停够没有"决定，不由"碰到了没有"决定。
  el.addEventListener('pointerenter', () => {
    poolHover = it.id;
    hoverSince = performance.now();      // 每进一块砖，重新起算"停"了多久
    hoverTravel = 0;
  });
  el.addEventListener('pointerleave', () => { if (poolHover === it.id) poolHover = null; });
  // 一下点击 = 看它整屏。这是一次**视图动作**：服务端回广播，并把 view_by 写进
  // notice 的状态面 —— 不再走 aside（旁路会丢，见 FEATURE「呈现模型」）。
  el.addEventListener('click', () => { send({ type: 'focus', id: it.id }); });
  poolEl.appendChild(el);
  // seed 是这块砖的**稳定**身份，不随池序变 —— 漂移的相位若挂在序号 k 上，
  // 每次重排所有卡片的抖动会同时跳一下，看着像全屏抽筋。
  tiles.set(it.id, { el, bl: -1, hk: 0, line, name, art, seed: tileSeed++,
                     bx: null, by: null, bu: null });
  tileFace(it.id);
}

function dropTile(id) {
  const t = tiles.get(id); if (!t) return;
  t.el.remove(); tiles.delete(id);
}

// 池子只在 home 且没有焦点时在场：焦点视图要独占舞台。
function poolOn() { return arena === '' && tiles.size > 0 && !focusId; }

// ---- awake：指针在场 = 整片瓷砖变屏幕 ----
// 两层各归各的：瓷砖层一直游动、永不装 iframe；slot 层一直物化、永不 reparent。
// 它们只在"指针在场"这一个状态上交接 —— 而且不是搬，是把那块 slot 摆到砖的位置上。
//
// 一次切换驱动全部，不是十块各自计时：同一件事有十个时钟，边缘擦过时读成一串碎闪，
// 而不是"场活了"。
function awakeNow() {
  return poolOrder().slice(0, POOL_MAX).filter((id) => {
    const it = items.get(id), t = tiles.get(id);
    return !!(it && it.slot && t);
  });
}

function awakeOn() {
  const ids = awakeNow();
  const same = ids.length === awakeIds.length && ids.every((id, k) => id === awakeIds[k]);
  if (same) { syncAwakeRects(); return; }
  awakeIds.forEach((id) => { if (!ids.includes(id)) retreatSlot(id); });
  const fresh = ids.filter((id) => !awakeIds.includes(id));
  awakeIds = ids;
  fresh.forEach(raiseSlot);        // 只对"这一批新亮的"做淡入，已亮的不重放动画
  syncAwakeRects();
}

function raiseSlot(id) {
  const it = items.get(id); if (!it || !it.slot) return;
  const s = it.slot;
  s.dataset.label = it.label || it.id;     // 名字跟着活页走（CSS ::after 取它）
  // 被 scale 的元素里，框与字都要预先乘回去；重排模式（PEEK_SCALE=false）没有缩放，乘 1。
  s.style.setProperty('--pb', String(PEEK_SCALE ? PEEK_BASE : 1));
  s.classList.remove('hidden');
  s.classList.add('peek', 'fade');
  // 淡入：先把 0 写进去、逼一次重排让它成为起点，再放开 —— 否则它和 display 的切换
  // 落在同一帧，transition 根本不会跑。
  s.style.opacity = '0';
  void s.offsetWidth;
  s.style.opacity = '1';
}

function retreatSlot(id) {
  const it = items.get(id); if (!it || !it.slot) return;
  const s = it.slot;
  s.classList.remove('peek', 'fade', 'pointed');
  s.style.opacity = '';
  s.style.left = s.style.top = s.style.width = s.style.height = '';
  s.style.transform = '';
  // 回到它本来该在的位置：还在舞台上或正被看着的留可见，其余收回 hidden。
  if (!stageIds.includes(id) && focusId !== id) s.classList.add('hidden');
}

function hideAwake() {
  awakeIds.forEach(retreatSlot);
  awakeIds = [];
}

// 框跟着砖走，而不是在亮出那一刻拍一张尺寸照：砖本身在漂、hover 放大也是缓动的，
// 一次性量下来的矩形会比砖最终的位置小一圈，看起来像"贴歪了"。
//
// 两种"变小"是两件事，取决于页面照什么尺寸排版：
//   PEEK_SCALE=true  光学缩小 —— 页面按 PEEK_BASE 倍渲染，再整体 scale 下去。
//                    看到的是**完整的原构图被拍扁**，像一张缩略图/海报。
//   PEEK_SCALE=false 重排 —— 盒子直接设成砖的矩形，页面按这个视口重新布局。
//                    看到的是**它真的变小之后长什么样**（响应式布局的真实结果）。
const PEEK_SCALE = true;
const PEEK_BASE = 4;         // 光学缩小时，页面按瓷砖的几倍尺寸渲染
const TILE_W = 264, TILE_H = 164;

function syncAwakeRects() {
  awakeIds.forEach((id) => {
    const it = items.get(id), t = tiles.get(id);
    if (!it || !it.slot || !t) return;
    const r = t.el.getBoundingClientRect();
    const s = it.slot;
    s.classList.toggle('pointed', id === poolHover);   // 框加粗=指针正停在这块
    s.style.left = `${r.left}px`; s.style.top = `${r.top}px`;
    if (PEEK_SCALE) {
      const bw = TILE_W * PEEK_BASE, bh = TILE_H * PEEK_BASE;
      s.style.width = `${bw}px`; s.style.height = `${bh}px`;
      s.style.transformOrigin = '0 0';
      s.style.transform = `scale(${(r.width / bw).toFixed(4)})`;
    } else {
      s.style.width = `${r.width}px`; s.style.height = `${r.height}px`;
      s.style.transform = '';
    }
  });
}

function layoutPool(dt = 0.016) {
  const x0 = railWidth(), w = Math.max(1, viewW - x0);
  // 旋心略低于中线、偏左三分：正中是墓碑位，偏一点才像有人在构图。
  const cx = x0 + w * 0.46, cy = viewH * 0.60;
  const RY = 0.56;                       // 竖直压扁 = 伪透视（把圆摊成一片"地"）
  const rmax = Math.min(w * 0.50, viewH * 0.50);
  const ids = poolOrder().slice(0, POOL_MAX);
  const n = Math.max(1, ids.length);
  // hover 系数逐帧缓动（不用 CSS transition：位置本来每帧都在写，两套动画会打架）。
  // 缓动让"升起来"是呼吸，不是抽搐。
  ids.forEach((id) => {
    const t = tiles.get(id); if (!t) return;
    const want = poolHover === id ? 1 : 0;
    t.hk = t.hk + (want - t.hk) * Math.min(1, dt * 9);
  });
  const anyHover = ids.reduce((m, id) => Math.max(m, tiles.get(id)?.hk || 0), 0);
  ids.forEach((id, k) => {
    const t = tiles.get(id); if (!t) return;
    const el = t.el;
    // 黄金回旋：半径 ∝ √序号，角度 ∝ 序号 —— 不重叠、有机、增删不必重排全场。
    const u = n === 1
      // 只有一件东西时，螺旋没有"场"可铺：它落在眼睛所在的地方（旋心、最近、最大）。
      // 通用公式会把它推到半径的六成处，一个孤零零的小瓷砖浮在大空白里。
      ? 0
      : Math.sqrt((k + 0.6) / (n + 0.6));      // 0（旋心/最近）→ 1（边缘/最老）
    const rad = rmax * u, ang = k * GOLDEN + poolRot;
    // 槽位（目标）与**显示位置**分开：池序一变，k 就变，槽位是瞬移的；
    // 让显示位置追着槽位走，卡片才是"滑"过去的，而不是跳过去。
    // 缓动的只有槽位 —— 呼吸（drift）照旧即时叠加，它是活着的证据，不该被平滑掉。
    const bxT = cx + rad * Math.cos(ang);
    const byT = cy + rad * Math.sin(ang) * RY - u * 46;
    if (t.bx === null) { t.bx = bxT; t.by = byT; t.bu = u; }   // 新砖不飞入：直接站在槽上
    const e = Math.min(1, dt * POOL_EASE);
    t.bx += (bxT - t.bx) * e;
    t.by += (byT - t.by) * e;
    t.bu += (u - t.bu) * e;
    // 远近由半径算出：越靠边越小、越糊、越淡、越往上抬（灭点在三分线上）
    const sc = 1.06 - t.bu * 0.44;
    // 双八度漂移：低频大摆 + 高频小抖；近的动得多，远的几乎不动（视差）。
    //
    // 幅度按**视口**算，不按固定像素：13px 在 1280 宽的屏上是呼吸，在 2560 宽上
    // 是一根头发 —— 同一份代码在两种屏上不该表现成两种性格。
    //
    // 而且只要有人把指针放在场上，整个**运动场**就缓动停住（不只是自转）：
    // 判据还是那条——**指针不许改变靶子的位置**。一个在你瞄准线下继续漂的场，
    // 就是把靶子从光标底下挪走。
    //
    // 相位挂在每块砖自己的 seed 上，不挂在序号 k 上：重排时 k 集体换位，
    // 挂在 k 上等于让全场的抖动同时跳一下。
    const amp = ((1 - t.bu) * 0.022 * Math.min(w, viewH)) + 5;
    const motion = 1 - anyHover;
    const s = t.seed;
    const drx = (Math.sin(poolPhase * .7 + s * .9) * .7 + Math.sin(poolPhase * 1.9 + s * 2.3) * .3) * amp * motion;
    const dry = (Math.cos(poolPhase * .6 + s * .7) * .7 + Math.cos(poolPhase * 1.7 + s * 1.9) * .3) * amp * .6 * motion;
    const x = t.bx + drx;
    const y = t.by + dry;
    const sel = false;
    const hk = t.hk || 0;
    // 焦点拉伸**原地**放大：transform-origin 是中心，所以光标永远还在它里面。
    // 一旦平移，光标会掉出边界 → enter/leave 互相打架 → 画面抽搐。
    // 邻居不让位，只降一点亮度："退到后面"用明暗说，不用位移说。
    const sc2 = sc * (1 + 0.26 * hk);
    el.style.transform = `translate(-50%,-50%) translate3d(${x}px, ${y}px, 0) scale(${sel ? sc2 * 1.16 : sc2})`;
    el.style.opacity = (sel ? 1 : (1 - t.bu * 0.28)) * (1 - 0.20 * anyHover * (1 - hk));
    el.style.zIndex = String(200 - k + (sel ? 50 : 0) + Math.round(hk * 400));
    // 模糊只做"一点点霜"：瓷砖是**可点的目标**，糊到认不出字就等于没做交互。
    // 远近的感觉主要交给缩放、压暗和漂移幅度，不是交给失焦。
    const bl = +((sel ? 0 : t.bu * 1.1) * (1 - hk)).toFixed(2);
    if (t.bl !== bl) { el.style.filter = bl ? `blur(${bl}px)` : ''; t.bl = bl; }
    el.classList.toggle('sel', sel);
    el.classList.toggle('lit', hk > 0.4);
  });
}

function syncPool() {
  const keep = new Set(poolOrder().slice(0, POOL_MAX));
  [...tiles.keys()].forEach((id) => { if (!keep.has(id)) { retreatSlot(id); dropTile(id); } });
  keep.forEach((id) => { if (!tiles.has(id) && items.has(id)) makeTile(items.get(id)); });
  const on = poolOn();
  if (!on) hideAwake();         // 池子不在场（切组 / 进焦点）时，活页必须收回
  poolEl.classList.toggle('on', on);
  document.body.classList.toggle('pool-on', on);
  desktop.style.display = on ? 'none' : '';   // 圆盘那一套退役：它的职责搬到池子
  if (on) layoutPool();
}

function stepPool(dt) {
  if (!poolEl.classList.contains('on')) return;
  poolPhase += dt;                                   // 漂移一直在走：它不打扰任何人
  // 自转只在"没人"的时候走，而且**缓动到停**，不是开关 —— 指针进来时它是"回头看你"，
  // 不是"啪地刹住"。这也是唯一允许整体移动的时刻：没人正瞄着某一张。
  poolSpin += (poolSpinWant - poolSpin) * Math.min(1, dt * 2.5);
  poolRot += poolSpin * dt;
  layoutPool(dt);
  // 醒：**停稳**才亮（悬停判据 = AWAKE_DWELL 时间 + AWAKE_TRAVEL 位移），离场延迟收回。
  // 一次切换驱动全部活页，不是十块各自计时。
  if (poolHover) {
    awakeLeaveAt = 0;
    if (awakeIds.length || performance.now() - hoverSince > AWAKE_DWELL) awakeOn();
  } else if (awakeIds.length) {
    if (!awakeLeaveAt) awakeLeaveAt = performance.now() + AWAKE_LEAVE_MS;
    else if (performance.now() > awakeLeaveAt) { hideAwake(); awakeLeaveAt = 0; }
  }
  if (awakeIds.length) syncAwakeRects();   // 活页跟着砖走（砖在漂、hover 放大也在缓动）
}

// 指针进屏 = 注意状态：停转。出屏 = 回到呼吸。
// 同时累计"在砖上走了多远" —— "停稳"要的是"没在走"，不只是"待够时间"。
addEventListener('pointermove', (e) => {
  poolSpinWant = (e.clientX > railWidth()) ? 0 : POOL_SPIN;
  if (ptrX >= 0) hoverTravel += Math.abs(e.clientX - ptrX) + Math.abs(e.clientY - ptrY);
  ptrX = e.clientX; ptrY = e.clientY;
  if (hoverTravel > AWAKE_TRAVEL) { hoverSince = performance.now(); hoverTravel = 0; }
});

// ===== 帧路由 =====
function applyState(f) {
  arena = f.arena || '';
  if (f.groups) groupNames = f.groups;
  if (f.order) poolIds = f.order;
  const ids = f.ids || [];
  desktopIds = f.desktop || [];
  focusId = f.focus || null;
  renderStage(ids, f.layout);
  renderRail();
  syncDiscs();
  syncPool();
}

// ---- rail：人切组的唯一入口 ----
// 人点一下 = 一次 switch_view 上行；服务端 activate 后回 broadcast，并把这件事
// 作为 aside 回流给模型（"human switched to #x"）—— 所以这里不需要模型参与，
// 也不需要页面自己维护"当前在哪"：arena 永远从帧里来。
function railButton(label, group, extraClass) {
  const b = document.createElement('button');
  b.className = 'rail-item' + (extraClass ? ' ' + extraClass : '')
    + (group === arena ? ' active' : '');
  b.textContent = label;
  b.title = group || 'home';
  b.addEventListener('click', () => send({ type: 'switch_view', group }));
  return b;
}

// home 那一行和别的组不同：它前面挂一颗心跳点（在线呼吸 / 断线红且静止），
// 后面在错误或调试时带一行字。它表达的是"我在不在"，而不是"有哪些地方"。
function homeButton() {
  const b = document.createElement('button');
  b.className = 'rail-item rail-home' + (arena === '' ? ' active' : '');
  b.title = 'home';
  const dot = document.createElement('span');
  dot.className = 'dot' + (linkDown ? ' down' : '');
  const label = document.createElement('span');
  label.textContent = 'home';
  const note = document.createElement('span');
  note.id = 'rail-state-text';
  note.textContent = linkText;
  b.append(dot, label, note);
  b.addEventListener('click', () => send({ type: 'switch_view', group: '' }));
  return b;
}

function renderRail() {
  railGroups.textContent = '';
  // "home" = 把舞台交还给我（arena = desktop）。它不是组，所以单独一行、隔开。
  railGroups.appendChild(homeButton());
  railGroups.appendChild(Object.assign(document.createElement('div'), { id: 'rail-sep' }));
  if (!groupNames.length) {
    const empty = document.createElement('div');
    empty.className = 'rail-empty';
    empty.textContent = 'no groups yet';
    railGroups.appendChild(empty);
    return;
  }
  groupNames.forEach((g) => railGroups.appendChild(railButton('#' + g, g)));
}

function route(f) {
  switch (f.type) {
    // The conversation itself: one line per clause, newest at the bottom.
    // The state light: one bit, drawn as an edge. Deliberately not a word.
    //
    // It is driven by *freshness*, not by a boolean: the page may connect at any
    // moment (a reload, a second window claiming the stage), and a boolean that
    // only ever arrives inside a frame leaves a reloaded page dark while the ghost
    // is in fact working. So every ghost-side event is a beat, and the light stays
    // on for GHOST_KEEP_MS after the last one — which also gets the other half for
    // free: a ghost that stopped talking and stopped acting goes dark by itself,
    // instead of glowing on a stale state nobody can retract.
    // Two producers share this frame name, and they are not the same message:
    // the ghost light (`{type:'state', thinking}`) and the layout
    // (`P.state_frame` — arena/ids/layout/desktop/groups/order). Keeping them as
    // two `case 'state'` arms was a silent bug: the first arm matched, broke, and
    // the second became dead code — so every model-side arrange updated the
    // server's pool and never reached the page, while a human click worked
    // because it comes back as `activate`. One arm, both jobs, asked by shape.
    case 'state': {
      if ('thinking' in f) {
        if (f.thinking) ghostBeat();
        else ghostBeatAt = 0;          // an explicit idle: off now, not in K seconds
      }
      if ('layout' in f || 'arena' in f) applyState(f);
      break;
    }
    case 'talk': {
      const box = document.getElementById('talk');
      if (!box) break;
      // 字号是这块屏的状态, 不是某一行的属性: 收到的第一件事是把它挂到 box 上,
      // 于是已经在屏上的旧行也一起变 —— 否则改一次字号要等两句才看得全.
      if (f.size) box.style.setProperty('--talk-size', f.size + 'px');
      if (f.clear) { box.replaceChildren(); break; }
      // 只带 size 的帧到此为止: 它是"现在的字号", 不是一句话.
      if (!f.text) break;
      const line = document.createElement('div');
      line.className = 'line';
      line.textContent = f.text || '';
      box.append(line);
      // New lines push the old ones up; the oldest fade out rather than vanish.
      // Two lines, not one: with a single slot the next clause yanks the sentence
      // you were still reading off the screen — "kept up to date" beat "readable",
      // and that was the wrong trade. The history beyond these two lives in the
      // DSH surface; these two are for whoever is watching the stream, and for me
      // to see how ASR parsed what was said.
      while (box.children.length > 2) box.firstElementChild.remove();
      setTimeout(() => line.classList.add('gone'), 16000);
      setTimeout(() => line.remove(), 17500);
      break;
    }
    case 'current': setMasked(false, ''); break;
    case 'mask': setMasked(true, f.reason); break;
    case 'snapshot': {
      // 全量帧：reconcile（缺建、多删）。f.items 是所有 item 的详情（含桌面），
      // 页面据此物化 iframe；桌面 item 的 iframe 隐藏，只画代理圆盘。
      const seen = new Set();
      f.items.forEach((it) => {
        seen.add(it.id);
        if (items.has(it.id)) {
          const cur = items.get(it.id);
          cur.label = it.label; cur.group = it.group; cur.url = it.url;
          cur.face_line = it.face_line; cur.face_art = it.face_art;
          tileFace(it.id);
        } else {
          const entry = { id: it.id, url: it.url, label: it.label, group: it.group, icon: it.icon,
                          face_line: it.face_line, face_art: it.face_art };
          items.set(it.id, entry); makeSlot(entry);
        }
      });
      [...items.keys()].filter((id) => !seen.has(id)).forEach(destroySlot);
      applyState(f);
      break;
    }
    case 'open': {
      const it = f.item;
      if (!items.has(it.id)) {
        const entry = { id: it.id, url: it.url, label: it.label, group: it.group, icon: it.icon,
                        face_line: it.face_line, face_art: it.face_art };
        items.set(it.id, entry); makeSlot(entry);
      } else {
        // navigate：已存在的 item 换 url，iframe 原地重载（不 reparent）。
        const cur = items.get(it.id);
        cur.url = it.url;
        if (cur.iframe) cur.iframe.src = it.url;
      }
      syncPool();
      break;
    }
    case 'close': {
      destroySlot(f.id); items.delete(f.id); syncPool(); break;
    }
    case 'activate': {
      if (f.by_model) { /* 模型切组：可在此处做 activate 动画（WD6） */ }
      applyState(f); break;
    }
    case 'focus': setFocus(f.id); break;
    case 'face': {
      const it = items.get(f.id); if (!it) break;
      it.face_line = f.face_line; it.face_art = f.face_art;
      tileFace(f.id);
      break;
    }
    case 'veil': {
      // duration<=0 = 常驻（Infinity），交给撤除命令收；有 id 才能被单独撤掉。
      const d = f.duration > 0 ? f.duration * 1000 : Infinity;
      const id = f.id;
      const w = f.width || 3;
      if (f.gesture === 'mark') veilMark(id, f.item, f.region || 'full', d, f.color, w);
      else if (f.gesture === 'box') veilBox(id, f.item, f.region || 'full', d, f.color, w);
      else if (f.gesture === 'circle') veilCircle(id, f.item, f.region || 'full', d, f.color, w);
      else if (f.gesture === 'arrow') {
        veilArrow(id, f.src, f.src_region || 'full', f.dst, f.dst_region || 'full',
                  d, f.color, w);
      } else if (f.gesture === 'danmaku') {
        ghostBeat();      // 我说的话、我做的动作 —— 都是"我还在"的证据
        veilDanmaku(id, f.content || '', f.motion || '', d, f.color,
                    f.size || 30, f.lane || 0, f.item || '', f.turns || 1,
                    f.at_x, f.at_y, f.angle || 0, f.region || '', !!f.overlap);
      } else if (f.gesture === 'paint') veilPaint(id, f.script || '', f.item || '', d, f.color);
      else if (f.gesture === 'remove') removeBlock(id);
      else if (f.gesture === 'clear') veilBlocks.clear();
      break;
    }
    case 'audio': {
      // 两侧共用一条总线，谁说话谁发帧。雨只认 ghost，升字只认 user —— 所以按角色
      // 分家存，另一侧说话时不会把这一侧抹掉。
      feedAt = performance.now();          // 这一帧是什么时候到的
      if (f.sample.role === 'user') {
        userFeed = f.sample;
        userAt = feedAt;
      } else {
        ghostAt = feedAt;                  // 断线判定要按角色：见 ghostAt 的注释
        feed = f.sample;
        mossEl.classList.toggle('alive', feed.rms_db > GATE);
      }
      st.textContent = `#${arena || 'desktop'} · ${f.sample.role} ${f.sample.rms_db.toFixed(0)}dB`;
      break;
    }
    case 'notice': {
      logLine(f.text); break;
    }
  }
}

// ===== 上行 + log =====
$('#scrim-exit').addEventListener('click', (e) => { e.stopPropagation(); send({ type: 'focus', id: '' }); });

let logCount = 0;
function logLine(text) {
  logCount++;
  $('#log-badge').textContent = logCount;
  const el = document.createElement('div');
  el.textContent = text;
  const list = $('#log-list');
  list.prepend(el);
  while (list.children.length > 50) list.lastChild.remove();
}
$('#log-badge').addEventListener('click', () => $('#log-list').classList.toggle('open'));

// ---- rail 的两个人侧行为：收起、闲置淡出 ----
// 收起是**手动**的（人不点，它不消失）；闲置只是淡，不停用，也不隐藏。

let railIdle = null;
function railPoke() {
  rail.classList.remove('idle');
  clearTimeout(railIdle);
  railIdle = setTimeout(() => {
    if (!rail.matches(':hover') && !railCollapsed()) rail.classList.add('idle');
  }, 4000);
}
rail.addEventListener('pointerenter', railPoke);
rail.addEventListener('pointermove', railPoke);
rail.addEventListener('pointerleave', railPoke);
railPoke();

function setRailCollapsed(v) {
  document.body.classList.toggle('rail-collapsed', v);
  $('#rail-toggle').textContent = v ? '›' : '‹';
  rail.classList.remove('idle');
  // 上报给人侧状态面：栏宽改变的是舞台的**可用区**，模型排布时得知道。
  // （它不进 debug 面 —— debug 面是要退役的，这是语义状态。）
  send({ type: 'rail', collapsed: v });
  // 栏宽变了 → 舞台可用区变了 → 画布与桌面圆盘重新对齐（贴底那层最容易在这里出血）
  syncViewport();
}
$('#rail-toggle').addEventListener('click', (e) => {
  e.stopPropagation();
  setRailCollapsed(!railCollapsed());
});
// 收起后整条边条就是"展开"的按钮 —— 收起是手动的，展开也是。
rail.addEventListener('click', () => { if (railCollapsed()) setRailCollapsed(false); });

// 首次同步放在这里，不放在定义处：syncViewport 会读 MOSS_SCALE 等 const，
// 在它们初始化之前调用会撞上暂时性死区（TDZ）。此刻所有 const 已就位。
syncViewport();
</script>
