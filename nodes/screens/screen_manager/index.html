<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>MOSS screen</title>
<style>
  :root {
    --rail-w: 200px;
    --slotbar-h: 26px;
    --gap: 6px;
    --border: #2a3340;
    --accent: #3ddc8f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  /* 池子在场时水印压暗：它是背景，不该和瓷砖抢中间那块地方 */
  body.pool-on { --moss-dim: .14; }
  body {
    font: 13px/1.4 ui-monospace, "PingFang SC", "Noto Sans CJK SC", monospace;
    background: #0a0c10;
    color: #ddd;
    overflow: hidden;
  }

  /* ===== 层栈：bg → desktop → stage → veil =====
     z 序只描述层，不描述物料。desktop 与 stage 都是中景：desktop 装
     未入组的代理圆盘，stage 装已入组的 iframe 分格。中景透明，透出 bg。 */
  #bg       { position: fixed; inset: 0; z-index: 0; }
  #moss     { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; pointer-events: none; }
  #desktop  { position: fixed; inset: 0; z-index: 2; }
  #stage    { position: fixed; left: var(--rail-w); right: 0; top: 0; bottom: 0; z-index: 4; }
  #scrim    { position: fixed; inset: 0; z-index: 3; display: none; background: rgba(0,0,0,.55); }
  #scrim-exit { position: fixed; top: 12px; right: 12px; z-index: 6; }  /* 按钮必须在页面之上 */
  /* The state light: 2px on the top edge, moving only while I am thinking.
     It answers "is it working on something" without a single glyph, and it is
     the one thing that changes when the ghost goes quiet — so the screen never
     looks frozen when it is only silent. */
  /* A 2px hairline at the very top edge is the first thing a window frame eats,
     and on a bright stage it is invisible anyway. So: thicker, detached from the
     edge by a hair, and carrying its own dark bed — the light has to be readable
     against whatever happens to be underneath, and it has to survive being
     cropped by the top of the window. */
  #think {
    position: fixed; left: 0; right: 0; top: 0; height: 5px; z-index: 9;
    pointer-events: none; opacity: 0; transition: opacity .35s ease;
    background-color: rgba(0,0,0,.55);
    box-shadow: 0 1px 6px rgba(0,0,0,.55);
    background-image: linear-gradient(90deg, transparent, #6ea8fe 30%, #fff3b0 50%, #6ea8fe 70%, transparent);
    background-size: 40% 100%; background-repeat: no-repeat;
    background-position: -40% 0;
  }
  #think.on { opacity: 1; animation: think-sweep 1.4s linear infinite; }
  @keyframes think-sweep {
    from { background-position: -40% 0; }
    to   { background-position: 140% 0; }
  }
  body.think-dim #think { opacity: .5; }
  /* The conversation, legibly: one line per clause, newest at the bottom, pushed
     up by the next. Reading order is the whole point — a line that flies across
     shows its tail first, which is fine for a comment feed and wrong for a
     dialogue. Above the veil (z 7) so nothing drawn can bury it. */
  #talk {
    /* Clear of the rail (--rail-w follows its collapsed state) and centred: this
       is subtitles, not a left-aligned log. */
    position: fixed; left: calc(var(--rail-w) + 24px); bottom: 26px; right: 24px;
    z-index: 8; pointer-events: none; display: flex; flex-direction: column;
    gap: 3px; align-items: center; font-size: var(--talk-size, 32px); line-height: 1.32;
    /* The page never declares a font, so subtitles inherited the browser default
       and read like a scarecrow. A clean sans, sized for reading off a stream. */
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-weight: 700;
  }
  /* Yellow on black outliner: the broadcast convention, and the one style that
     survives whatever is underneath. Fixed on purpose — a knob here would only be
     something else to get wrong; a second case earns a second style. */
  #talk .line.gone { opacity: 0; transition: opacity 1.4s ease-out; }
  #talk .line {
    max-width: 80%; padding: 1px 10px; border-radius: 3px; text-align: center;
    background: rgba(6, 8, 7, .55); color: #ffd24a; white-space: pre-wrap;
    text-shadow:
      -2px 0 0 #000, 2px 0 0 #000, 0 -2px 0 #000, 0 2px 0 #000,
      -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000,
      0 3px 8px rgba(0, 0, 0, .95);
    animation: talk-in .16s ease-out;
    transition: opacity .9s ease-out;
  }
  @keyframes talk-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
  #veil     { position: fixed; inset: 0; z-index: 7; pointer-events: none; }
  /* 遮罩：不是当前屏的页面留在这一层 —— 它仍连着线，但只有一句话和一个按钮。
     为什么需要它：同一个 url 可以开在很多标签里，而每个标签的窗口尺寸不同；
     "谁在画、画在哪一块"必须只有一个答案，否则模型画的手势会落在人没看的那块。 */
  #mask     { position: fixed; inset: 0; z-index: 20; display: none;
              background: rgba(4,10,6,.94); color: #cfe8d8; place-items: center; }
  body.masked #mask { display: grid; }
  #mask-box { max-width: 34em; padding: 24px; text-align: center;
              font: 15px/1.7 ui-monospace, Menlo, monospace; }
  #mask-box p { margin: 0 0 16px; opacity: .8; }
  #mask-claim { font: inherit; padding: 8px 18px; color: #6fd6a0; cursor: pointer;
                background: transparent; border: 1px solid #3d8; border-radius: 4px; }
  #mask-claim:hover { background: rgba(51, 221, 136, .12); }
  #log      { position: fixed; top: 8px; right: 8px; z-index: 8; }
  #log-badge { background: #161d26; color: #8af; border: 1px solid var(--border); border-radius: 10px;
               padding: 3px 9px; cursor: pointer; font-size: 11px; }
  #log-list  { display: none; position: absolute; top: 30px; right: 0; width: 260px; max-height: 320px;
               overflow-y: auto; background: #0e1218; border: 1px solid var(--border); border-radius: 6px;
               padding: 6px 10px; font-size: 11px; }
  #log-list.open { display: block; }
  #log-list div { padding: 3px 0; border-bottom: 1px solid #1a2230; }
  #st       { position: fixed; top: 10px; left: 12px; z-index: 8; color: #8af; font-size: 11px; }
  /* 连接状态：断线必须可见 —— 页面不许假装自己还活着 */
  /* ===== 人在看的那一面：默认只有产品本身 =====
     仪表（状态行 / 帧率 / 几何 / 活动日志）默认全藏，只有 --debug 时才挂在侧栏
     底部 —— 它们不该浮在舞台上，更不该跟栏重叠。 */
  #st, #link, #log, #rail-state-text { display: none; }
  body.debug #st, body.debug #link { display: block; }
  body.debug #log { display: block; }
  body.debug #rail-state-text { display: inline; }
  #rail-diagnostics { display: none; }
  body.debug #rail-diagnostics {
    display: block; padding: 6px 9px; border-top: 1px solid var(--border);
    color: #8af; font-size: 11px; max-height: 40%; overflow-y: auto;
  }
  #rail-diagnostics #log-list { display: block; position: static; width: auto; border: 0;
    background: transparent; padding: 0; max-height: none; }
  #rail-diagnostics #log-badge { display: none; }
  #rail-diagnostics #log-list div { border-bottom: 1px solid #1a2230; }
  #log { position: static; }
  /* 仪表一律进栏、不进浮层：#st 原本是 fixed 在左上角，那正好压在栏上 ——
     默认藏起来只是让它不出现，--debug 时还得把它挪进栏里。 */
  #st { position: static; top: auto; left: auto; }
  #link { position: static; margin-top: 2px; color: #3d8; }

  /* 心跳：在线时水位标极慢呼吸，说话时亮起（.alive），断线时灰掉且静止。
     水位标是 background 层 —— 舞台上有 item 时它被盖住，所以它表达的只是
     "空屏时我在不在"；断线在任何情况下都看得见的那一份，挂在侧栏顶上那颗点。 */
  /* 呼吸帧自己带乘数：animation 的 opacity 盖掉普通声明，只改 #moss span 不会生效。 */
  @keyframes breathe {
    0%, 100% { opacity: calc(.30 * var(--moss-dim, 1)) }
    50%      { opacity: calc(.54 * var(--moss-dim, 1)) }
  }
  #moss span { animation: breathe 4.5s ease-in-out infinite; }
  body.link-down #moss span {
    animation: none; background: none; opacity: calc(.45 * var(--moss-dim, 1));
    -webkit-text-fill-color: #4a5560; color: #4a5560;
  }
  /* 心跳点长在 home 上：home 是"回到我们说话的地方"，我在不在就是那里的状态。
     它替掉了原先单独一行 —— 一行只放一颗点，本来就多余。 */
  .rail-home .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #3ddc8f;
    display: inline-block; margin-right: 7px; vertical-align: middle;
    animation: beat 2.6s ease-in-out infinite;
  }
  @keyframes beat { 0%, 100% { opacity: .45 } 50% { opacity: 1 } }
  .rail-home .dot.down { background: #f66; animation: none; }
  body.link-down #rail { border-right-color: #f66; }
  body.link-down.rail-collapsed #rail { background: #2a1010; }
  /* 脚本错误时状态行必须现身，不管是不是 --debug */
  body.page-error #rail-state-text { display: inline; color: #f66; }

  /* ===== rail：人切组的侧栏（第一层只放"地方"） =====
     主权：人管"看哪" —— 这个面就是那句话的实体。常驻、可手动收起；
     不做自动隐藏：自动隐藏会让控件先消失、再等人想起它存在，而我们正在治的
     恰恰是"人看不见我在干什么"这个病。闲置只淡不隐（留一条边条）。
     指针预算：**接收指针的层都要让开这一列**（stage / desktop），不接收指针的层
     可以铺满（bg / veil）。否则栏底下的可交互区域会点不到，而且这种错在结构上
     不可见。 */
  :root { --rail-open-w: 188px; --rail-strip: 14px; --rail-w: var(--rail-open-w); }
  body.rail-collapsed { --rail-w: var(--rail-strip); }
  #rail {
    position: fixed; top: 0; bottom: 0; left: 0; width: var(--rail-w);
    z-index: 9; display: flex; flex-direction: column;
    background: rgba(11, 15, 21, .92); border-right: 1px solid var(--border);
    transition: width .18s ease, opacity .35s ease;
  }
  /* 收起后**不靠悬停展开**。悬停展开在这套布局里是错的：点下"收起"的那一刻鼠标
     还在栏上，浏览器把 :hover 留在栏上，栏当场自己弹回来 —— 表现就是"这个按钮
     没用"。所以收起态的边条本身就是一个按钮：点它展开，行为确定、不猜指针。 */
  body.rail-collapsed #rail { cursor: pointer; }
  body.rail-collapsed #rail-groups,
  body.rail-collapsed #rail-foot { display: none; }
  /* 收起后必须**看得出哪儿能点** —— 只留一条光边，人不知道点哪里。
     整条边条都是热区，这个符号只是把"热区在这儿"说出来。 */
  /* 收起成边条时，那颗"我在不在"的点改挂在边条上：进焦点会强制收起，
     而"我在不在"不能因为进了焦点就消失。 */
  #rail-dot { display: none; }
  body.rail-collapsed #rail-dot {
    display: block; width: 7px; height: 7px; border-radius: 50%;
    background: #3ddc8f; margin: 8px auto 0; animation: beat 2.6s ease-in-out infinite;
  }
  #rail-hint { display: none; }
  body.rail-collapsed #rail-hint {
    display: flex; flex: 1; align-items: center; justify-content: center;
    color: #5c6a76; font-size: 12px; user-select: none;
  }
  body.rail-collapsed #rail:hover #rail-hint { color: #3ddc8f; }
  #rail.idle { opacity: .42; }
  #rail.idle:hover { opacity: 1; }
  #rail-idle { display: none; }
  #rail-groups { flex: 1; overflow-y: auto; padding: 8px 6px; display: flex; flex-direction: column; gap: 2px; }
  #rail-sep { height: 1px; background: var(--border); margin: 5px 4px; }
  .rail-item {
    display: block; width: 100%; text-align: left; font: inherit;
    background: transparent; color: #9fb0c0; border: 0; border-radius: 6px;
    padding: 6px 9px; cursor: pointer; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .rail-item:hover { background: rgba(61,220,143,.10); color: #dfe9f2; }
  .rail-item.active { background: rgba(61,220,143,.16); color: #3ddc8f; }
  .rail-empty { color: #55636f; font-size: 11px; padding: 6px 9px; }
  #rail-foot { padding: 6px; border-top: 1px solid var(--border); }
  #rail-toggle {
    width: 100%; background: transparent; color: #6b7c8c; border: 0; cursor: pointer;
    font: inherit; padding: 4px; border-radius: 6px;
  }
  #rail-toggle:hover { background: rgba(255,255,255,.06); color: #dfe9f2; }

  /* ===== desktop：代理圆盘（canvas 物理） ===== */
  #desktop { cursor: pointer; }

  /* ===== stage：iframe 分格。iframe 一旦创建永不换父节点 —— 视觉变化只改样式。 ===== */
  /* #stage 是整屏的网格容器，空的时候它必须让指针穿过去，否则会盖住 #desktop，
     桌面代理永远点不到。只有 .slot 自己接收指针。 */
  #stage { display: grid; gap: var(--gap); padding: var(--gap); pointer-events: none; }
  .slot {
    position: relative; overflow: hidden; border: 1px solid var(--border);
    background: #0a0a0a; min-width: 0; min-height: 0; pointer-events: auto;
    transition: grid-row .3s, grid-column .3s;
    display: flex; flex-direction: column;
  }
  .slot iframe { flex: 1 1 auto; width: 100%; height: 100%; border: 0; display: block; min-height: 0; }

  /* ===== 窗口标题栏：每个窗口一条，但由屏幕画 =====
     node 只交 label（它声明里的名字），不交 chrome —— 否则三个 node 会长出三种高度、
     三种按钮位置，而标题栏正是最容易被各写一遍的地方。
     它同时是 notify 的可见形态：一块砖先得有名字、有它自己的那个动作，
     人和我才说得上"那块东西"。 */
  .slot-bar {
    flex: 0 0 var(--slotbar-h); display: flex; align-items: center; gap: 8px;
    padding: 0 8px;
    /* 窗口感来自"标题栏比内容亮一档"这条 OS 惯例 —— 不是靠加边框。
       顶边那条 1px 高光把栏和内容分开，又不制造第二道框。 */
    background: #161d26; border-bottom: 1px solid #0b0f14;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05);
    color: #8a97a4; font-size: 11.5px; user-select: none; white-space: nowrap;
  }
  .slot-bar .name { color: #dfe9f2; overflow: hidden; text-overflow: ellipsis; }
  .slot-bar .sp { flex: 1; }
  /* 按钮平时不吵、指到就有：默认无边框、低对比；hover 才亮边框。
     accent 只留给"这个窗口正在被放大"这一个状态 —— 颜色要有分工，
     到处都亮等于到处都不亮。 */
  .slot-bar button {
    background: transparent; border: 0; border-radius: 3px; padding: 3px 5px;
    display: inline-flex; align-items: center; justify-content: center;
    color: #6b7885; cursor: pointer; line-height: 0;
    transition: color .15s, background .15s;
  }
  .slot-bar button:hover { color: #dfe9f2; background: rgba(255,255,255,.07); }
  /* accent 只留给"这个窗口正在被放大"这一个状态：颜色表达状态，不做装饰。 */
  .slot.focused .slot-bar button { color: var(--accent); }
  .slot.hidden { display: none; }

  /* 醒（awake）：把**已经物化**的那些 slot 原地点亮 —— 不新建 iframe、不搬父节点（WD1）。
     指针一进场，**整片一起**从画像变屏幕；它是"场活了"，不是"多开了十个窗口"。
     它是一次"看"，不是一次"用"，所以不接收指针：否则光标进砖 → 活页盖上来 →
     吃掉指针 → pointerleave → 撤掉 → pointerenter …… 抽搐。
     外形照着瓷砖画，让人读到的是"同一块东西活了"。 */
  .slot.peek {
    position: fixed; z-index: 3; pointer-events: none; box-sizing: border-box;
    /* 粗边框：黑底上，活页自己的内容会把边界吃掉 —— 没有框就读成"一片糊在背景里的东西"，
       而不是"一块东西"。框是这块屏的"这是活的"最便宜的说法。
       尺寸全部乘 --pb：光学缩小时整块 slot 被 scale 下去，框和字若不预先放大，
       屏幕上就只剩半像素的线和四像素的字（第一版就是这样，自己截图才发现）。 */
    border-style: solid; border-color: rgba(138,150,144,.62);
    border-width: calc(2px * var(--pb, 1));
    border-radius: 6px;
    background: #060a08 padding-box;
    box-shadow: 0 18px 48px rgba(0,0,0,.6);
  }
  /* 指针停着的那一块：框加粗提亮 —— 十块都活着的时候，它是"你正停在这"的唯一标记。 */
  .slot.peek.pointed { border-width: calc(3px * var(--pb, 1)); border-color: rgba(120,255,190,.95); }
  /* 名字跟着活页走：活页一盖上来，砖上那行字就被压住了，而它是唯一能回答
     "这是什么"的线索（光学缩小的画面像一张海报）。名字由 raiseSlot 写进 data-label。
     尺寸同样乘 --pb —— 它长在被 scale 的元素里面。 */
  .slot.peek::after {
    content: attr(data-label);
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: calc(18px * var(--pb, 1)) calc(10px * var(--pb, 1)) calc(6px * var(--pb, 1));
    font-size: calc(16px * var(--pb, 1)); line-height: 1.1;
    color: #d8ffe9; text-align: center; letter-spacing: .02em;
    text-shadow: 0 1px 4px rgba(0,0,0,.9);
    background: linear-gradient(to top, rgba(3,10,7,.78), rgba(3,10,7,0));
    pointer-events: none; border-radius: 0 0 6px 6px;
  }
  /* 出现是"活过来"，不是"弹出来"：硬切会在划过时读成一次闪，
     淡入即使误触也只是一次柔和的呼吸。 */
  .slot.peek.fade { transition: opacity .18s ease-out; }

  /* 全屏 = 插 scrim + fixed 摆位（不 reparent iframe） */
  /* 焦点：同一个 slot 换一套样式，不是搬容器、不是复制 iframe。
     左边让开栏宽 —— 它是接收指针的层，按判据必须让，"被侧栏挡住"是违反判据的 bug。 */
  /* pip 的角落卡不是"一扇窗"，是"一个人站在那里"：没有框、没有底色、没有标题栏,
     页面自己的透明背景透出下面的主画面。留边框就成了又一个窗口，那是另一种意思。 */
  .slot.pip {
    background: transparent; border: 0; box-shadow: none; border-radius: 0; overflow: visible;
  }
  .slot.pip .slot-bar { display: none; }
  .slot.pip iframe { background: transparent; }
  .slot.focused { position: fixed; left: var(--rail-w); right: 0; top: 0; bottom: 0; z-index: 5; border: 0; }
  #scrim-exit {
    background: #222; color: #ddd; border: 1px solid #555;
    border-radius: 4px; padding: 6px 12px; cursor: pointer;
    /* 弱：你读内容时它不该抢注意力；但也不能弱到看不见 —— 它是"怎么出去"的唯一提示。
       0.3 在黑底上几乎不可见，0.45 加一点底色刚好"在但不吵"。 */
    opacity: .45; transition: opacity .18s; background: rgba(34, 34, 34, .8);
  }
  #scrim-exit:hover { opacity: 1; }

  /* ===== pool：home 的池子 —— 所有 item 的陈列（前景 / 中景 / 远景） ===== */
  /* home 不再是一片虚空：所有开着的 item 都在这层里，按 recency 排成三档深度。
     深度里只放"画像"（标签 + 状态点），**不放 iframe** —— 活体在深处会把帧率吃掉，
     而且它接收指针，会和"谁在焦点"这件事打架。 */
  #pool {
    position: fixed; top: 0; right: 0; bottom: 0; left: var(--rail-w);
    z-index: 2; display: none; pointer-events: none;
  }
  #pool.on { display: block; }
  .tile {
    position: absolute; left: 0; top: 0; width: 264px; height: 164px;
    /* 没有画像的时候，标签就是瓷砖的"脸" —— 所以它居中，不是页脚。 */
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 7px; padding: 10px; box-sizing: border-box; text-align: center;
    border: 1px solid transparent; border-radius: 6px;
    /* 双背景：内层是瓷砖本体，外层只画边框（padding-box / border-box 各取一层） */
    background:
      linear-gradient(165deg, #24332b, #101713) padding-box,
      linear-gradient(135deg, rgba(61, 220, 143, .55), rgba(61, 220, 143, .07) 45%, rgba(61, 220, 143, .38)) border-box;
    color: #cff7e2; font-size: 12.5px; letter-spacing: .02em;
    pointer-events: auto; cursor: pointer; transform-origin: 50% 50%;
    box-shadow: 0 14px 36px rgba(0, 0, 0, .55),
                inset 0 1px 0 rgba(120, 255, 190, .07);
  }
  .tile .tile-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #3ddc8f;
    flex: 0 0 auto; opacity: .85;
  }
  .tile .tile-name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 100%; font-size: 16px; font-weight: 500;
    color: #a8d8bf; transition: color .18s;
  }
  .tile.lit .tile-name { color: #eafff3; }
  /* 脸：一行字是主面，名字退成底下的小字。有图的时候图铺满，字压在图上。 */
  .tile .tile-line {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 100%; font-size: 14px; font-weight: 500;
    color: #dff7ea; letter-spacing: .01em;
  }
  .tile.faced .tile-name { font-size: 11px; opacity: .62; }
  .tile .tile-art {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; border-radius: 5px; opacity: .92;
  }
  .tile.arted { justify-content: flex-end; }
  .tile.arted .tile-caption {
    position: relative; width: 100%; padding: 5px 6px;
    background: linear-gradient(transparent, rgba(6, 12, 9, .88) 42%);
    border-radius: 0 0 5px 5px;
  }
  .tile.sel {
    border-color: #3ddc8f;
    box-shadow: 0 0 0 1px #3ddc8f, 0 18px 44px rgba(0, 0, 0, .6);
  }

  /* ===== background：MOSS 文字（遮罩，等宽反解） ===== */
  #moss span {
    font-weight: 900; letter-spacing: .02em;
    background: linear-gradient(90deg, #127a4b, #3ddc8f, #127a4b);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; background-size: 200% 100%;
    transition: opacity .4s;
    /* font-size 由 JS 反解：measureText 后按屏宽等比设定，保证四字等宽。 */
  }
  #moss span.alive { opacity: calc(1 * var(--moss-dim, 1)); animation: flow 1.6s linear infinite; }
  @keyframes flow { to { background-position: 200% 0; } }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div id="think"></div>
<div id="moss"><span>MOSS</span></div>
<canvas id="desktop"></canvas>
<div id="pool"></div>
<div id="stage"></div>
<div id="scrim"><button id="scrim-exit">✕ exit fullscreen</button></div>
<canvas id="veil"></canvas>
<div id="talk" aria-live="polite"></div>
<div id="mask"><div id="mask-box">
  <p id="mask-line">another window is the screen</p>
  <button id="mask-claim">use this window</button>
</div></div>
<aside id="rail">
  <div id="rail-hint" title="expand">›</div>
  <div id="rail-dot" class="dot"></div>
  <div id="rail-groups"></div>
  <div id="rail-diagnostics">
    <div id="st"></div>
    <div id="link"></div>
    <div id="log"><span id="log-badge">0</span><div id="log-list"></div></div>
  </div>
  <div id="rail-foot"><button id="rail-toggle" title="collapse / expand">‹</button></div>
</aside>

<script>
// 加载期/运行期脚本错误必须可见：否则整个画面静悄悄死掉，人只会以为"没生效"。
// （教训：一次 const/let 的暂时性死区错误就让整页脚本停摆，而我只能靠用户反馈才发现。）
window.addEventListener('error', (e) => {
  const el = document.getElementById('link');
  if (el) { el.textContent = 'script error: ' + (e.message || 'unknown'); el.classList.add('down'); }
  // 这条**不受 --debug 影响**：脚本整个死掉时，屏幕上必须留下痕迹，
  // 否则人只会以为"没生效"。
  const label = document.getElementById('rail-state-text');
  if (label) { label.textContent = 'script error'; }
  document.body.classList.add('page-error');
});
// =====================================================================
// 四层合成器：bg（声音感知 + MOSS 文字）→ desktop（未入组 item 的代理圆盘
// 物理）→ stage（已入组 item 的 iframe 分格）→ veil（模型的手）。
// 语义见 web_manager.md；数据全部来自 ws 帧，页面不内嵌 mock。
//
// 关键不变量：iframe 一旦创建永不换父节点（WD1）。desktop 上的 item 没有
// iframe，只有 canvas 画的代理圆盘；入组后才物化 iframe。所有视觉变化改样式。
// =====================================================================

const $ = (s) => document.querySelector(s);
const bg = $('#bg'), bctx = bg.getContext('2d');
const desktop = $('#desktop'), dctx = desktop.getContext('2d');
const veil = $('#veil'), vctx = veil.getContext('2d');
const stage = $('#stage');
const mossEl = $('#moss span');
const st = $('#st');
const link = $('#link');
const rail = $('#rail'), railGroups = $('#rail-groups');

// 调试面：默认关。开启的唯一入口是 node 的 --debug（自开窗时它会把 ?debug=1 带上）——
// 屏幕上给人看的是产品，仪表在关掉时不该占一个像素。页面自己往 stdout 报的自查
// 不受它影响：那条线从不进人眼，是模型的眼睛。
const DEBUG = new URLSearchParams(location.search).get('debug') === '1';
if (DEBUG) document.body.classList.add('debug');

// ---- 我是哪块屏 ----
// 同一个 url 可以开在多个标签里，而每个标签的窗口尺寸不同：几块屏同时画，
// 模型画的手势就会落在人没在看的那一块。所以页面先自报身份（uid 存
// sessionStorage —— 刷新不变、换标签变），由节点指派*一块*为当前屏，其余挂遮罩。
// `?claim=1` 是节点启动时自己开的那扇窗：它带着认领意图进来，不必等人点按钮。
const SCREEN_UID_KEY = 'moss-screen-uid';
const screenUid = (() => {
  let u = sessionStorage.getItem(SCREEN_UID_KEY);
  if (!u) {
    u = 'p' + Math.random().toString(36).slice(2, 10);
    sessionStorage.setItem(SCREEN_UID_KEY, u);
  }
  return u;
})();
const WANTS_CLAIM = new URLSearchParams(location.search).get('claim') === '1';
let isCurrent = false;

function setMasked(on, reason) {
  isCurrent = !on;
  document.body.classList.toggle('masked', !!on);
  const line = $('#mask-line');
  if (line) line.textContent = reason || 'another window is the screen';
  // 拿到屏幕的那一刻就报一次画幅：节点那边是"人换了屏"，我这边是"我该按哪个尺寸画"。
  if (isCurrent) reportViewport();
}

// 栏宽的唯一源在这里，CSS 变量由它推出来（两边各写一个 188 迟早会漂）。
const RAIL_OPEN = 188, RAIL_STRIP = 14;
document.documentElement.style.setProperty('--rail-open-w', RAIL_OPEN + 'px');
document.documentElement.style.setProperty('--rail-strip', RAIL_STRIP + 'px');
function railCollapsed() { return document.body.classList.contains('rail-collapsed'); }
function railWidth() { return railCollapsed() ? RAIL_STRIP : RAIL_OPEN; }

// 视图尺寸 —— 这个数决定"贴底"的画在哪一行，所以必须取"真正看得见的那块"。
//
// 踩过的坑：window.innerHeight（516）与 documentElement.clientHeight（812）会不一致 ——
// 分屏 / 缩放 / 内嵌 webview 下，clientHeight 报的是布局视口，可以比实际可见区高一截。
// 之前把它当基准，贴底那层就画到了可视区下方（y≈810 > 516），肉眼即"什么都没画"。
// 三个候选里取最小的那个：小的那个总是更接近"真正看得见"的一侧，
// 而画在可见区里稍微靠上，永远好过画在可见区外什么都看不见。
function viewSize() {
  const cands = [window.innerHeight, document.documentElement.clientHeight];
  if (window.visualViewport) cands.push(window.visualViewport.height);
  const h = Math.min(...cands.filter((v) => v > 0)) || window.innerHeight;
  const w = window.innerWidth || document.documentElement.clientWidth;
  return { w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h)) };
}
function sizeCanvas(c, ctx) {
  const v = viewSize();
  c.width = v.w * devicePixelRatio;
  c.height = v.h * devicePixelRatio;
  // 必须显式写 CSS 尺寸。canvas 是替换元素：`position: fixed; inset: 0` 里的
  // `width: auto` 会解析成*固有尺寸*（也就是 width/height 属性），而不是被
  // 上下左右四个偏移撑开。于是在 dpr=2 的 Retina 屏上，画布元素变成视口的
  // 两倍大（1686×1624 对 843×812），画面被放大两倍、右下四分之三落到屏幕外，
  // 贴底画的那层（升字浪）就永远看不见。
  // dpr=1 时属性值恰好等于视口，所以它在非 Retina 下一直是"能用"的 —— 这也
  // 正是 Playwright（dpr=1）正常、他的 Chrome（dpr=2）一直不正常的原因。
  c.style.width = v.w + 'px';
  c.style.height = v.h + 'px';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
// 视图尺寸：所有"贴底"的画法都读它，而不是读 innerHeight。
let viewW = innerWidth, viewH = innerHeight;
function syncViewport() {
  const v = viewSize();
  viewW = v.w; viewH = v.h;
  sizeCanvas(bg, bctx); sizeCanvas(desktop, dctx); sizeCanvas(veil, vctx);
  fitMossText(); initRainCols(); layoutDesktop();
  reportViewport();
}
addEventListener('resize', syncViewport);
if (window.visualViewport) {
  // visualViewport 的 resize 比 window 的更贴近"看得见的那块变了"——
  // 分屏、缩放常常只动它，不动 window 的 resize。
  window.visualViewport.addEventListener('resize', syncViewport);
  window.visualViewport.addEventListener('scroll', syncViewport);
}
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(syncViewport).observe(document.documentElement);
}

// ---- ws：断线要自愈，也要说出来 ----
// 只在加载时开一条连接是不够的：弱网 / 休眠 / node 重启都会让它静默死掉，而页面会
// 继续拿最后一帧当"现在"，看起来一切正常。所以两件事一起做 ——
//   恢复：close / error → 指数退避重连（服务端每次连接都会补发 snapshot，状态自己长回来）
//   传导：给音频帧打时间戳，超时即当静音（雨停、心率持平）并在角上标出"已断开"
// ghost 侧两帧（5Hz）没来就算停了：太久的话，打断之后雨还会按最后一帧的强度
// 继续掉一秒，看上去就是"没停"。
const FEED_STALE_MS = 400;
let ws = null, wsOpen = false, retryMs = 500, feedAt = 0;
let linkText = 'online', linkDown = false, fps = 0;

function setLink(text, down) {
  linkText = text;
  link.classList.toggle('down', !!down);
  // 断线是**唯一必须常驻可见**的状态：页面不许假装自己还活着（D02 的账）。
  // 它挂在侧栏顶上那颗点上（收起成边条时边条自己变红），水位标同步表现。
  linkDown = !!down;
  document.body.classList.toggle('link-down', !!down);
  document.querySelectorAll('#rail .dot').forEach((d) => d.classList.toggle('down', !!down));
  const label = $('#rail-state-text');
  if (label) label.textContent = text;
  renderLink();
}

// 仪表行（只在 --debug 下可见）：帧率与几何。诊断自己要读的数，不该让人念。
function renderLink() {
  link.textContent = (fps ? `${fps}fps · ` : '') + `${viewW}×${viewH}@${devicePixelRatio}`;
}

function scheduleRetry() {
  const wait = retryMs;
  retryMs = Math.min(retryMs * 2, 8000);
  setTimeout(connect, wait);
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => {
    wsOpen = true; retryMs = 500; setLink('online', false); startDebugReport();
    // 先自报身份：节点据此指派当前屏，其余的挂遮罩。认领意图随第一次 hello 带上 ——
    // 节点重启后，它自己开的那扇窗要自己拿回屏幕，不该等人再点一次。
    send({ type: 'hello', uid: screenUid, claim: WANTS_CLAIM });
    // 重连（或首次连接）后补报一次人侧状态：服务端不持久化它，断线期间的面板
    // 变动不能丢。
    send({ type: 'rail', collapsed: railCollapsed() });
  };
  ws.onmessage = (e) => { const f = JSON.parse(e.data); route(f); };
  ws.onerror = () => { try { ws.close(); } catch (_) {} };
  ws.onclose = () => {
    if (!wsOpen) return setLink('connect failed — retrying…', true);
    wsOpen = false;
    setLink('link down — reconnecting…', true);
    scheduleRetry();
  };
}
connect();

function send(f) {
  if (!wsOpen) return;            // 未连接就丢弃，别让一次点击把整个脚本抛死
  ws.send(JSON.stringify(f));
}

// 遮罩上的那颗按钮：人在这一页按一下，就是在说"屏幕是这块"。
$('#mask-claim').addEventListener('click', () => send({ type: 'claim' }));

// 画幅自报（只报"当前屏"）：它同时是两件事 —— 我画手势要用的尺寸，以及
// "屏幕换了人"的可读形式。只有当前屏在上报，所以这个数一变，就是人在另一个
// 窗口上按了按钮。变了才报，不是每帧都报。
let lastViewport = '';
function reportViewport() {
  if (!isCurrent || !wsOpen) return;
  const v = `${viewW}x${viewH}@${devicePixelRatio}`;
  if (v === lastViewport) return;
  lastViewport = v;
  send({ type: 'viewport', w: viewW, h: viewH, dpr: devicePixelRatio });
}

// 自查上报：每 2 秒把"我量到的几何 + 画法状态"报给服务端，落在它的 stdout 上。
// 目的只有一个 —— 让模型能自己读到客户端的真相，不必让人去念控制台。
// 分屏不可见那种问题，根因在客户端，服务端够不着；人也不该当那只眼睛。
let debugTimer = null;
function debugPayload() {
  const riseMax = (typeof riseHeights !== 'undefined' && riseHeights.length)
    ? Math.round(Math.max(...riseHeights) * 100) / 100 : -1;
  return {
    viewW, viewH,
    innerH: Math.round(window.innerHeight),
    clientH: document.documentElement.clientHeight,
    visualH: window.visualViewport ? Math.round(window.visualViewport.height) : null,
    dpr: devicePixelRatio,
    bgH: bg.height,
    baseY: viewH - 2,
    rms: typeof userFeed !== 'undefined' ? userFeed.rms_db : null,
    loudest: (typeof userFeed !== 'undefined' && userFeed.spectrum_bins?.length)
      ? Math.max(...userFeed.spectrum_bins) : null,
    riseMax,
    userAge: typeof userAt !== 'undefined' ? Math.round(performance.now() - userAt) : null,
    railW: railWidth(),
    collapsed: railCollapsed(),
    groups: groupNames.length,
    arena,
    // 池子的两个相位：rot 只在"没人"时累加，spin 是缓动后的角速度。
    // 这一条是为了让"停没停"可读 —— 判断从屏幕上看不出来（漂移一直在动）。
    poolRot: Math.round(poolRot * 1000) / 1000,
    poolSpin: Math.round(poolSpin * 1000) / 1000,
    poolTiles: tiles.size,
  };
}
// 版本指纹：开发期页面一直在改，而开着的旧窗口会在"旧世界"里继续跑（我们为此白查过一轮
// stdout 里的旧字段）。客户端每 3 秒问一次服务端；版本一变就自己刷新 —— 不需要任何人记得按刷新。
let pageVer = null;
setInterval(async () => {
  try {
    const d = await (await fetch('/__ver', { cache: 'no-store' })).json();
    if (!d.ver) return;
    if (pageVer === null) { pageVer = d.ver; return; }
    if (d.ver !== pageVer) location.reload();
  } catch (e) { /* 服务还没起来：下一拍再问 */ }
}, 3000);

function startDebugReport() {
  if (debugTimer) return;
  // 只报"当前屏"：被遮罩的页面没在画，它的几何不是屏幕的几何 —— 报上去只会
  // 让我在 stdout 里读到两块屏的数、分不清哪块算。
  const tick = () => { if (isCurrent) send({ type: 'debug', payload: debugPayload() }); };
  tick();
  debugTimer = setInterval(tick, 2000);
}

// 音频帧还新鲜吗？不新鲜 = 链路断了，画面按静音处理。
function feedFresh() { return performance.now() - ghostAt < FEED_STALE_MS; }

// ---- store 镜像（与服务端 ScreenModel 同构） ----
const items = new Map();   // id -> { el, iframe, url, label, group, icon, slot }
let arena = '';            // 当前 group 名，'' = desktop
let groupNames = [];       // 全部 group（创建序）—— 侧栏读它。delta 帧也带，
                           // 否则新起的组要等下一次刷新才看得见。
let focusId = null;        // 焦点视图：被"单独看"的那一个 item（与分组无关）
let stageIds = [];         // 最近一次 state 的舞台 ids —— focus 变化时要重算可见性
let stageLayout = null;
let desktopIds = [];       // 未入组的 item id，顺序即 recency

function item(id) { return items.get(id); }
function slotEl(id) { return items.get(id)?.slot; }

// 图标用 SVG 而不是字形：字体里有没有那个字符，不该决定一个按钮长什么样。
// 方框 = 最大化，错位双框 = 还原 —— 这是窗口系统的通用语。
const ICON_MAX =
  '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">'
  + '<rect x="1.5" y="1.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>';
const ICON_RESTORE =
  '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">'
  + '<rect x="1" y="3" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.1"/>'
  + '<path d="M3.5 3V2.2a1.2 1.2 0 0 1 1.2-1.2h3.1a1.2 1.2 0 0 1 1.2 1.2v3.1a1.2 1.2 0 0 1-1.2 1.2H7" '
  + 'fill="none" stroke="currentColor" stroke-width="1.1"/></svg>';

// ---- stage：slot 池（iframe 永不 reparent） ----
function makeSlot(it) {
  const slot = document.createElement('div');
  slot.className = 'slot hidden'; slot.dataset.id = it.id;
  // 标题栏由屏幕画，不由 node 的页面画：node 只交 label，chrome 归平台。
  // 那个按钮就是这个 app 自己的动作 —— 放大 / 还原，走服务端已有的 focus，
  // 不新造"窗口最大化"的第二套语义。
  const bar = document.createElement('div');
  bar.className = 'slot-bar';
  const name = document.createElement('span');
  name.className = 'name';
  name.textContent = it.label || it.id;
  const sp = document.createElement('span');
  sp.className = 'sp';
  const btn = document.createElement('button');
  btn.innerHTML = ICON_MAX;
  btn.title = 'maximize / restore';
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    send({ type: 'focus', id: focusId === it.id ? '' : it.id });
  });
  bar.append(name, sp, btn);
  const fr = document.createElement('iframe');
  fr.src = it.url;
  slot.append(bar, fr);
  stage.appendChild(slot);
  it.slot = slot; it.iframe = fr; it.barName = name; it.barBtn = btn;
}

function destroySlot(id) {
  const it = items.get(id); if (!it) return;
  if (awakeIds.includes(id)) awakeIds = awakeIds.filter((x) => x !== id);   // 砖没了，亮着的那块不留在屏幕上
  it.slot.remove();
  if (focusId === id) focusId = null;
}

function gridTemplate(layout) {
  if (!layout) return null;
  if (layout.family === 'stack') {
    if (layout.dir === 'lr') return ['2fr 1fr', `repeat(${layout.rows}, 1fr)`];
    return [`repeat(${layout.cols}, 1fr)`, '2fr 1fr'];
  }
  return [`repeat(${layout.cols}, 1fr)`, `repeat(${layout.rows}, 1fr)`];
}

function renderStage(ids, layout) {
  stageIds = ids; stageLayout = layout;
  // 每个 item 的 slot 都挂在 stage；active group 的 ids 显示并分格。
  // 焦点视图是**第三件**事：正在被看的那一个，即使不在任何组里也上舞台 ——
  // 整屏是"呈现"，与"它属于哪个组"无关（旧的 per-group fullscreen 把两者绑死了）。
  items.forEach((it) => {
    const focused = !!focusId && it.id === focusId;
    // 正亮着活页的那块不走这条：它此刻摆在砖的位置上，不是"没上舞台所以要藏"。
    const awaking = awakeIds.includes(it.id);
    it.slot.classList.toggle('hidden', !awaking && !ids.includes(it.id) && !focused);
    it.slot.classList.toggle('focused', focused);
    // 标题栏跟着 item 的 label 走 —— 名字只有一处真相（node 的声明），这里只是读它。
    if (it.barName) it.barName.textContent = it.label || it.id;
    if (it.barBtn) it.barBtn.innerHTML = focused ? ICON_RESTORE : ICON_MAX;
  });
  syncScrim();
  const t = gridTemplate(layout);
  if (!t) { stage.style.gridTemplateColumns = ''; stage.style.gridTemplateRows = ''; return; }
  stage.style.gridTemplateColumns = t[0];
  stage.style.gridTemplateRows = t[1];
  ids.forEach((id, k) => {
    const it = items.get(id); if (!it) return;
    const c = layout.cells[k]; if (!c) return;
    it.slot.style.gridRow = `${c.r} / span ${c.rs}`;
    it.slot.style.gridColumn = `${c.c} / span ${c.cs}`;
    // pip：格子是重叠的，主人铺满，角落卡浮在上面。层高靠 DOM 顺序不可靠，
    // 所以这里显式给一层 —— 也让角落卡能有自己的投影，读成"一张小卡片"。
    const pip = layout.family === 'pip';
    it.slot.classList.toggle('pip', pip && k > 0);
    it.slot.style.zIndex = pip ? (k > 0 ? '6' : '1') : '';
  });
}

// ---- fullscreen（per-group，插 scrim 不改 DOM 结构） ----
// 焦点视图：一个 item 单独占满舞台。它**不动任何分组**，也不复制 iframe ——
// 只是给同一个 slot 换一套样式（.fullscreen = position:fixed; inset:0）。
function syncScrim() { $('#scrim').style.display = focusId ? 'block' : 'none'; }

let railBeforeFocus = false;   // 进焦点前的栏状态，离开时原样还回去

function setFocus(id) {
  const wasOn = !!focusId, on = !!id;
  focusId = id || null;
  // 进焦点：栏自动收成边条 —— 页面几乎整屏，而"栏在哪"仍然可预测（焦点 = 窄条）。
  // 这是动人家的家具，所以只做可逆的一步：离开时原样还原。
  if (on && !wasOn) { railBeforeFocus = railCollapsed(); setRailCollapsed(true); }
  if (!on && wasOn) { setRailCollapsed(railBeforeFocus); }
  renderStage(stageIds, stageLayout);
  syncPool();
}

// Esc = 离开焦点：浏览器里唯一的"退出"直觉
addEventListener('keydown', (e) => { if (e.key === 'Escape' && focusId) send({ type: 'focus', id: '' }); });

// ===== desktop：代理圆盘物理（花束 / 布朗 / 环绕） =====
// 圆盘是 item 的灵魂，不是 iframe。每个圆盘有一个 home 槽位，稳定位置是 recency 的
// 函数（最近的靠中心）；力场是槽位之上的噪声，不是比槽位更强的引力 —— 否则所有圆盘
// 会被拉成一团、不可扫。
let orbitMode = 'bouquet';   // bouquet | brownian | orbit
const discs = [];            // { id, x, y, vx, vy, hx, hy, label }

function layoutDesktop() {
  const n = discs.length;
  // 舞台的可用区 = 整屏 − 栏宽。桌面圆盘是**接收点击**的物料，所以它必须待在
  // 让开栏的那一侧；否则圆盘会漂到栏底下，看着在、点不到。
  const x0 = railWidth();
  const w = Math.max(1, viewW - x0);
  const cx = x0 + w / 2, cy = viewH / 2;
  const R = Math.min(w, viewH) * 0.28;
  discs.forEach((d, k) => {
    const th = (k / Math.max(1, n)) * Math.PI * 2 - Math.PI / 2;
    const r = n === 1 ? 0 : R * (0.5 + 0.5 * (k / Math.max(1, n - 1)));
    d.hx = cx + r * Math.cos(th); d.hy = cy + r * Math.sin(th);
    d.x = d.hx; d.y = d.hy; d.vx = 0; d.vy = 0;
  });
}

function syncDiscs() {
  discs.length = 0;
  // 最近的靠中心：desktopIds 是老在前，倒序让 k=0 = 最近出现的那个。
  [...desktopIds].reverse().forEach((id) => {
    const it = items.get(id); if (!it) return;
    discs.push({ id, x: 0, y: 0, vx: 0, vy: 0, hx: 0, hy: 0, label: it.label });
  });
  layoutDesktop();
}

function stepDiscs(dt) {
  const K = 6.0;      // 归位弹簧：拉回各自的 home 槽位
  const SEP = 40;     // 分离半径
  for (const d of discs) {
    let fx = 0, fy = 0;
    if (orbitMode === 'bouquet') {
      fx += K * (d.hx - d.x); fy += K * (d.hy - d.y);
    } else if (orbitMode === 'brownian') {
      fx += (Math.random() - 0.5) * 400; fy += (Math.random() - 0.5) * 400;
      // 布朗是槽位上的抖动，不是漂移：保留弱归位，否则会贴边停死
      fx += K * 0.6 * (d.hx - d.x); fy += K * 0.6 * (d.hy - d.y);
    } else if (orbitMode === 'orbit') {
      const dx = d.x - d.hx, dy = d.y - d.hy;
      const r = Math.hypot(dx, dy) || 1;
      const tang = 140;  // 切向速度，维持环绕
      fx += -dy / r * tang; fy += dx / r * tang;
      // 弱归位，防止漂出自己的槽位
      fx += K * 0.4 * (d.hx - d.x); fy += K * 0.4 * (d.hy - d.y);
    }
    // 分离斥力
    for (const o of discs) {
      if (o === d) continue;
      const dx = d.x - o.x, dy = d.y - o.y;
      const dist = Math.hypot(dx, dy) || 1;
      if (dist < SEP) { const push = (SEP - dist) / SEP * 220; fx += dx / dist * push; fy += dy / dist * push; }
    }
    // 阻尼 + 积分（半隐式欧拉）
    d.vx = (d.vx + fx * dt) * 0.9;
    d.vy = (d.vy + fy * dt) * 0.9;
    d.x += d.vx * dt; d.y += d.vy * dt;
    // 边界软反弹（左边界让开侧栏：那一列接收指针的是栏，不是桌面）
    const M = 40, XL = railWidth() + M;
    if (d.x < XL) { d.x = XL; d.vx = Math.abs(d.vx); }
    if (d.x > viewW - M) { d.x = viewW - M; d.vx = -Math.abs(d.vx); }
    if (d.y < M) { d.y = M; d.vy = Math.abs(d.vy); }
    if (d.y > viewH - M) { d.y = viewH - M; d.vy = -Math.abs(d.vy); }
  }
}

function drawDiscs() {
  dctx.clearRect(0, 0, viewW, viewH);
  for (const d of discs) {
    const r = 26;
    dctx.beginPath();
    dctx.arc(d.x, d.y, r, 0, Math.PI * 2);
    dctx.fillStyle = 'rgba(22,29,38,.92)';
    dctx.fill();
    dctx.strokeStyle = 'rgba(61,220,143,.5)';
    dctx.lineWidth = 1.5;
    dctx.stroke();
    dctx.fillStyle = '#3ddc8f';
    dctx.font = 'bold 13px ui-monospace, monospace';
    dctx.textAlign = 'center'; dctx.textBaseline = 'middle';
    const label = d.label.length > 6 ? d.label.slice(0, 6) : d.label;
    dctx.fillText(label, d.x, d.y + r + 14);
  }
}

function hitDisc(x, y) {
  for (let i = discs.length - 1; i >= 0; i--) {
    const d = discs[i];
    if (Math.hypot(x - d.x, y - d.y) < 30) return d.id;
  }
  return null;
}

desktop.addEventListener('click', (e) => {
  const id = hitDisc(e.clientX, e.clientY);
  if (id) {
    // 点击代理 = 人表达"我看这个"。主权仍在模型：它决定是否 arrange。
    send({ type: 'tap', id });
  }
});

// ---- 物理循环（desktop 与 bg 共享一个 rAF） ----
let lastT = performance.now();
function desktopLoop() {
  requestAnimationFrame(desktopLoop);
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (discs.length && !poolEl.classList.contains('on')) {
    stepDiscs(dt);
    drawDiscs();
  } else {
    dctx.clearRect(0, 0, viewW, viewH);
  }
}
requestAnimationFrame(desktopLoop);

// ===== veil：姿态层（手势块，多块可叠加） =====
// 一个块 = 一次手势。块带 id，所以能被单独撤掉，也能被一次清空；几何**每帧现查**，
// 所以窗口一动，我指的仍是那块砖，而不是我当初按下的那个像素 —— 这是"说名字"和
// "画坐标"的区别：坐标会过期，名字不会。
const veilBlocks = new Map();   // id -> {draw, start, dur}
// 状态灯只认"最后一次来自我这侧的事件是什么时候"：任何事件都算一次心跳，
// 心跳之后 GHOST_KEEP_MS 内亮着，超过就自己灭。于是刷新/新窗口接上后，
// 下一件事发生灯就亮；而我如果卡住、停了、死了，它不需要谁来撤，自己会暗。
let ghostBeatAt = 0;
const GHOST_KEEP_MS = 3000;
const thinkEl = document.getElementById('think');
function ghostBeat() { ghostBeatAt = performance.now(); }
const VEIL_DEFAULT = {
  mark: 'rgba(80,255,150,1)', box: 'rgba(80,255,150,1)',
  circle: 'rgba(80,255,150,1)', arrow: 'rgba(255,130,80,1)',
  // 弹幕跟背后的字符雨同一种材质、同一种绿：#0f0 不是我随便挑的，是这层背景
  // 自己的颜色。白色的字浮在绿雨上像贴纸，绿色的字像从雨里长出来。
  danmaku: '#0f0',
};
function addBlock(id, draw, durMs) {
  veilBlocks.set(id, { draw, start: performance.now(), dur: durMs });
}
function removeBlock(id) { veilBlocks.delete(id); }
function geometry() {
  const out = {};
  items.forEach((it) => {
    const r = it.slot.getBoundingClientRect();
    out[it.id] = { x: r.x, y: r.y, w: r.width, h: r.height };
  });
  return out;
}
const REGION = {
  full:   (r) => [r.x, r.y, r.w, r.h],
  left:   (r) => [r.x, r.y, r.w / 2, r.h],
  right:  (r) => [r.x + r.w / 2, r.y, r.w / 2, r.h],
  top:    (r) => [r.x, r.y, r.w, r.h / 2],
  bottom: (r) => [r.x, r.y + r.h / 2, r.w, r.h / 2],
};
function regionRect(g, region) {
  if (REGION[region]) return REGION[region](g);
  // "x,y,w,h" —— 相对这块砖的比例。比例而不是像素：砖会重排、窗口会缩放，
  // 像素矩形的正确性只在画下的那一瞬成立，比例跟着砖走。
  const p = String(region || '').split(',').map(Number);
  if (p.length === 4 && p.every((v) => !Number.isNaN(v))) {
    return [g.x + p[0] * g.w, g.y + p[1] * g.h, p[2] * g.w, p[3] * g.h];
  }
  return REGION.full(g);
}
// 端点在**区域中心**上：arrow 的"起点/终点"因此也是地址，不是裸坐标。
function anchor(g, region) {
  const [x, y, w, h] = regionRect(g, region);
  return [x + w / 2, y + h / 2];
}
function fade(p) { const a = 0.15; if (p < a) return p / a; if (p > 1 - a) return (1 - p) / a; return 1; }
// durMs = Infinity 表示常驻（由撤除命令收），淡入淡出仍走同一条曲线。
function veilAlpha(b, now) {
  if (b.dur === Infinity) return 1;
  return fade((now - b.start) / b.dur);
}
function veilColor(kind, color) {
  return color || VEIL_DEFAULT[kind] || 'rgba(255,255,255,1)';
}

function veilMark(id, item, region, durMs, color, width) {
  addBlock(id, (c, a) => {
    const g = geometry()[item]; if (!g) return;
    const [x, y, w, h] = regionRect(g, region);
    c.globalAlpha = a;
    c.fillStyle = veilColor('mark', color); c.globalAlpha = a * 0.15;
    c.fillRect(x, y, w, h);
    c.globalAlpha = a;
    c.strokeStyle = veilColor('mark', color); c.lineWidth = width;
    c.strokeRect(x, y, w, h);
  }, durMs);
}
function veilBox(id, item, region, durMs, color, width) {
  addBlock(id, (c, a) => {
    const g = geometry()[item]; if (!g) return;
    const [x, y, w, h] = regionRect(g, region);
    c.globalAlpha = a;
    c.strokeStyle = veilColor('box', color); c.lineWidth = width;
    c.strokeRect(x, y, w, h);
  }, durMs);
}
function veilCircle(id, item, region, durMs, color, width) {
  addBlock(id, (c, a) => {
    const g = geometry()[item]; if (!g) return;
    const [x, y, w, h] = regionRect(g, region);
    c.globalAlpha = a;
    c.strokeStyle = veilColor('circle', color); c.lineWidth = width;
    c.beginPath();
    c.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
    c.stroke();
  }, durMs);
}
function veilArrow(id, src, srcRegion, dst, dstRegion, durMs, color, width) {
  addBlock(id, (c, a) => {
    const A = geometry()[src], B = geometry()[dst]; if (!A || !B) return;
    // 两端各缩一点，箭头不压在目标框上 —— 指过去，不是糊上去。
    const [ax, ay] = anchor(A, srcRegion), [bx, by] = anchor(B, dstRegion);
    c.globalAlpha = a;
    c.strokeStyle = veilColor('arrow', color); c.lineWidth = width;
    c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke();
    const ang = Math.atan2(by - ay, bx - ax);
    const head = 6 + width * 2;
    c.beginPath(); c.moveTo(bx, by);
    c.lineTo(bx - head * Math.cos(ang - 0.4), by - head * Math.sin(ang - 0.4));
    c.lineTo(bx - head * Math.cos(ang + 0.4), by - head * Math.sin(ang + 0.4));
    c.closePath(); c.fillStyle = veilColor('arrow', color); c.fill();
  }, durMs);
}

// 手绘层：脚本每一帧被调一次，拿到画布、目标砖的框、以及"它活了多久"。
// 不给积木式的动画 —— 动画由脚本自己算。这和 co_browser / artifacts 里直接下代码
// 是同一件事：这一层要动，就得是我写的。
//
// 生命周期与其它手势完全一致（duration / clear_veil / 绑 item）：动的东西也必须
// 收得回来，否则它会在我看不见的地方一直跑。
const paintCache = new Map();
function compilePaint(src) {
  let fn = paintCache.get(src);
  if (!fn) {
    fn = new Function('ctx', 'box', 't', 'dpr', src);
    paintCache.set(src, fn);
  }
  return fn;
}
function veilPaint(id, script, item, durMs, color) {
  addBlock(id, (c, a, t) => {
    const g = item ? geometry()[item] : null;
    const full = g ? { x: g.x, y: g.y, w: g.w, h: g.h }
                   : { x: 0, y: 0, w: viewW, h: viewH };
    const box = { x: full.x + reg[0] * full.w, y: full.y + reg[1] * full.h,
                  w: full.w * reg[2], h: full.h * reg[3] };
    c.globalAlpha = a;
    c.fillStyle = veilColor('paint', color);
    c.strokeStyle = veilColor('paint', color);
    try {
      compilePaint(script)(c, box, t, devicePixelRatio);
    } catch (e) {
      // 脚本错了要说出来 —— 静默失败比崩溃坏：屏上"什么都没画"看起来像没生效。
      c.globalAlpha = a;
      c.fillStyle = '#ff5f56';
      c.font = '13px ui-monospace, monospace';
      c.fillText('paint error: ' + e.message, box.x + 10, box.y + 20);
    }
    c.globalAlpha = 1;
  }, durMs);
}

// ===== 弹幕：会飞的字 =====
// 和居中大字不同，一条弹幕是"一行的飞行"：它有轨道、有方向、有它自己的时间片。
//
// 三条规矩，和这一层其它手势一致：
//   1. 位置是"活了多久"的函数，不是累积位移 —— 掉帧也不会走样，重画多少次都一样；
//   2. 有 id、有 duration、能被 clear_veil 收 —— 会动的东西更要收得回来；
//   3. 轨道是排出来的，不是碰运气：一条弹幕占住一条带，占着期间不再放第二条，
//      所以字不会叠在一起（"叠"和"闪过"在观感上完全是两回事）。
//
// 唯一带状态的地方是轨道占用表 danmakuLanes —— 它记的不是"屏上现在有什么"，
// 而是"哪条带什么时候空出来"，所以它只是排班，不是第二份画面真相。
const danmakuLanes = new Map();   // key -> Array<freeAt>，下标就是轨道号

// 排一条带：want>0 是指定轨道（1 起数），want<=0 是自动 —— 在空出来的带里按
// 「中间密、两头疏」的权重随机挑一条，像人真的在打弹幕；都占着就挑最早空出来的
// 那条（宁可延后出发，也不叠上去）。
function danmakuLane(key, lanes, want, now, busyMs) {
  let arr = danmakuLanes.get(key);
  if (!arr || arr.length !== lanes) { arr = new Array(lanes).fill(0); danmakuLanes.set(key, arr); }
  let li = 0;
  if (want > 0) {
    li = Math.min(want, lanes) - 1;
  } else {
    // 权重 = 1 + 2·(1 − 距竖直中线的归一化距离)：中线 3，上下边缘 1。
    // 随机的是轨道，不是"有没有空"——空了才有资格被抽到。
    const mid = (lanes - 1) / 2;
    const span = Math.max(mid, 0.5);
    const free = [];
    let total = 0;
    for (let i = 0; i < lanes; i++) {
      if (arr[i] > now) continue;
      const w = 1 + 2 * (1 - Math.abs(i - mid) / span);
      free.push(i);
      total += w;
    }
    if (free.length === 0) {
      for (let i = 0; i < lanes; i++) if (arr[i] < arr[li]) li = i;
    } else {
      let r = Math.random() * total;
      li = free[free.length - 1];
      for (let k = 0; k < free.length; k++) {
        r -= 1 + 2 * (1 - Math.abs(free[k] - mid) / span);
        if (r <= 0) { li = free[k]; break; }
      }
    }
  }
  // 这条带最早什么时候空出来 —— 排到后面就晚一点出发，但绝不叠上去。
  const startAt = Math.max(now, arr[li]);
  arr[li] = startAt + busyMs;
  return { li: li, startAt: startAt };
}

function veilDanmaku(id, content, motion, durMs, color, size, lane, item, turns, atX, atY, angle, region, overlap) {
  const font = 'bold ' + size + 'px ui-monospace, monospace';
  vctx.font = font;
  const tw = vctx.measureText(content).width;
  const laneH = Math.max(size * 1.6, size + 8);
  const hold = (durMs === Infinity);
  // 常驻（hold）也得有个穿越速度，否则它会僵在边上；8 秒一趟是默认节奏。
  const travel = hold ? 8000 : durMs;
  // 可读性：弹幕会从白色面板上飘过去，字得自己站得住。用描边而不是底色块 ——
  // 一块矩形比一行字重得多，会像贴纸；一圈深色轮廓只让字变清楚，不改变它的重量。
  const ink = (c, text, x, y) => {
    c.save();
    c.lineJoin = 'round';
    c.lineWidth = Math.max(2, size * 0.16);
    c.strokeStyle = 'rgba(0, 0, 0, 0.85)';
    c.strokeText(text, x, y);
    c.restore();
    c.fillText(text, x, y);
  };
  // region：只在一半里飞 —— 左右各占半屏、各自朝中间走，靠的就是这一格。
  const REG = { left: [0, 0, 0.5, 1], right: [0.5, 0, 0.5, 1],
                top: [0, 0, 1, 0.5], bottom: [0, 0.5, 1, 0.5] };
  // 没指定 region 的弹幕只在上方三成里飞 —— 弹幕是"飘过画面的旁白"，不是满屏的
  // 字；它若从顶端一直落到最下面，就压住了正在被看的东西（thirdgerb 定的，D19）。
  const reg = REG[region] || [0, 0, 1, 0.3];
  const box0 = item ? geometry()[item] : null;
  const h0 = (box0 ? box0.h : viewH) * reg[3];
  const lanes = Math.max(1, Math.floor(h0 / laneH));
  const now = performance.now();
  // at_x / at_y（0..1 的比例，两个数）把这行钉在那个点上：不排队、不横穿，
  // 寿命就是它留在那儿的时长。比例而不是像素 —— 窗口一动它还在那个相对位置上。
  const pinned = (typeof atX === 'number' && typeof atY === 'number'
                  && atX >= 0 && atY >= 0);
  let slot = { li: 0, startAt: now };
  if (overlap) {
    // Avoid overlap, but never at the price of being late. The lane scheduler
    // already knows which bands are still occupied — ask it *where* to go, then
    // ignore its answer to "when". A mirror that queues its own sentences arrives
    // after the moment they describe; a mirror that stacks them stays in time and
    // only occasionally rides over its predecessor.
    const key = (item || 'stage') + '|' + (region || '-') + '|' +
                Math.round(h0) + '|' + Math.round(size);
    // A band is occupied only until the previous line's *tail* is in, not until
    // it leaves — that is what makes a dense feed look even instead of slotted.
    const enterMs = Math.max(300, travel * Math.min(0.5, (tw + 80) / (viewW + tw)));
    const picked = danmakuLane(key, lanes, lane, now, hold ? 1e9 : enterMs);
    slot = { li: picked.li, startAt: now };
  } else if (!pinned) {
    const key = (item || 'stage') + '|' + (region || '-') + '|' +
                Math.round(h0) + '|' + Math.round(size);
    slot = danmakuLane(key, lanes, lane, now, hold ? 1e9 : travel);
  }
  const li = slot.li;
  // 轨道排到后面了就先等 —— 这条延迟和它的寿命一样是真的，不是"看起来没叠"。
  const delay = (hold || pinned) ? 0 : Math.max(0, slot.startAt - now);
  // 斜角：角度归我（正负都行），默认随机 ±(17°..30°)；0 就是"随你"。
  const deg = angle || (17 + Math.random() * 13) * (Math.random() < 0.5 ? -1 : 1);
  const aRad = deg * Math.PI / 180;
  addBlock(id, (c, a, age) => {
    const t = age - delay;
    if (t < 0) return;
    // 每帧现查几何：窗口一动，这条弹幕跟着它那块砖走（和 mark/box 同一条规矩）。
    const g = item ? geometry()[item] : null;
    const box = g ? { x: g.x, y: g.y, w: g.w, h: g.h }
                  : { x: 0, y: 0, w: viewW, h: viewH };
    const p = hold ? 1 : Math.min(1, t / travel);
    c.globalAlpha = hold ? 1 : fade(t / (delay + travel));
    c.fillStyle = veilColor('danmaku', color);
    c.font = font;
    c.textBaseline = 'middle';
    if (pinned) {
      c.textAlign = 'center';
      ink(c, content, box.x + atX * box.w, box.y + atY * box.h);
      return;
    }
    if (motion === 'orbit') {
      const R = Math.max(0, Math.min(box.w, box.h) / 2 - size);
      const th = p * turns * Math.PI * 2 - Math.PI / 2;
      c.textAlign = 'center';
      ink(c, content, box.x + box.w / 2 + R * Math.cos(th),
                        box.y + box.h / 2 + R * Math.sin(th));
      return;
    }
    if (motion === 'diag') {
      // 字自己转过来躺在斜线上，再沿那条斜线走过去 —— 转的是字，不是屏幕。
      const ca = Math.cos(aRad), sa = Math.sin(aRad);
      const L = (box.w + tw) / Math.max(Math.abs(ca), 0.2) + Math.abs(box.h * Math.tan(aRad)) + size * 2;
      const mx = box.x + box.w / 2, my = box.y + box.h / 2;
      c.save();
      c.translate(mx - ca * L / 2 + ca * L * p, my - sa * L / 2 + sa * L * p);
      c.rotate(aRad);
      c.textAlign = 'center';
      ink(c, content, 0, 0);
      c.restore();
      return;
    }
    const span = box.w + tw;
    c.textAlign = 'left';
    const yy = box.y + laneH * (li + 0.5);
    if (motion === 'ltr') ink(c, content, box.x - tw + span * p, yy);
    else ink(c, content, box.x + box.w - span * p, yy);
  }, durMs + delay);
}
function veilLoop() {
  requestAnimationFrame(veilLoop);
  const now = performance.now();
  vctx.clearRect(0, 0, viewW, viewH);
  veilBlocks.forEach((b, id) => {
    const age = now - b.start;
    if (age >= b.dur) { veilBlocks.delete(id); return; }
    // 第三个参数是"这个块活了多久"：静态块不看它，动态块靠它算位置 —— 所以
    // 动画是时间的函数，不是累积状态，掉帧也不会走样。
    b.draw(vctx, veilAlpha(b, now), age);

}

// 横向格数：60 是**上限**，不是定值。字形宽 GW 固定 16px，而格距 = 屏宽 / 格数 ——

// ===== 字符雨 = 频谱瀑布 =====
// 语义：这不是"按内容写字"，是**声音的另一种呈现**。ECG 把同一份信号画成一条横线，
// 这里把它画成从上往下走的字符：
//   - **生产由前端时钟驱动**（5Hz，每 200ms 产出一行）；到点就去看"手上最新拿到的那帧
//     topic 是什么"，用它的频谱算这一行；手上没有（没声音 / 链路断了）就产一行 null。
//     所以纵向是**时间轴**，节奏恒定连贯，跟 topic 的到达率无关 —— topic 丢帧只是
//     丢一行内容，不会让画面卡顿或错位。
//   - 横向每一格 = 一个频点，16 个 bin 线性插值铺满整屏宽度（低频在左）。
//   - 该格这一帧的分贝决定它**发不发字、发哪种字**；不发的格子是这一行里的 null 占位，

//   - 队列容量 = 一屏，所以屏幕展示的是**最近约十秒**的录音带；静音时录带继续往下走，
//     内容被空白行顶出去，而不是当场消失。

const ROW_PX = GH;                 // 一行字占的高度
const ROW_STEP = 2;                // 每产一行整片下落几行 —— 行与行之间空出呼吸的缝

const CATCHUP_MAX = 25;            // 一帧 rAF 里最多补产多少行（防后台标签页回来时爆量）
const FADE_BOTTOM = 0.3;           // 屏幕底部保留的透明度（1 = 不渐隐）
const BREATH_MIN = 0.4;            // 最安静时的亮度（呼吸的底）
const BREATH_SCALE = 0.3;          // 呼吸时字形最多放大多少比例

// ── 画法 ────────────────────────────────────────────────────────────────
// 'columns'（默认）：**致敬 Matrix 的列雨**。每一列是独立的 —— 它有自己的头、自己的
//         速度、自己的落字节奏、自己的尾长。列的横坐标 = 一个频点，所以这一列有多活跃

//             能量高 → 落得勤、落得快、尾巴长（像雨）

// 'hybrid'：行式画法（帧内归一 + 白化），纵向 = 时间轴，做对照用。
// 想对比画法不用改代码：地址后面加 ?mode=hybrid / ?mode=bars / ?mode=edge 即可。
const RAIN_MODE = new URLSearchParams(location.search).get('mode') || 'columns';

const SPACE_MAX = GH * 4.5;        // 最弱的列：隔 4.5 格（稀疏的滴）

const TAIL_DIM = 0.12;             // 尾巴最末端的透明度

const AGC_DECAY_DB = 2.0;          // 每秒衰减多少 dB（最高往下掉、最低往上抬）
const AGC_ABS_FLOOR = -50;         // 这一带的峰值低于它 → 从来没出过声，不参与
const AGC_MIN_RANGE = 8;           // 自己的最高最低差不到这个数 → 全是噪声，不参与
const LOUD_SMOOTH = 8;             // 呼吸的平滑速率（每秒收敛多少）—— 不平滑就会 5Hz 闪
const BAND_TILT = 0.7;             // 带宽分配：权重 ∝ 1/(k+1)^BAND_TILT（越大越偏向低频）
const GATE_DROP_DB = 12;           // 比"衰减峰值"低这么多 → 这一行不画（自动门限，不标定绝对值）
