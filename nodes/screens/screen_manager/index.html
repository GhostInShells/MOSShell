<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>MOSS screen</title>
<style>
  :root {
    --rail-w: 200px;
    --gap: 6px;
    --border: #2a3340;
    --accent: #3ddc8f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.4 ui-monospace, "PingFang SC", "Noto Sans CJK SC", monospace;
    background: #0a0c10;
    color: #ddd;
    overflow: hidden;
  }

  /* ===== 层栈：bg → desktop → stage → veil =====
     z 序只描述层，不描述物料。desktop 与 stage 都是中景：desktop 装
     未入组的代理圆盘，stage 装已入组的 iframe 分格。中景透明，透出 bg。 */
  #bg       { position: fixed; inset: 0; z-index: 0; }
  #moss     { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; pointer-events: none; }
  #desktop  { position: fixed; inset: 0; z-index: 2; }
  #stage    { position: fixed; left: var(--rail-w); right: 0; top: 0; bottom: 0; z-index: 3; }
  #scrim    { position: fixed; inset: 0; z-index: 4; display: none; background: rgba(0,0,0,.55); }
  #scrim-exit { position: fixed; top: 12px; right: 12px; z-index: 6; }
  #veil     { position: fixed; inset: 0; z-index: 7; pointer-events: none; }
  #log      { position: fixed; top: 8px; right: 8px; z-index: 8; }
  #log-badge { background: #161d26; color: #8af; border: 1px solid var(--border); border-radius: 10px;
               padding: 3px 9px; cursor: pointer; font-size: 11px; }
  #log-list  { display: none; position: absolute; top: 30px; right: 0; width: 260px; max-height: 320px;
               overflow-y: auto; background: #0e1218; border: 1px solid var(--border); border-radius: 6px;
               padding: 6px 10px; font-size: 11px; }
  #log-list.open { display: block; }
  #log-list div { padding: 3px 0; border-bottom: 1px solid #1a2230; }
  #st       { position: fixed; top: 10px; left: 12px; z-index: 8; color: #8af; font-size: 11px; }
  /* 连接状态：断线必须可见 —— 页面不许假装自己还活着 */
  #link     { position: fixed; top: 26px; left: 12px; z-index: 8; font-size: 11px; color: #3d8; }
  #link.down { color: #f66; font-weight: 700; }

  /* ===== rail：人切组的侧栏（第一层只放"地方"） =====
     主权：人管"看哪" —— 这个面就是那句话的实体。常驻、可手动收起；
     不做自动隐藏：自动隐藏会让控件先消失、再等人想起它存在，而我们正在治的
     恰恰是"人看不见我在干什么"这个病。闲置只淡不隐（留一条边条）。
     指针预算：**接收指针的层都要让开这一列**（stage / desktop），不接收指针的层
     可以铺满（bg / veil）。否则栏底下的可交互区域会点不到，而且这种错在结构上
     不可见。 */
  :root { --rail-open-w: 188px; --rail-strip: 14px; --rail-w: var(--rail-open-w); }
  body.rail-collapsed { --rail-w: var(--rail-strip); }
  #rail {
    position: fixed; top: 0; bottom: 0; left: 0; width: var(--rail-w);
    z-index: 9; display: flex; flex-direction: column;
    background: rgba(11, 15, 21, .92); border-right: 1px solid var(--border);
    transition: width .18s ease, opacity .35s ease;
  }
  /* 收起后**不靠悬停展开**。悬停展开在这套布局里是错的：点下"收起"的那一刻鼠标
     还在栏上，浏览器把 :hover 留在栏上，栏当场自己弹回来 —— 表现就是"这个按钮
     没用"。所以收起态的边条本身就是一个按钮：点它展开，行为确定、不猜指针。 */
  body.rail-collapsed #rail { cursor: pointer; }
  body.rail-collapsed #rail-groups,
  body.rail-collapsed #rail-foot { display: none; }
  /* 收起后必须**看得出哪儿能点** —— 只留一条光边，人不知道点哪里。
     整条边条都是热区，这个符号只是把"热区在这儿"说出来。 */
  #rail-hint { display: none; }
  body.rail-collapsed #rail-hint {
    display: flex; flex: 1; align-items: center; justify-content: center;
    color: #5c6a76; font-size: 12px; user-select: none;
  }
  body.rail-collapsed #rail:hover #rail-hint { color: #3ddc8f; }
  #rail.idle { opacity: .42; }
  #rail.idle:hover { opacity: 1; }
  #rail-groups { flex: 1; overflow-y: auto; padding: 8px 6px; display: flex; flex-direction: column; gap: 2px; }
  #rail-sep { height: 1px; background: var(--border); margin: 5px 4px; }
  .rail-item {
    display: block; width: 100%; text-align: left; font: inherit;
    background: transparent; color: #9fb0c0; border: 0; border-radius: 6px;
    padding: 6px 9px; cursor: pointer; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .rail-item:hover { background: rgba(61,220,143,.10); color: #dfe9f2; }
  .rail-item.active { background: rgba(61,220,143,.16); color: #3ddc8f; }
  .rail-empty { color: #55636f; font-size: 11px; padding: 6px 9px; }
  #rail-foot { padding: 6px; border-top: 1px solid var(--border); }
  #rail-toggle {
    width: 100%; background: transparent; color: #6b7c8c; border: 0; cursor: pointer;
    font: inherit; padding: 4px; border-radius: 6px;
  }
  #rail-toggle:hover { background: rgba(255,255,255,.06); color: #dfe9f2; }

  /* ===== desktop：代理圆盘（canvas 物理） ===== */
  #desktop { cursor: pointer; }

  /* ===== stage：iframe 分格。iframe 一旦创建永不换父节点 —— 视觉变化只改样式。 ===== */
  /* #stage 是整屏的网格容器，空的时候它必须让指针穿过去，否则会盖住 #desktop，
     桌面代理永远点不到。只有 .slot 自己接收指针。 */
  #stage { display: grid; gap: var(--gap); padding: var(--gap); pointer-events: none; }
  .slot {
    position: relative; overflow: hidden; border: 1px solid var(--border);
    background: #0a0a0a; min-width: 0; min-height: 0; pointer-events: auto;
    transition: grid-row .3s, grid-column .3s;
  }
  .slot iframe { width: 100%; height: 100%; border: 0; display: block; }
  .slot.hidden { display: none; }

  /* 全屏 = 插 scrim + fixed 摆位（不 reparent iframe） */
  .slot.fullscreen { position: fixed; inset: 0; z-index: 5; border: 0; }
  #scrim-exit {
    background: #222; color: #ddd; border: 1px solid #555;
    border-radius: 4px; padding: 6px 12px; cursor: pointer;
  }

  /* ===== background：MOSS 文字（遮罩，等宽反解） ===== */
  #moss span {
    font-weight: 900; letter-spacing: .02em;
    background: linear-gradient(90deg, #127a4b, #3ddc8f, #127a4b);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; background-size: 200% 100%;
    opacity: .35; transition: opacity .4s;
    /* font-size 由 JS 反解：measureText 后按屏宽等比设定，保证四字等宽。 */
  }
  #moss span.alive { opacity: 1; animation: flow 1.6s linear infinite; }
  @keyframes flow { to { background-position: 200% 0; } }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div id="moss"><span>MOSS</span></div>
<canvas id="desktop"></canvas>
<div id="stage"></div>
<div id="scrim"><button id="scrim-exit">✕ 退出全屏</button></div>
<canvas id="veil"></canvas>
<aside id="rail">
  <div id="rail-hint" title="展开">›</div>
  <div id="rail-groups"></div>
  <div id="rail-foot"><button id="rail-toggle" title="收起 / 展开">‹</button></div>
</aside>
<div id="log"><span id="log-badge">0</span><div id="log-list"></div></div>
<div id="st"></div>
<div id="link"></div>

<script>
// 加载期/运行期脚本错误必须可见：否则整个画面静悄悄死掉，人只会以为"没生效"。
// （教训：一次 const/let 的暂时性死区错误就让整页脚本停摆，而我只能靠用户反馈才发现。）
window.addEventListener('error', (e) => {
  const el = document.getElementById('link');
  if (el) { el.textContent = '脚本错误：' + (e.message || 'unknown'); el.classList.add('down'); }
});
// =====================================================================
// 四层合成器：bg（声音感知 + MOSS 文字）→ desktop（未入组 item 的代理圆盘
// 物理）→ stage（已入组 item 的 iframe 分格）→ veil（模型的手）。
// 语义见 web_manager.md；数据全部来自 ws 帧，页面不内嵌 mock。
//
// 关键不变量：iframe 一旦创建永不换父节点（WD1）。desktop 上的 item 没有
// iframe，只有 canvas 画的代理圆盘；入组后才物化 iframe。所有视觉变化改样式。
// =====================================================================

const $ = (s) => document.querySelector(s);
const bg = $('#bg'), bctx = bg.getContext('2d');
const desktop = $('#desktop'), dctx = desktop.getContext('2d');
const veil = $('#veil'), vctx = veil.getContext('2d');
const stage = $('#stage');
const mossEl = $('#moss span');
const st = $('#st');
const link = $('#link');
const rail = $('#rail'), railGroups = $('#rail-groups');

// 栏宽的唯一源在这里，CSS 变量由它推出来（两边各写一个 188 迟早会漂）。
const RAIL_OPEN = 188, RAIL_STRIP = 14;
document.documentElement.style.setProperty('--rail-open-w', RAIL_OPEN + 'px');
document.documentElement.style.setProperty('--rail-strip', RAIL_STRIP + 'px');
function railCollapsed() { return document.body.classList.contains('rail-collapsed'); }
function railWidth() { return railCollapsed() ? RAIL_STRIP : RAIL_OPEN; }

// 视图尺寸 —— 这个数决定"贴底"的画在哪一行，所以必须取"真正看得见的那块"。
//
// 踩过的坑：window.innerHeight（516）与 documentElement.clientHeight（812）会不一致 ——
// 分屏 / 缩放 / 内嵌 webview 下，clientHeight 报的是布局视口，可以比实际可见区高一截。
// 之前把它当基准，贴底那层就画到了可视区下方（y≈810 > 516），肉眼即"什么都没画"。
// 三个候选里取最小的那个：小的那个总是更接近"真正看得见"的一侧，
// 而画在可见区里稍微靠上，永远好过画在可见区外什么都看不见。
function viewSize() {
  const cands = [window.innerHeight, document.documentElement.clientHeight];
  if (window.visualViewport) cands.push(window.visualViewport.height);
  const h = Math.min(...cands.filter((v) => v > 0)) || window.innerHeight;
  const w = window.innerWidth || document.documentElement.clientWidth;
  return { w: Math.max(1, Math.round(w)), h: Math.max(1, Math.round(h)) };
}
function sizeCanvas(c, ctx) {
  const v = viewSize();
  c.width = v.w * devicePixelRatio;
  c.height = v.h * devicePixelRatio;
  // 必须显式写 CSS 尺寸。canvas 是替换元素：`position: fixed; inset: 0` 里的
  // `width: auto` 会解析成*固有尺寸*（也就是 width/height 属性），而不是被
  // 上下左右四个偏移撑开。于是在 dpr=2 的 Retina 屏上，画布元素变成视口的
  // 两倍大（1686×1624 对 843×812），画面被放大两倍、右下四分之三落到屏幕外，
  // 贴底画的那层（升字浪）就永远看不见。
  // dpr=1 时属性值恰好等于视口，所以它在非 Retina 下一直是"能用"的 —— 这也
  // 正是 Playwright（dpr=1）正常、他的 Chrome（dpr=2）一直不正常的原因。
  c.style.width = v.w + 'px';
  c.style.height = v.h + 'px';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
// 视图尺寸：所有"贴底"的画法都读它，而不是读 innerHeight。
let viewW = innerWidth, viewH = innerHeight;
function syncViewport() {
  const v = viewSize();
  viewW = v.w; viewH = v.h;
  sizeCanvas(bg, bctx); sizeCanvas(desktop, dctx); sizeCanvas(veil, vctx);
  fitMossText(); initRainCols(); layoutDesktop();
}
addEventListener('resize', syncViewport);
if (window.visualViewport) {
  // visualViewport 的 resize 比 window 的更贴近"看得见的那块变了"——
  // 分屏、缩放常常只动它，不动 window 的 resize。
  window.visualViewport.addEventListener('resize', syncViewport);
  window.visualViewport.addEventListener('scroll', syncViewport);
}
if (typeof ResizeObserver !== 'undefined') {
  new ResizeObserver(syncViewport).observe(document.documentElement);
}

// ---- ws：断线要自愈，也要说出来 ----
// 只在加载时开一条连接是不够的：弱网 / 休眠 / node 重启都会让它静默死掉，而页面会
// 继续拿最后一帧当"现在"，看起来一切正常。所以两件事一起做 ——
//   恢复：close / error → 指数退避重连（服务端每次连接都会补发 snapshot，状态自己长回来）
//   传导：给音频帧打时间戳，超时即当静音（雨停、心率持平）并在角上标出"已断开"
const FEED_STALE_MS = 1000;
let ws = null, wsOpen = false, retryMs = 500, feedAt = 0;
let linkText = '在线', fps = 0;

function setLink(text, down) {
  linkText = text;
  link.classList.toggle('down', !!down);
  renderLink();
}

// 状态行顺带报帧率与几何：密度/行距这些参数改完到底掉不掉帧、贴底那层到底
// 画在哪个高度上，都得有数。分屏里"看不到"这种问题，先前只能靠人念屏幕，
// 现在这两个数自己写在这儿 —— 模型读它，不读人的眼睛。
function renderLink() {
  const geo = ` · ${viewW}×${viewH}@${devicePixelRatio}`;
  link.textContent = (fps ? `${linkText} · ${fps}fps` : linkText) + geo;
}

function scheduleRetry() {
  const wait = retryMs;
  retryMs = Math.min(retryMs * 2, 8000);
  setTimeout(connect, wait);
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => {
    wsOpen = true; retryMs = 500; setLink('在线', false); startDebugReport();
    // 重连（或首次连接）后补报一次人侧状态：服务端不持久化它，断线期间的面板
    // 变动不能丢。
    send({ type: 'rail', collapsed: railCollapsed() });
  };
  ws.onmessage = (e) => { const f = JSON.parse(e.data); route(f); };
  ws.onerror = () => { try { ws.close(); } catch (_) {} };
  ws.onclose = () => {
    if (!wsOpen) return setLink('连接失败，重试中…', true);
    wsOpen = false;
    setLink('已断开，重连中…', true);
    scheduleRetry();
  };
}
connect();

function send(f) {
  if (!wsOpen) return;            // 未连接就丢弃，别让一次点击把整个脚本抛死
  ws.send(JSON.stringify(f));
}

// 自查上报：每 2 秒把"我量到的几何 + 画法状态"报给服务端，落在它的 stdout 上。
// 目的只有一个 —— 让模型能自己读到客户端的真相，不必让人去念控制台。
// 分屏不可见那种问题，根因在客户端，服务端够不着；人也不该当那只眼睛。
let debugTimer = null;
function debugPayload() {
  const riseMax = (typeof riseHeights !== 'undefined' && riseHeights.length)
    ? Math.round(Math.max(...riseHeights) * 100) / 100 : -1;
  return {
    viewW, viewH,
    innerH: Math.round(window.innerHeight),
    clientH: document.documentElement.clientHeight,
    visualH: window.visualViewport ? Math.round(window.visualViewport.height) : null,
    dpr: devicePixelRatio,
    bgH: bg.height,
    baseY: viewH - 2,
    rms: typeof userFeed !== 'undefined' ? userFeed.rms_db : null,
    loudest: (typeof userFeed !== 'undefined' && userFeed.spectrum_bins?.length)
      ? Math.max(...userFeed.spectrum_bins) : null,
    riseMax,
    userAge: typeof userAt !== 'undefined' ? Math.round(performance.now() - userAt) : null,
    railW: railWidth(),
    collapsed: railCollapsed(),
    groups: groupNames.length,
    arena,
  };
}
function startDebugReport() {
  if (debugTimer) return;
  const tick = () => send({ type: 'debug', payload: debugPayload() });
  tick();
  debugTimer = setInterval(tick, 2000);
}

// 音频帧还新鲜吗？不新鲜 = 链路断了，画面按静音处理。
function feedFresh() { return performance.now() - feedAt < FEED_STALE_MS; }

// ---- store 镜像（与服务端 ScreenModel 同构） ----
const items = new Map();   // id -> { el, iframe, url, label, group, icon, slot }
let arena = '';            // 当前 group 名，'' = desktop
let groupNames = [];       // 全部 group（创建序）—— 侧栏读它。delta 帧也带，
                           // 否则新起的组要等下一次刷新才看得见。
let fullscreenId = null;   // active group 的全屏 item（per-group）
let desktopIds = [];       // 未入组的 item id，顺序即 recency

function item(id) { return items.get(id); }
function slotEl(id) { return items.get(id)?.slot; }

// ---- stage：slot 池（iframe 永不 reparent） ----
function makeSlot(it) {
  const slot = document.createElement('div');
  slot.className = 'slot hidden'; slot.dataset.id = it.id;
  const fr = document.createElement('iframe');
  fr.src = it.url;
  slot.appendChild(fr);
  stage.appendChild(slot);
  it.slot = slot; it.iframe = fr;
}

function destroySlot(id) {
  const it = items.get(id); if (!it) return;
  it.slot.remove();
  if (fullscreenId === id) fullscreenId = null;
}

function gridTemplate(layout) {
  if (!layout) return null;
  if (layout.family === 'stack') {
    if (layout.dir === 'lr') return ['2fr 1fr', `repeat(${layout.rows}, 1fr)`];
    return [`repeat(${layout.cols}, 1fr)`, '2fr 1fr'];
  }
  return [`repeat(${layout.cols}, 1fr)`, `repeat(${layout.rows}, 1fr)`];
}

function renderStage(ids, layout) {
  // 每个 item 的 slot 都挂在 stage；只有 active group 的 ids 显示并分格。
  items.forEach((it) => {
    const onStage = ids.includes(it.id);
    it.slot.classList.toggle('hidden', !onStage);
  });
  const t = gridTemplate(layout);
  if (!t) { stage.style.gridTemplateColumns = ''; stage.style.gridTemplateRows = ''; return; }
  stage.style.gridTemplateColumns = t[0];
  stage.style.gridTemplateRows = t[1];
  ids.forEach((id, k) => {
    const it = items.get(id); if (!it) return;
    const c = layout.cells[k]; if (!c) return;
    it.slot.style.gridRow = `${c.r} / span ${c.rs}`;
    it.slot.style.gridColumn = `${c.c} / span ${c.cs}`;
  });
}

// ---- fullscreen（per-group，插 scrim 不改 DOM 结构） ----
function setFullscreen(id) {
  if (fullscreenId && slotEl(fullscreenId)) slotEl(fullscreenId).classList.remove('fullscreen');
  fullscreenId = id;
  if (id && slotEl(id)) slotEl(id).classList.add('fullscreen');
  $('#scrim').style.display = id ? 'block' : 'none';
}

// ===== desktop：代理圆盘物理（花束 / 布朗 / 环绕） =====
// 圆盘是 item 的灵魂，不是 iframe。每个圆盘有一个 home 槽位，稳定位置是 recency 的
// 函数（最近的靠中心）；力场是槽位之上的噪声，不是比槽位更强的引力 —— 否则所有圆盘
// 会被拉成一团、不可扫。
let orbitMode = 'bouquet';   // bouquet | brownian | orbit
const discs = [];            // { id, x, y, vx, vy, hx, hy, label }

function layoutDesktop() {
  const n = discs.length;
  // 舞台的可用区 = 整屏 − 栏宽。桌面圆盘是**接收点击**的物料，所以它必须待在
  // 让开栏的那一侧；否则圆盘会漂到栏底下，看着在、点不到。
  const x0 = railWidth();
  const w = Math.max(1, viewW - x0);
  const cx = x0 + w / 2, cy = viewH / 2;
  const R = Math.min(w, viewH) * 0.28;
  discs.forEach((d, k) => {
    const th = (k / Math.max(1, n)) * Math.PI * 2 - Math.PI / 2;
    const r = n === 1 ? 0 : R * (0.5 + 0.5 * (k / Math.max(1, n - 1)));
    d.hx = cx + r * Math.cos(th); d.hy = cy + r * Math.sin(th);
    d.x = d.hx; d.y = d.hy; d.vx = 0; d.vy = 0;
  });
}

function syncDiscs() {
  discs.length = 0;
  // 最近的靠中心：desktopIds 是老在前，倒序让 k=0 = 最近出现的那个。
  [...desktopIds].reverse().forEach((id) => {
    const it = items.get(id); if (!it) return;
    discs.push({ id, x: 0, y: 0, vx: 0, vy: 0, hx: 0, hy: 0, label: it.label });
  });
  layoutDesktop();
}

function stepDiscs(dt) {
  const K = 6.0;      // 归位弹簧：拉回各自的 home 槽位
  const SEP = 40;     // 分离半径
  for (const d of discs) {
    let fx = 0, fy = 0;
    if (orbitMode === 'bouquet') {
      fx += K * (d.hx - d.x); fy += K * (d.hy - d.y);
    } else if (orbitMode === 'brownian') {
      fx += (Math.random() - 0.5) * 400; fy += (Math.random() - 0.5) * 400;
      // 布朗是槽位上的抖动，不是漂移：保留弱归位，否则会贴边停死
      fx += K * 0.6 * (d.hx - d.x); fy += K * 0.6 * (d.hy - d.y);
    } else if (orbitMode === 'orbit') {
      const dx = d.x - d.hx, dy = d.y - d.hy;
      const r = Math.hypot(dx, dy) || 1;
      const tang = 140;  // 切向速度，维持环绕
      fx += -dy / r * tang; fy += dx / r * tang;
      // 弱归位，防止漂出自己的槽位
      fx += K * 0.4 * (d.hx - d.x); fy += K * 0.4 * (d.hy - d.y);
    }
    // 分离斥力
    for (const o of discs) {
      if (o === d) continue;
      const dx = d.x - o.x, dy = d.y - o.y;
      const dist = Math.hypot(dx, dy) || 1;
      if (dist < SEP) { const push = (SEP - dist) / SEP * 220; fx += dx / dist * push; fy += dy / dist * push; }
    }
    // 阻尼 + 积分（半隐式欧拉）
    d.vx = (d.vx + fx * dt) * 0.9;
    d.vy = (d.vy + fy * dt) * 0.9;
    d.x += d.vx * dt; d.y += d.vy * dt;
    // 边界软反弹（左边界让开侧栏：那一列接收指针的是栏，不是桌面）
    const M = 40, XL = railWidth() + M;
    if (d.x < XL) { d.x = XL; d.vx = Math.abs(d.vx); }
    if (d.x > viewW - M) { d.x = viewW - M; d.vx = -Math.abs(d.vx); }
    if (d.y < M) { d.y = M; d.vy = Math.abs(d.vy); }
    if (d.y > viewH - M) { d.y = viewH - M; d.vy = -Math.abs(d.vy); }
  }
}

function drawDiscs() {
  dctx.clearRect(0, 0, viewW, viewH);
  for (const d of discs) {
    const r = 26;
    dctx.beginPath();
    dctx.arc(d.x, d.y, r, 0, Math.PI * 2);
    dctx.fillStyle = 'rgba(22,29,38,.92)';
    dctx.fill();
    dctx.strokeStyle = 'rgba(61,220,143,.5)';
    dctx.lineWidth = 1.5;
    dctx.stroke();
    dctx.fillStyle = '#3ddc8f';
    dctx.font = 'bold 13px ui-monospace, monospace';
    dctx.textAlign = 'center'; dctx.textBaseline = 'middle';
    const label = d.label.length > 6 ? d.label.slice(0, 6) : d.label;
    dctx.fillText(label, d.x, d.y + r + 14);
  }
}

function hitDisc(x, y) {
  for (let i = discs.length - 1; i >= 0; i--) {
    const d = discs[i];
    if (Math.hypot(x - d.x, y - d.y) < 30) return d.id;
  }
  return null;
}

desktop.addEventListener('click', (e) => {
  const id = hitDisc(e.clientX, e.clientY);
  if (id) {
    // 点击代理 = 人表达"我看这个"。主权仍在模型：它决定是否 arrange。
    send({ type: 'tap', id });
  }
});

// ---- 物理循环（desktop 与 bg 共享一个 rAF） ----
let lastT = performance.now();
function desktopLoop() {
  requestAnimationFrame(desktopLoop);

  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (discs.length) {
    stepDiscs(dt);

}

// ===== veil：姿态层（block 手势，多块可叠加） =====
const veilBlocks = [];
function addBlock(draw, durMs) {

}
function geometry() {
  const out = {};

    const r = it.slot.getBoundingClientRect();
    out[it.id] = { x: r.x, y: r.y, w: r.width, h: r.height };
  });

}
const REGION = {
  full:   (r) => [r.x, r.y, r.w, r.h],
  left:   (r) => [r.x, r.y, r.w / 2, r.h],
  right:  (r) => [r.x + r.w / 2, r.y, r.w / 2, r.h],
  top:    (r) => [r.x, r.y, r.w, r.h / 2],
  bottom: (r) => [r.x, r.y + r.h / 2, r.w, r.h / 2],
};
function fade(p) { const a = 0.15; if (p < a) return p / a; if (p > 1 - a) return (1 - p) / a; return 1; }

function veilMark(item, region, durMs) {
  addBlock((c, p) => {
    const g = geometry()[item]; if (!g) return;
    const [x, y, w, h] = REGION[region] ? REGION[region](g) : REGION.full(g);
    const a = fade(p);
    c.fillStyle = `rgba(80,255,150,${0.15 * a})`; c.fillRect(x, y, w, h);
    c.strokeStyle = `rgba(80,255,150,${a})`; c.lineWidth = 3; c.strokeRect(x, y, w, h);
  }, durMs);
}
function veilArrow(src, dst, durMs) {
  addBlock((c, p) => {
    const A = geometry()[src], B = geometry()[dst]; if (!A || !B) return;
    const ax = A.x + A.w / 2, ay = A.y + A.h / 2;
    const bx = B.x + B.w / 2, by = B.y + B.h / 2;
    const a = fade(p);
    c.strokeStyle = `rgba(255,130,80,${a})`; c.lineWidth = 3;
    c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke();
    const ang = Math.atan2(by - ay, bx - ax);
    c.beginPath(); c.moveTo(bx, by);
    c.lineTo(bx - 12 * Math.cos(ang - 0.4), by - 12 * Math.sin(ang - 0.4));
    c.lineTo(bx - 12 * Math.cos(ang + 0.4), by - 12 * Math.sin(ang + 0.4));
    c.closePath(); c.fillStyle = `rgba(255,130,80,${a})`; c.fill();
  }, durMs);
}
function veilText(content, durMs) {

    c.fillStyle = `rgba(255,255,255,${fade(p)})`;
    c.font = 'bold 52px ui-monospace, monospace';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(content, viewW / 2, viewH / 2);

}
function veilLoop() {
  requestAnimationFrame(veilLoop);
  const now = performance.now();

  for (let i = veilBlocks.length - 1; i >= 0; i--) {

const EMIT_EPS = 0.10;             // 能量低于此值：这一列不落字（越大，参与下雨的列越少）

const AGC_DECAY_DB = 2.0;          // 每秒衰减多少 dB（最高往下掉、最低往上抬）
const AGC_ABS_FLOOR = -50;         // 这一带的峰值低于它 → 从来没出过声，不参与
const AGC_MIN_RANGE = 8;           // 自己的最高最低差不到这个数 → 全是噪声，不参与

let rmsPeak = -120;                // 衰减峰值：门限拿它当参照
let bmax = [], bmin = [];          // 每频带的衰减最高/抬升最低（逐带 AGC 的两端）
let loudSmooth = 0;                // 平滑后的"呼吸量"：直接用它会让整片 5Hz 闪

// 逐频带 AGC：每个频带按**它自己的**历史区间归一，所以"能量天然堆在低频"这件事
// 不再把整屏压到左边。返回每个频带 0..1 的能量。
function agcEnergies(bins, dt) {
  const nb = bins.length;
  if (bmax.length !== nb) { bmax = bins.slice(); bmin = bins.slice(); }
  const out = new Array(nb);
  for (let k = 0; k < nb; k++) {
    const db = bins[k];
    bmax[k] = Math.max(db, bmax[k] - AGC_DECAY_DB * dt);
    bmin[k] = Math.min(db, bmin[k] + AGC_DECAY_DB * dt);
    const range = bmax[k] - bmin[k];
    out[k] = (bmax[k] > AGC_ABS_FLOOR && range >= AGC_MIN_RANGE)
      ? Math.min(1, Math.max(0, (db - bmin[k]) / range))
      : 0;                          // 这一带从来没出过声 / 只有噪声：不参与
  }
  return out;
}

// 雨只铺到升字区上沿：两层各占各的地，谁也不盖谁。升字区高度固定，所以这个界限
// 只跟窗口高度有关，与列数无关。
function rainCapacity() {
  const floorY = Math.max(0, BAR_FLOOR_Y());
  return Math.max(1, Math.floor(floorY / ROW_PITCH) + 2);
}

// 频带 → 列区间的分配表：累计权重取整，保证每段至少一列、末段收在总宽上。
function bandSpans(nb, total) {
  const raw = [];
  let sum = 0;
  for (let k = 0; k < nb; k++) { const v = 1 / Math.pow(k + 1, BAND_TILT); raw.push(v); sum += v; }
  const spans = [];
  let acc = 0, prev = 0;
  for (let k = 0; k < nb; k++) {
    acc += raw[k];
    let end = Math.round((total * acc) / sum);
    if (end < prev + 1) end = prev + 1;
    if (end > total) end = total;
    spans.push({ lo: prev, hi: end });
    prev = end;
  }
  if (spans.length) spans[spans.length - 1].hi = total;   // 收尾对齐右边界
  return spans;
}
let bands = bandSpans((feed.spectrum_bins || []).length || 16, RAIN_COLS);

const randGlyph = () => Math.floor(Math.random() * CHARSET.length);

// 同一条（段）内不重复：重抽几次，抽不到就用最后一次，避免退化成死循环。
function glyphUniqueIn(used) {
  let g = randGlyph();
  for (let t = 0; t < GLYPH_TRIES && used.has(g); t++) g = randGlyph();
  used.add(g);
  return g;
}

// 帧内相对高低：每帧摊满 0..1，跟绝对分贝无关。
function frameShape(bins) {
  const lo = Math.min(...bins), hi = Math.max(...bins);
  const span = Math.max(1e-6, hi - lo);
  return (db) => (db - lo) / span;
}

// 'hybrid'：白化决定出声与亮度，帧内归一决定段长。
function fillHybrid(g, a, bins) {
  const shape = frameShape(bins);
  for (let k = 0; k < bins.length && k < bands.length; k++) {
    const dev = bins[k] - ema[k];
    if (dev < DEV_FLOOR) continue;                 // 不比自己的基线响：这一行这段不出声
    const sp = bands[k], width = sp.hi - sp.lo;
    const len = Math.max(1, Math.round(shape(bins[k]) * width));
    const alpha = 0.5 + 0.5 * Math.min(1, dev / DEV_FULL);
    const used = new Set();
    for (let c = sp.lo; c < sp.lo + len && c < g.length; c += CELL_STRIDE) {
      g[c] = glyphUniqueIn(used);
      a[c] = alpha;
    }
  }
}

// 'bars'：帧内归一的条形图，不做白化。
function fillBars(g, a, bins) {
  const shape = frameShape(bins);
  for (let k = 0; k < bins.length && k < bands.length; k++) {
    const sp = bands[k], width = sp.hi - sp.lo;
    const len = Math.round(shape(bins[k]) * width);
    const used = new Set();
    for (let c = sp.lo; c < sp.lo + len && c < g.length; c += CELL_STRIDE) {
      g[c] = glyphUniqueIn(used);
      a[c] = 1;
    }
  }
}

// 'edge'：每段只落一个点，位置由帧内归一决定。
function fillEdge(g, a, bins) {
  const shape = frameShape(bins);
  for (let k = 0; k < bins.length && k < bands.length; k++) {
    const sp = bands[k], width = sp.hi - sp.lo;
    const col = sp.lo + Math.min(width - 1, Math.floor(shape(bins[k]) * width));
    g[col] = randGlyph();
    a[col] = 1;
  }
}

// 产出一行：门限开着就按当前这帧 topic 算字，否则整行空。
function produceRow(now) {
  const n = RAIN_COLS;
  const g = new Array(n).fill(null);
  const a = new Array(n).fill(0);
  const bins = feed.spectrum_bins;
  if (bins.length && ema.length !== bins.length) ema = new Array(bins.length).fill(null);

  // 白化基线始终跟着更新（静音也更新），否则声音回来时基线是旧的，会误判成"变化"
  for (let k = 0; k < bins.length; k++) {
    ema[k] = ema[k] === null ? bins[k] : ema[k] + EMA_ALPHA * (bins[k] - ema[k]);
  }
  rmsPeak = Math.max(feed.rms_db, rmsPeak - PEAK_DECAY_DB);

  const fresh = feed.role === 'ghost' && now - feedAt <= FRAME_MS * 1.5;
  const gateFloor = Math.max(RMS_FLOOR, rmsPeak - GATE_DROP_DB);
  const gateOpen = fresh && feed.rms_db > gateFloor;
  // 这一行的"呼吸量"：0 = 刚到门限，1 = 达到最近峰值。整片的亮度与字的大小都跟着它。
  const loud = Math.min(1, Math.max(0, (feed.rms_db - gateFloor) / GATE_DROP_DB));
  if (gateOpen && bins.length) {
    if (bands.length !== bins.length) bands = bandSpans(bins.length, RAIN_COLS);
    if (RAIN_MODE === 'hybrid') fillHybrid(g, a, bins);
    else if (RAIN_MODE === 'bars') fillBars(g, a, bins);
    else fillEdge(g, a, bins);
  }

  rows.unshift({ g, a, loud });
  while (rows.length > rainCapacity()) rows.pop();
  rowTickAt = now;
}

// ── 'columns'：逐列独立的 Matrix 列雨 ──────────────────────────────────
// 每一列一个粒子队列。列的横坐标 t ∈ [0,1] 映射到一个频点（16 个桶线性插值），
// 该频点此刻的能量 e 决定这一列的一切：
//     下落速度  v = SPEED_MIN + (SPEED_MAX-SPEED_MIN) * e
//     落字间隔  T = 字距 / v，字距 = 从一格到三格随 e 变（强列密，弱列疏）
//     尾迹长度  点亮 TAIL_LIT 个字，再往上的尾部淡到 TAIL_DIM
// 于是"哪几列在下雨"就是"哪几个频带在出声"，元音一变活跃的列就换一批。
function stepRainColumns(dt, now, loud, gateOpen) {
  const bins = feed.spectrum_bins;
  const nb = bins.length;
  const colE = nb ? agcEnergies(bins, dt) : [];
  const n = cols.length;
  for (let i = 0; i < n; i++) {
    const c = cols[i];
    const t = n > 1 ? i / (n - 1) : 0;
    let target = 0;
    if (gateOpen && nb) {
      // 这一列的横坐标落在哪两个频带之间 → 把两带的能量插值给它
      const pos = t * (nb - 1), bi = Math.floor(pos), fr = pos - bi;
      const e0 = colE[Math.min(bi, nb - 1)], e1 = colE[Math.min(bi + 1, nb - 1)];
      target = (e0 + (e1 - e0) * fr) * (0.15 + 0.85 * loud);
    }
    c.e += (target - c.e) * Math.min(1, dt * 6);      // 平滑：能量抖动不该让列抽筋

    const v = (SPEED_MIN + (SPEED_MAX - SPEED_MIN) * c.e) * c.jitter;

    // **一列一个速度**：整列的字一起落，速度听这一列此刻的能量。
    // 试过"每颗字在出生时定死速度"（想让声音停了以后旧字赶紧走完），代价是快的会追上慢的：
    // 要么穿过去（同一处被不同字形反复覆盖 = 闪），要么加一道最小间距闸——但那样快的字
    // 会**堆在慢的后面**，整列退化成跟着最慢那颗走。两个都不是雨该有的样子。
    // 现在回到整列同速：不可能追尾（间距就是落字时的间距），速度也照样跟着声音走。
    // 声音停了旧字会一起慢下来这件事，靠把 SPEED_MIN 抬高解决（见常量）。
    const fall = v * dt;

    if (c.e > EMIT_EPS) {
      const spacing = SPACE_MIN + (SPACE_MAX - SPACE_MIN) * (1 - c.e);
      if (now >= c.nextAt) {
        c.parts.push({ g: randGlyph(), y: -GH });
        c.nextAt = now + (spacing / Math.max(1, v)) * 1000;
      }
    } else {
      c.nextAt = now;                                  // 停了就随时可以从头开始下
    }

    for (const p of c.parts) p.y += fall;
    const rainFloor = Math.max(0, BAR_FLOOR_Y());
    let alive = 0;
    for (let k = 0; k < c.parts.length; k++) {          // 淘汰过底线的（最老的在前）
      if (c.parts[k].y <= rainFloor) break;
      alive++;
    }
    if (alive) c.parts.splice(0, alive);
    if (c.parts.length > TAIL_LIT * 2) c.parts.splice(0, c.parts.length - TAIL_LIT * 2);

    const base = BREATH_MIN + (1 - BREATH_MIN) * loud;  // 呼吸：整片随音量亮暗
    const zoom = 1 + BREATH_SCALE * loud;
    const w = GW * zoom, h = GH * zoom;
    const cnt = c.parts.length;
    for (let k = 0; k < cnt; k++) {
      const p = c.parts[k];
      const age = cnt - 1 - k;                          // 0 = 最新的那颗（雨头）
      // 雨头就是最新那颗，直接给满亮度、用白字。曾试过按年龄淡入（想压掉顶端那点闪），
      // 但闪的是**听侧**那一波浪，不是雨这边 —— 那一下只是把白雨头压暗了，观感反而变差。
      // 恢复原样：雨头干脆、白亮。
      const fade = age === 0 ? 1 : Math.max(TAIL_DIM, 1 - age / TAIL_LIT);
      const edge = Math.max(0, Math.min(1, (rainFloor - p.y) / RAIN_FLOOR_FADE));
      bctx.globalAlpha = Math.min(1, base * fade * edge);
      const img = age === 0 ? headAtlas : atlas;        // 雨头白亮，尾绿
      bctx.drawImage(img, p.g * GW, 0, GW, GH,
        c.x + (GW - w) / 2, p.y + (GH - h) / 2, w, h);
    }
  }
  bctx.globalAlpha = 1;
}

function stepRain(dt, now) {
  if (RAIN_MODE === 'columns') {
    const gateFloor = Math.max(RMS_FLOOR, rmsPeak - GATE_DROP_DB);
    rmsPeak = Math.max(feed.rms_db, rmsPeak - PEAK_DECAY_DB * (dt * 5));
    const fresh = feed.role === 'ghost' && now - feedAt <= FEED_STALE_MS;
    const gateOpen = fresh && feed.rms_db > gateFloor;
    const loud = gateOpen ? Math.min(1, Math.max(0, (feed.rms_db - gateFloor) / GATE_DROP_DB)) : 0;
    // 平滑：topic 是 5Hz 来的，直接用会让整片亮度每秒跳五次 —— 那就是看到的"闪"
    loudSmooth += (loud - loudSmooth) * Math.min(1, dt * LOUD_SMOOTH);
    stepRainColumns(dt, now, loudSmooth, gateOpen);
    return;
  }

  if (!rowTickAt) rowTickAt = now - FRAME_MS;
  let produced = 0;
  while (now - rowTickAt >= FRAME_MS && produced < CATCHUP_MAX) {
    produceRow(rowTickAt + FRAME_MS);     // 按时间轴补产：补出来的行多为空白（手上没有新帧）
    produced++;
  }

  // 分数位移：一行的间距在一整个 200ms 里平滑铺开，所以 5Hz 的生产看起来是连续下落
  const shift = Math.min(1, (now - rowTickAt) / FRAME_MS) * ROW_PITCH;
  const cap = rows.length;
  const zoom = 1 + BREATH_SCALE * (rows.length ? rows[0].loud : 0);   // 呼吸：整片随音量微微胀缩
  const w = GW * zoom, h = GH * zoom;
  const floorY = BAR_FLOOR_Y();   // 升字区上沿：雨到这儿为止，不盖住人说话那层
  for (let r = 0; r < cap; r++) {
    const y = (r - 1) * ROW_PITCH + shift;   // 最新一行从屏幕上方一格滑入
    if (y > floorY) break;
    const row = rows[r];
    // 渐隐（位置越靠下越淡，但不归零：位置仍是时间） × 呼吸（整片随当前音量亮暗）
    const base = (FADE_BOTTOM + (1 - FADE_BOTTOM) * Math.max(0, 1 - y / viewH))
      * (BREATH_MIN + (1 - BREATH_MIN) * row.loud);
    if (base <= 0.01) continue;
    for (let i = 0; i < row.g.length; i++) {
      const gg = row.g[i];
      if (gg === null) continue;
      bctx.globalAlpha = Math.min(1, base * (row.a[i] || 1));
      bctx.drawImage(atlas, gg * GW, 0, GW, GH,
        cols[i].x + (GW - w) / 2, y + (GH - h) / 2, w, h);
    }
  }
  bctx.globalAlpha = 1;
}
// 16 个频带 → 48 格：线性插值铺满。0dB 的绝对电平没有意义，所以用固定窗口
// (floor..ceil) 而不是自适应 —— 自适应会让安静时的底噪被放大成满格。
function resampleBins(bins) {
  const n = bins.length;
  if (barSrc.length !== BAR_CELLS) barSrc = new Array(BAR_CELLS).fill(0);
  if (!n) { for (let i = 0; i < BAR_CELLS; i++) barSrc[i] = 0; return barSrc; }
  for (let i = 0; i < BAR_CELLS; i++) {
    const pos = (i / (BAR_CELLS - 1)) * (n - 1);
    const lo = Math.floor(pos), hi = Math.min(lo + 1, n - 1), fr = pos - lo;
    const db = bins[lo] + (bins[hi] - bins[lo]) * fr;
    const t = (db - BAR_DB_FLOOR) / (BAR_DB_CEIL - BAR_DB_FLOOR);
    barSrc[i] = Math.max(0, Math.min(1, t));
  }
  return barSrc;
}

// 每一格 = 一个频点：这一格此刻有多响，就决定它长出多高的一串字。
// 一层 = 一格字高。想让浪更连续，密的是列、不是层：层数固定，宽度用来铺满。
const RISE_COLS = 28;              // 升字列数 —— 比雨的 60 列疏，浪才看得出形状
const RISE_SMOOTH = 0.35;          // 相邻列的能量平滑：锯齿来自频带跳变，不是声音本身
const RISE_BELL = 0.62;            // 钟形包络强度：0 = 平坦，1 = 完全按正态分布压

function drawListenerRise(dt, now) {
  const bins = userFeed.spectrum_bins || [];
  // 门限与画法必须同尺度：GATE 是 rms_db 的门（-45），而 bins 是各帧自归一化后的
  // 相对值（安静时最强桶也只到 -20 上下）。拿 GATE 去比 bins，等于用一把尺量另一把
  // 尺的量出的数——人说话时两侧都过门，一静下来 bin 落回 -25 就误判成"没声音"，
  // 一层字都不画。所以这里按 rms_db 判活，画幅交给 BAR_DB_FLOOR..BAR_DB_CEIL。
  // 门就取 BAR_DB_FLOOR：显示窗口的下沿才定义"这帧能不能长出字"，两个门没必要分开。
  const live = userFeed.rms_db > BAR_DB_FLOOR && now - userAt <= FEED_STALE_MS;
  resampleBins(live ? bins : []);

  // 层数 = 屏高 × 目标比例 ÷ 字高。原来写死 7 层 —— 812 高的屏上只有 140px ≈ 17%，
  // 浪只像底部一层毛边，而且"一格最多长 7 层"这件事跟屏多大无关，本来就不该写死。
  const needRows = Math.max(6, Math.round((viewH * RISE_TARGET_FRAC) / GH));
  if (RISE_ROWS !== needRows) {
    RISE_ROWS = needRows;
    riseHeights = []; riseFilled = []; riseGlyphs = [];
  }
  if (riseHeights.length !== RISE_COLS) {
    riseHeights = new Array(RISE_COLS).fill(0);
    riseFilled = new Array(RISE_COLS).fill(0);
    riseGlyphs = Array.from({ length: RISE_COLS }, () =>
      Array.from({ length: RISE_ROWS }, () => randGlyph()));
  }

  // 把 48 格的 barSrc 再抽到 RISE_COLS 列，并做一次横向平滑 —— 浪要连成起伏，
  // 不是一排各自独立的钉子。
  const colV = [];
  for (let i = 0; i < RISE_COLS; i++) {
    const pos = (i / (RISE_COLS - 1)) * (BAR_CELLS - 1);
    const lo = Math.floor(pos), hi = Math.min(lo + 1, BAR_CELLS - 1), fr = pos - lo;
    colV.push(barSrc[lo] + (barSrc[hi] - barSrc[lo]) * fr);
  }
  const colS = colV.slice();
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 1; i < RISE_COLS - 1; i++) {
      colS[i] += (colV[i - 1] + colV[i + 1] - 2 * colV[i]) * RISE_SMOOTH;
    }
  }

  // 钟形包络：字不该挤在某一侧，而该像正态分布 —— 中段最盛、两侧渐稀。
  // 这是**画法**不是数据：频谱本身长什么样仍由 colS 决定，钟形只给它一个重心。
  const mid = (RISE_COLS - 1) / 2;
  for (let i = 0; i < RISE_COLS; i++) {
    const z = (i - mid) / (RISE_COLS * 0.32);   // 标准差 ≈ 屏宽的 32%
    const bell = Math.exp(-0.5 * z * z);
    colS[i] = colS[i] * ((1 - RISE_BELL) + bell * RISE_BELL);
  }

  // 列能量的**时间**平滑。频谱帧是 5Hz 来的：每一帧直接拿来当高度，等于让整个浪头
  // 每秒上下抖五次 —— 横向平滑解决不了这个，那是空间上的锯齿，这是时间上的。
  // 涨得快、落得慢，浪才是"起伏"，而不是一排各自跳动的钉子。
  if (riseEnv.length !== RISE_COLS) riseEnv = new Array(RISE_COLS).fill(0);
  for (let i = 0; i < RISE_COLS; i++) {
    const tau = colS[i] > riseEnv[i] ? RISE_ENV_ATTACK_S : RISE_ENV_RELEASE_S;
    riseEnv[i] += (colS[i] - riseEnv[i]) * Math.min(1, dt / tau);
  }

  // 归一化：让**最强的列**长到 RISE_ROWS 的 RISE_PEAK_TARGET 那么高。这样"浪的平均高度"
  // 钉在屏高的一定比例上，不会随话筒电平、说话远近整体上下漂 —— 形状仍由 colS 决定，
  // 归一化只决定它画多大。参考峰慢慢回落（不是每帧重算），所以它不会自己抖。
  let peak = 0;
  for (let i = 0; i < RISE_COLS; i++) peak = Math.max(peak, riseEnv[i]);
  riseRef = Math.max(peak, riseRef - (dt / RISE_REF_FALL_S) * riseRef);
  const norm = RISE_PEAK_TARGET / Math.max(riseRef, RISE_REF_FLOOR);

  // 列宽 = 屏宽 / 列数，但字形按格距居中：字比格窄，所以列与列之间自然有缝，
  // 而那点缝正好让浪看起来是"一串字"而不是一堵墙。
  const colW = viewW / RISE_COLS;
  const baseY = viewH - 2;
  const RISE_OFFSET = GH / 2;        // 与雨错开半格：两条浪不落在同一行上
  // 每列的字横坐标：整列共用，避免逐层算出来错位
  for (let i = 0; i < RISE_COLS; i++) {
    const want = Math.max(0, Math.min(1, riseEnv[i] * norm)) * RISE_ROWS;
    // 按**时间常数**逼近期望高度，而不是每帧按固定比例衰减：帧率一变，观感就变。
    const tau = want > riseHeights[i] ? RISE_ATTACK_S : RISE_RELEASE_S;
    riseHeights[i] += (want - riseHeights[i]) * Math.min(1, dt / tau);
    const h = riseHeights[i];
    const full = Math.floor(h);
    const x = i * colW + colW / 2;
    const energy = Math.max(0, Math.min(1, colS[i]));
    // 换字只换**这一帧刚长出来的**那几层。原来每帧对每一层都掷 10%×energy 的骰子，
    // 浪头那颗字一秒钟要换好几次 —— 那才是"疯狂闪烁"的直接来源。
    for (let k = riseFilled[i]; k < full && k < RISE_ROWS; k++) riseGlyphs[i][k] = randGlyph();
    riseFilled[i] = Math.min(full, RISE_ROWS);
    // 真静音时一格都不画。此前 k <= full 在 full=0 时会留下一层底痕 —— 那让"没声音"
    // 也看着有字，正是要避免的。层的存在必须完全由高度决定。
    for (let k = 0; k < full && k < RISE_ROWS; k++) {
      const y = baseY - (k + 1) * GH - RISE_OFFSET;
      const dim = k / RISE_ROWS;                      // 越高越淡：尾部渐隐
      const top = k === Math.min(full, RISE_ROWS) - 1;  // 最上面那格才是"浪头"
      bctx.globalAlpha = (0.35 + 0.65 * (1 - dim)) * (0.30 + 0.70 * energy);
      bctx.drawImage(
        top ? headAtlas : atlas,
        riseGlyphs[i][k] * GW, 0, GW, GH,
        x - GW / 2, y, GW, GH);
    }
  }
  bctx.globalAlpha = 1;
}

let lastB = performance.now();
let fpsFrames = 0, fpsAt = performance.now();
function bgLoop() {
  requestAnimationFrame(bgLoop);
  const now = performance.now();
  const dt = (now - lastB) / 1000; lastB = now;

  fpsFrames++;
  if (now - fpsAt >= 500) {
    fps = Math.round((fpsFrames * 1000) / (now - fpsAt));
    fpsFrames = 0; fpsAt = now;
    renderLink();
  }

  bctx.clearRect(0, 0, viewW, viewH);
  const speaking = feed.rms_db > GATE && feedFresh();
  // MOSS 文字吃断线判定：链路死了它就不该继续发光（传导，不是恢复）
  mossEl.classList.toggle('alive', speaking && feed.role === 'ghost');
  // 雨永远在画：它是"最近约十秒的录音带"，静音只是让空白行把旧内容顶出去，
  // 而不是让画面停住或当场清空。
  stepRain(dt, now);
  // 听侧常画：静音时只剩一格底痕，但那一层始终在 —— 人不需要先出声才发现自己被听着。
  drawListenerRise(dt, now);
}
requestAnimationFrame(bgLoop);

// ===== 帧路由 =====
function applyState(f) {
  arena = f.arena || '';
  if (f.groups) groupNames = f.groups;
  const ids = f.ids || [];
  desktopIds = f.desktop || [];
  renderStage(ids, f.layout);
  setFullscreen(f.fullscreen ?? null);
  renderRail();
  syncDiscs();
}

// ---- rail：人切组的唯一入口 ----
// 人点一下 = 一次 switch_view 上行；服务端 activate 后回 broadcast，并把这件事
// 作为 aside 回流给模型（"human switched to #x"）—— 所以这里不需要模型参与，
// 也不需要页面自己维护"当前在哪"：arena 永远从帧里来。
function railButton(label, group, extraClass) {
  const b = document.createElement('button');
  b.className = 'rail-item' + (extraClass ? ' ' + extraClass : '')
    + (group === arena ? ' active' : '');
  b.textContent = label;
  b.title = group || '空屏';
  b.addEventListener('click', () => send({ type: 'switch_view', group }));
  return b;
}

function renderRail() {
  railGroups.textContent = '';
  // "空屏"= 把舞台交还给我（arena = desktop）。它不是组，所以单独一行、隔开。
  railGroups.appendChild(railButton('◌ 空屏', ''));
  railGroups.appendChild(Object.assign(document.createElement('div'), { id: 'rail-sep' }));
  if (!groupNames.length) {
    const empty = document.createElement('div');
    empty.className = 'rail-empty';
    empty.textContent = '还没有组';
    railGroups.appendChild(empty);
    return;
  }
  groupNames.forEach((g) => railGroups.appendChild(railButton('#' + g, g)));
}

function route(f) {
  switch (f.type) {
    case 'snapshot': {
      // 全量帧：reconcile（缺建、多删）。f.items 是所有 item 的详情（含桌面），
      // 页面据此物化 iframe；桌面 item 的 iframe 隐藏，只画代理圆盘。
      const seen = new Set();
      f.items.forEach((it) => {
        seen.add(it.id);
        if (items.has(it.id)) {
          const cur = items.get(it.id);
          cur.label = it.label; cur.group = it.group; cur.url = it.url;
        } else {
          const entry = { id: it.id, url: it.url, label: it.label, group: it.group, icon: it.icon };
          items.set(it.id, entry); makeSlot(entry);
        }
      });
      [...items.keys()].filter((id) => !seen.has(id)).forEach(destroySlot);
      applyState(f);
      break;
    }
    case 'state': applyState(f); break;
    case 'open': {
      const it = f.item;
      if (!items.has(it.id)) {
        const entry = { id: it.id, url: it.url, label: it.label, group: it.group, icon: it.icon };
        items.set(it.id, entry); makeSlot(entry);
      } else {
        // navigate：已存在的 item 换 url，iframe 原地重载（不 reparent）。
        const cur = items.get(it.id);
        cur.url = it.url;
        if (cur.iframe) cur.iframe.src = it.url;
      }
      break;
    }
    case 'close': {
      destroySlot(f.id); items.delete(f.id); break;
    }
    case 'activate': {
      if (f.by_model) { /* 模型切组：可在此处做 activate 动画（WD6） */ }
      applyState(f); break;
    }
    case 'fullscreen': setFullscreen(f.id); break;
    case 'veil': {
      const d = (f.duration || 2) * 1000;
      if (f.gesture === 'mark') veilMark(f.item, f.region || 'full', d);
      else if (f.gesture === 'arrow') veilArrow(f.src, f.dst, d);
      else if (f.gesture === 'text') veilText(f.content, d);
      break;
    }
    case 'audio': {
      // 两侧共用一条总线，谁说话谁发帧。雨只认 ghost，升字只认 user —— 所以按角色
      // 分家存，另一侧说话时不会把这一侧抹掉。
      feedAt = performance.now();          // 断线判定用：这一帧是什么时候到的
      if (f.sample.role === 'user') {
        userFeed = f.sample;
        userAt = feedAt;
      } else {
        feed = f.sample;
        mossEl.classList.toggle('alive', feed.rms_db > GATE);
      }
      st.textContent = `#${arena || 'desktop'} · ${f.sample.role} ${f.sample.rms_db.toFixed(0)}dB`;
      break;
    }
    case 'notice': {
      logLine(f.text); break;
    }
  }
}

// ===== 上行 + log =====
$('#scrim').addEventListener('click', () => { if (fullscreenId) send({ type: 'fullscreen', id: '' }); });
$('#scrim-exit').addEventListener('click', (e) => { e.stopPropagation(); send({ type: 'fullscreen', id: '' }); });

let logCount = 0;
function logLine(text) {
  logCount++;
  $('#log-badge').textContent = logCount;
  const el = document.createElement('div');
  el.textContent = text;
  const list = $('#log-list');
  list.prepend(el);
  while (list.children.length > 50) list.lastChild.remove();
}
$('#log-badge').addEventListener('click', () => $('#log-list').classList.toggle('open'));

// ---- rail 的两个人侧行为：收起、闲置淡出 ----
// 收起是**手动**的（人不点，它不消失）；闲置只是淡，不停用，也不隐藏。

let railIdle = null;
function railPoke() {
  rail.classList.remove('idle');
  clearTimeout(railIdle);
  railIdle = setTimeout(() => {
    if (!rail.matches(':hover') && !railCollapsed()) rail.classList.add('idle');
  }, 4000);
}
rail.addEventListener('pointerenter', railPoke);
rail.addEventListener('pointermove', railPoke);
rail.addEventListener('pointerleave', railPoke);
railPoke();

function setRailCollapsed(v) {
  document.body.classList.toggle('rail-collapsed', v);
  $('#rail-toggle').textContent = v ? '›' : '‹';
  rail.classList.remove('idle');
  // 上报给人侧状态面：栏宽改变的是舞台的**可用区**，模型排布时得知道。
  // （它不进 debug 面 —— debug 面是要退役的，这是语义状态。）
  send({ type: 'rail', collapsed: v });
  // 栏宽变了 → 舞台可用区变了 → 画布与桌面圆盘重新对齐（贴底那层最容易在这里出血）
  syncViewport();
}
$('#rail-toggle').addEventListener('click', (e) => {
  e.stopPropagation();
  setRailCollapsed(!railCollapsed());
});
// 收起后整条边条就是"展开"的按钮 —— 收起是手动的，展开也是。
rail.addEventListener('click', () => { if (railCollapsed()) setRailCollapsed(false); });

// 首次同步放在这里，不放在定义处：syncViewport 会读 MOSS_SCALE 等 const，
// 在它们初始化之前调用会撞上暂时性死区（TDZ）。此刻所有 const 已就位。
syncViewport();
</script>
