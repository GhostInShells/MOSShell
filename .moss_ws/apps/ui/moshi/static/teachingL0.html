<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>讲课模式 — Moshi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #0a0a14;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* ── 弹幕动画 ── */
        @keyframes danmaku-move {
            from { transform: translateX(100vw); }
            to   { transform: translateX(-100%); }
        }
        .danmaku-item {
            position: absolute;
            white-space: nowrap;
            animation: danmaku-move linear forwards;
            pointer-events: none;
            text-shadow: 0 1px 4px rgba(0,0,0,.7);
            z-index: 30;
        }

        /* ── 字幕区 ── */
        #subtitle-bar {
            transition: opacity .3s;
        }
        #subtitle-text {
            transition: all .2s;
        }

        /* ── 退出按钮 ── */
        #exit-btn {
            transition: opacity .5s;
        }
        #exit-btn.inactive { opacity: .15; }
        #exit-btn:hover { opacity: 1 !important; }

        /* ── 课程选择弹窗 ── */
        #course-modal {
            backdrop-filter: blur(8px);
        }
        .course-option {
            cursor: pointer;
            transition: all .15s;
        }
        .course-option:hover {
            background: rgba(99, 102, 241, .15);
            border-color: rgba(99, 102, 241, .5);
        }
    </style>
</head>
<body class="flex flex-col">

    <!-- ====== 主区域：Reflex iframe + 弹幕层 ====== -->
    <div id="stage" class="relative flex-1 w-full overflow-hidden">
        <!-- Reflex 白板 -->
        <iframe id="reflex-frame"
                src="http://localhost:3000"
                class="w-full h-full border-0"
                allow="autoplay"
                loading="eager">
        </iframe>

        <!-- 弹幕容器 -->
        <div id="danmaku-layer" class="absolute inset-0 pointer-events-none overflow-hidden z-20">
        </div>

        <!-- 加载遮罩 -->
        <div id="loading-overlay"
             class="absolute inset-0 bg-[#0a0a14]/90 flex items-center justify-center z-40 hidden">
            <div class="text-center space-y-4">
                <div class="w-10 h-10 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p id="loading-text" class="text-slate-400 text-sm">正在加载课程...</p>
            </div>
        </div>
    </div>

    <!-- ====== 字幕区 ====== -->
    <div id="subtitle-bar"
         class="w-full bg-gradient-to-r from-transparent via-[#0a0a14]/90 to-transparent backdrop-blur-sm py-4 px-8 text-center z-20">
        <p id="subtitle-text" class="text-white text-xl md:text-2xl font-light tracking-wide drop-shadow-md min-h-[2rem]">
<!-- 等待开讲... -->
        </p>
    </div>

    <!-- ====== 退出按钮 ====== -->
    <button id="exit-btn"
            class="fixed bottom-6 right-6 w-12 h-12 rounded-full bg-white/5 border border-white/10
                   flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10
                   z-50 inactive"
            title="退出讲课"
            onclick="exitLecture()">
        ✕
    </button>

    <!-- ====== 课程选择弹窗 ====== -->
    <div id="course-modal"
         class="fixed inset-0 bg-[#0a0a14]/80 flex items-center justify-center z-50 hidden">
        <div class="bg-[#1a1a2e] border border-slate-700/50 rounded-2xl w-[420px] max-h-[70vh] flex flex-col shadow-2xl">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800">
                <h2 class="text-lg font-semibold text-white">选择课程</h2>
                <button onclick="closeCourseModal()"
                        class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700
                               flex items-center justify-center text-sm text-slate-400">
                    ✕
                </button>
            </div>
            <div id="course-list" class="flex-1 overflow-y-auto p-4 space-y-2">
                <p class="text-slate-500 text-sm text-center py-8">加载中...</p>
            </div>
        </div>
    </div>

    <!-- ====== JS ====== -->
    <script>
    // ── 常量 ──
    const REFLEX_URL = 'http://localhost:3000';
    const API_BASE = '';

    // ── 状态 ──
    let currentCourse = null;
    let chatEventSource = null;
    let subtitleEventSource = null;
    let danmakuEventSource = null;
    let inactivityTimer = null;
    const INACTIVITY_MS = 3000;

    // ── 初始化 ──
    async function init() {
        const params = new URLSearchParams(window.location.search);
        const course = params.get('course');

        if (course) {
            currentCourse = course;
            startLecture(course);
        } else {
            showCourseModal();
        }

        // 鼠标移动 → 显示退出按钮 → 重置计时器
        document.addEventListener('mousemove', resetInactivityTimer);
        document.addEventListener('touchstart', resetInactivityTimer);
        resetInactivityTimer();

        // 连接 SSE（聊天回复 / 字幕 / 弹幕）
        connectChatSSE();
        connectSubtitleSSE();
        connectDanmakuSSE();
    }

    // ── 退出按钮淡出 ──
    function resetInactivityTimer() {
        const btn = document.getElementById('exit-btn');
        btn.classList.remove('inactive');
        clearTimeout(inactivityTimer);
        inactivityTimer = setTimeout(() => {
            btn.classList.add('inactive');
        }, INACTIVITY_MS);
    }

    function exitLecture() {
        if (confirm('确定退出讲课吗？')) {
            window.location.href = '/';
        }
    }

    // ── 课程选择弹窗 ──
    async function showCourseModal() {
        const modal = document.getElementById('course-modal');
        modal.classList.remove('hidden');

        const list = document.getElementById('course-list');
        list.innerHTML = '<p class="text-slate-500 text-sm text-center py-8">加载中...</p>';

        try {
            const resp = await fetch('/api/courses', { method: 'POST' });
            const courses = await resp.json();

            if (!courses.length) {
                list.innerHTML = '<p class="text-slate-500 text-sm text-center py-8">暂无课程，请先备课</p>';
                return;
            }

            list.innerHTML = courses.map(c => `
                <div class="course-option p-4 rounded-xl border border-slate-800/60 bg-[#0d0d1a]/60"
                     onclick="selectCourse('${c.name}')">
                    <div class="text-white font-medium">${c.title || c.name}</div>
                    <div class="text-slate-500 text-xs mt-1">${c.chapters_count} 章</div>
                </div>
            `).join('');
        } catch (e) {
            list.innerHTML = '<p class="text-red-400 text-sm text-center py-8">加载失败，请确认服务已启动</p>';
        }
    }

    function closeCourseModal() {
        document.getElementById('course-modal').classList.add('hidden');
    }

    function selectCourse(name) {
        closeCourseModal();
        currentCourse = name;
        // 更新 URL
        const url = new URL(window.location);
        url.searchParams.set('course', name);
        window.history.replaceState({}, '', url);
        startLecture(name);
    }

    // ── 开讲 ──
    async function startLecture(course) {
        showLoading(`正在加载《${course}》...`);
        try {
            const resp = await fetch('/api/lecture/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ course }),
            });
            const result = await resp.json();
            if (result.ok) {
                hideLoading();
                setSubtitle(`《${result.title || course}》— ${result.chapter_name || ''}`);
            } else {
                setSubtitle('加载失败: ' + (result.error || '未知错误'));
                hideLoading();
            }
        } catch (e) {
            console.error('lecture_start failed:', e);
            setSubtitle('连接失败，请确认服务已启动');
            hideLoading();
        }
    }

    async function sendChat(text) {
        try {
            await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, mode: 'teaching' }),
            });
        } catch (e) {
            console.error('sendChat failed:', e);
        }
    }

    // ── 加载遮罩 ──
    function showLoading(msg) {
        const overlay = document.getElementById('loading-overlay');
        document.getElementById('loading-text').textContent = msg;
        overlay.classList.remove('hidden');
    }

    function hideLoading() {
        document.getElementById('loading-overlay').classList.add('hidden');
    }

    // ── SSE：聊天回复 ──
    function connectChatSSE() {
        if (chatEventSource) {
            chatEventSource.close();
        }

        chatEventSource = new EventSource('/api/chat/stream');

        chatEventSource.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);
                if (msg.role === 'ai') {
                    // AI 回复 → 显示为字幕
                    setSubtitle(msg.text);
                    hideLoading();
                }
            } catch (e) {
                // 非 JSON 数据，跳过
            }
        };

        chatEventSource.onerror = () => {
            // SSE 断连，5 秒后重试
            setTimeout(connectChatSSE, 5000);
        };
    }

    // ── SSE：字幕流 ──
    function connectSubtitleSSE() {
        if (subtitleEventSource) {
            subtitleEventSource.close();
        }

        subtitleEventSource = new EventSource('/api/subtitle/stream');

        subtitleEventSource.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);
                const el = document.getElementById('subtitle-text');
                if (msg.type === 'chunk') {
                    // 流式追加字幕
                    if (el._newSentence) {
                        el.textContent = msg.text;
                        el._newSentence = false;
                    } else {
                        el.textContent += msg.text;
                    }
                    el.style.opacity = '1';
                    clearTimeout(el._fadeTimer);
                } else if (msg.type === 'full') {
                    // 完整句子标记（用于下一句开始新行）
                    el.textContent = msg.text;
                    el._newSentence = true;
                    el.style.opacity = '1';
                    clearTimeout(el._fadeTimer);
                    el._fadeTimer = setTimeout(() => {
                        el.style.opacity = '0.4';
                    }, 8000);
                }
            } catch (e) {
                // 非 JSON 数据，跳过
            }
        };

        subtitleEventSource.onerror = () => {
            setTimeout(connectSubtitleSSE, 5000);
        };
    }

    // ── SSE：弹幕流 ──
    function connectDanmakuSSE() {
        if (danmakuEventSource) {
            danmakuEventSource.close();
        }

        danmakuEventSource = new EventSource('/api/danmaku/stream');

        danmakuEventSource.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);
                addDanmaku(msg.sender || '匿名', msg.text, msg.color || 'white');
            } catch (e) {
                // 非 JSON 数据，跳过
            }
        };

        danmakuEventSource.onerror = () => {
            setTimeout(connectDanmakuSSE, 5000);
        };
    }

    // ── 字幕 ──
    function setSubtitle(text) {
        const el = document.getElementById('subtitle-text');
        el.textContent = text;
        el._newSentence = true;
        el.style.opacity = '1';
        // 8 秒后自动淡出（如果没更新的话）
        clearTimeout(el._fadeTimer);
        el._fadeTimer = setTimeout(() => {
            el.style.opacity = '0.4';
        }, 8000);
    }

    // ── 弹幕（供后续 SSE 调用）──
    function addDanmaku(sender, text, color = 'white') {
        const layer = document.getElementById('danmaku-layer');
        const el = document.createElement('div');
        el.className = 'danmaku-item';
        el.style.color = color;
        el.style.fontSize = '1rem';
        el.style.top = (15 + Math.random() * 55) + '%';
        el.style.animationDuration = (8 + Math.random() * 10) + 's';
        el.textContent = `${sender}: ${text}`;
        layer.appendChild(el);

        // 动画结束后移除
        el.addEventListener('animationend', () => el.remove());
    }

    // ── 暴露到全局 ──
    window.addDanmaku = addDanmaku;
    window.setSubtitle = setSubtitle;

    // ── 启动 ──
    init();
    </script>
</body>
</html>
