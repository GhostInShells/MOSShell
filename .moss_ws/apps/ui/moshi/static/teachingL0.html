<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沉浸式教学直播 UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 弹幕动画效果 */
        @keyframes danmaku-move {
            from { transform: translateX(100vw); }
            to { transform: translateX(-100%); }
        }
        .danmaku-item {
            position: absolute;
            white-space: nowrap;
            animation: danmaku-move linear infinite;
        }
    </style>
</head>
<body class="bg-[#10101c] text-slate-200 font-sans overflow-hidden select-none w-screen h-screen m-0 p-0 flex items-center justify-center">

    <div class="relative w-full aspect-video max-w-[1920px] max-h-[1080px] bg-[#1a1a2e] shadow-2xl overflow-hidden flex flex-col justify-between p-8">
        
        <div class="w-full flex justify-center z-10">
            <div class="bg-[#1e1e38]/80 backdrop-blur-md border border-slate-700/50 px-4 py-1.5 rounded-full text-xs text-slate-400 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-purple-500 animate-pulse"></span>
                <span>练习模式 · 仅主讲人可见</span>
            </div>
        </div>

        <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
            <div class="absolute top-[25%] left-[10%] w-[50%] h-[2px] bg-slate-800/40"></div>
            <div class="absolute top-[28%] left-[10%] w-[35%] h-[2px] bg-slate-800/40"></div>
            <div class="absolute top-[45%] left-[10%] w-[55%] h-[2px] bg-slate-800/40"></div>
            <div class="absolute top-[48%] left-[10%] w-[50%] h-[2px] bg-slate-800/40"></div>
            
            <div class="absolute bottom-[25%] left-[10%] flex items-end gap-3 h-24 opacity-20">
                <div class="w-8 h-12 bg-slate-600 rounded-sm"></div>
                <div class="w-8 h-16 bg-slate-600 rounded-sm"></div>
                <div class="w-8 h-10 bg-slate-600 rounded-sm"></div>
                <div class="w-8 h-20 bg-slate-600 rounded-sm"></div>
                <div class="w-8 h-14 bg-slate-600 rounded-sm"></div>
                <div class="w-8 h-24 bg-slate-600 rounded-sm"></div>
                <div class="w-8 h-16 bg-slate-600 rounded-sm"></div>
            </div>

            <div class="danmaku-item text-green-400 font-medium text-lg top-[20%]" style="animation-duration: 14s; animation-delay: 0s;">这个讲得好！</div>
            <div class="danmaku-item text-yellow-400 font-medium text-lg top-[35%]" style="animation-duration: 18s; animation-delay: 2s;">能解释下这个概念吗？</div>
            <div class="danmaku-item text-white/80 text-base top-[15%]" style="animation-duration: 12s; animation-delay: 5s;">666</div>
            <div class="danmaku-item text-white/90 text-lg top-[40%]" style="animation-duration: 16s; animation-delay: 1s;">通俗易懂，赞！</div>
        </div>

        <div class="absolute right-8 top-[35%] w-[320px] bg-[#0d0d1a]/90 backdrop-blur-xl border border-slate-800 rounded-xl p-4 shadow-xl z-10">
            <div class="flex justify-between items-center border-b border-slate-800/60 pb-3 mb-4">
                <div class="flex items-center gap-2 text-sm font-semibold tracking-wide">
                    <span>📝</span> 演讲者手卡
                </div>
                <div class="flex gap-1.5">
                    <button class="w-5 h-5 rounded bg-slate-800 flex items-center justify-center text-[10px] text-slate-400 hover:bg-slate-700">▼</button>
                    <button class="w-5 h-5 rounded bg-slate-800 flex items-center justify-center text-xs text-slate-400 hover:bg-slate-700">✕</button>
                </div>
            </div>
            <div class="space-y-4 text-xs">
                <div>
                    <div class="text-slate-500 flex items-center gap-1 mb-1">📌 要点</div>
                    <div class="text-slate-200 pl-4 font-medium">回顾核心论点——杠杆率决定天花板</div>
                </div>
                <div class="border-t border-slate-800/40 pt-3">
                    <div class="text-slate-500 flex items-center gap-1 mb-1">🔄 过渡</div>
                    <div class="text-slate-200 pl-4 font-medium">接下来我们看第三个案例...</div>
                </div>
                <div class="border-t border-slate-800/40 pt-3">
                    <div class="text-slate-500 flex items-center gap-1 mb-1">📊 关键数据</div>
                    <div class="text-slate-200 pl-4 font-medium flex items-center gap-2">
                        <span>同比增长</span>
                        <span class="text-emerald-400 font-bold text-sm">37%</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full flex flex-col items-center gap-4 z-10 mt-auto">
            
            <div class="w-[80%] bg-gradient-to-r from-transparent via-[#0a0a14]/80 to-transparent backdrop-blur-sm py-3 px-8 text-center">
                <p class="text-white text-xl md:text-2xl font-normal tracking-wide drop-shadow-md">
                    " 今天我们讨论三个核心问题 "
                </p>
            </div>

            <div class="bg-[#090911]/90 border border-slate-800/80 rounded-full px-6 py-2.5 flex items-center gap-6 shadow-2xl backdrop-blur-lg">
                <div class="flex items-center gap-3">
                    <span class="text-base opacity-70">⏱️</span>
                    <span class="text-2xl font-mono tracking-widest text-white font-light">00:41</span>
                </div>
                <div class="h-6 w-[1px] bg-slate-800"></div>
                <div class="flex items-center gap-3">
                    <button class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 active:scale-95 transition-all flex items-center justify-center text-xs text-slate-300">
                        ‖
                    </button>
                    <button class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 active:scale-95 transition-all flex items-center justify-center text-sm text-slate-300">
                        ↻
                    </button>
                </div>
            </div>
        </div>

        <button class="absolute bottom-6 right-6 w-12 h-12 rounded-full bg-[#0d0d1a]/50 border border-slate-800 flex items-center justify-center text-slate-400 hover:bg-slate-800 hover:text-white transition-all opacity-30 hover:opacity-100 duration-300 z-20" title="退出">
            ✕
        </button>

    </div>

</body>
</html>
