[pytest]
addopts =
    --ignore=src/ghoshell_moss_contrib/jetarm_ws/src/jetarm_channel/test
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore:websockets\.legacy is deprecated.*:DeprecationWarning
    ignore:websockets\.server\.WebSocketServerProtocol is deprecated:DeprecationWarning
    ignore:remove second argument of ws_handler:DeprecationWarning
    ignore:This process.*is multi-threaded, use of forkpty.*:DeprecationWarning

# This distribution's tests live in ./tests. Sibling packages under packages/ keep their own
# suite and their own config; a root-level run must not collect them.
testpaths = tests
