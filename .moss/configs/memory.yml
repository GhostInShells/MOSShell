# Aurelius 的 Memento 记忆策略。
#
# 此文件只控制“如何保存、折叠和反思”，不保存聊天原文；原文位于
# .moss/ghosts/aurelius/memento/。修改后请重启 Aurelius 才会生效。

# 保留在模型上下文中的最近完整 Moment 数。增大可提升近期细节准确性，
# 但会增加每轮 prompt；必须至少为 1。
detail_n: 12

# 保留在模型上下文中的早期 CommitNote 数。-1 表示全部；长会话建议设置
# 为有限正数，以避免摘要无限占用 prompt。
summary_m: -1

# staging 中达到多少个成功完成的 Moment 后，自动形成 mechanical commit。
# 每个成功 Moment 都会立即落盘到 staging；0 仅关闭“自动冻结”，不关闭保存。
auto_commit_every: 4

# 是否在 commit 后调用后台小模型追加反思 note。关闭后主记忆仍完整可用，
# 已有待反思 commit 会保留，重新开启并重启后可自动追赶。
reflection_enabled: true

# 反思模型在 LLMConfig 中使用的 tag。默认 small_fast_model 应映射到成本和延迟都
# 合适的模型；若该 tag 未配置，请改成已有 tag 或先关闭 reflection_enabled。
reflection_model_tag: small_fast_model

# 单条反思 note 的最大字符数。它约束持久化释义长度，不是模型 token 限额。
reflection_max_summary_chars: 360

# 单次发送给反思模型的冻结可见原文最大字符数。输入只含用户可见 percepts 和 logos，
# 不包含模型隐藏思维链。
reflection_max_source_chars: 12000

# 单次启动时最多追赶多少个尚未反思的 commit。0 表示不在启动时追赶，
# 可稍后通过 <ghost:memory_reflect /> 手动调度。
reflection_startup_limit: 16

# 是否启用旁路策展：后台小模型异步读取冻结轨迹，把稳定事实沉淀到 facts.md 并
# pin 进认知场 Ground。它是 reflection 的姊妹旁路——只追加人类可读原文、可失败、
# 不进 articulate 热路径，且从不解析 Moment 正文语义（payload 不透明）。
# 关闭后事实回忆仍可用：模型自行 memory_search / memory_show 查证冻结原文。
curation_enabled: true

# 策展模型在 LLMConfig 中使用的 tag。默认复用 small_fast_model；若未配置该 tag，
# 请改成已有 tag 或先关闭 curation_enabled。
curation_model_tag: small_fast_model

# mechanical 索引与 curation 摘录时视为“用户输入”的 Moment percept source。
# 真实 Shell 默认 Input nucleus 使用 input_signal_nucleus；input/user 保留给显式嵌入。
curation_index_sources:
  - input_signal_nucleus
  - input
  - user

# 单次发送给策展模型的冻结轨迹最大字符数。输入只含用户可见 percepts、logos 与
# 已冻结的 CommitNote，不包含模型隐藏思维链。
curation_max_source_chars: 12000

# facts.md 的最大字符数。策展产物是给模型阅读的可读笔记，不是结构化事实库。
curation_max_notes_chars: 4000

# 策展笔记文件名，写在 Ground 根下并被 pin 进当前帧。
curation_notes_name: facts.md

# Aurelius 启动时自动打开项目根 Ground。DESKTOP.md body 进入本帧 instruction，
# Pin/frame 进入本帧 context；二者都不会自动形成长期 Claim。
desktop_enabled: true

# ── 上下文预算（输入侧）──
# detail_n/summary_m 只按帧数切窗，与 token 无关；以下配置让 articulate 按
# 模型契约 (context_window - max_output_tokens - margin) 主动收缩渲染窗口，
# 并在 provider 仍报输入溢出时兜底折半重试。压缩只减少"渲染进上下文的量"，
# 不销毁任何 Memento 原文（memory_show 永远可取回）。

# 是否启用 token 预算与溢出兜底。关闭则退回一次性组装（撞墙即失败）。
context_budget_enabled: true

# 预算安全垫 (tokens)：从 context_window - max_output_tokens 再扣除，
# 吸收字符估算误差。估算器方向保守（宁可提前压缩，不可撞墙）。
context_token_margin: 4096

# 主动收缩时明细帧窗口的下限；触底仍超预算则交给溢出兜底重试。
context_min_detail_n: 2

# system prompt + 当前输入 + ground 注入的固定开销估算 (tokens)，计入预算占用。
context_fixed_overhead_tokens: 4096
