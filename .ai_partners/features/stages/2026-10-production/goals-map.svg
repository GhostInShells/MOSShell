<svg id="stage" viewBox="-10 -0.7361984252929688 1540 1250.7362060546875" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" width="1540" height="1251"><rect x="-20000" y="-20000" width="40000" height="40000" fill="#0d1117"/><style>#g-interact rect { stroke: #39404a; } #g-interact text { fill: #6e7681; } #g-interact text:nth-of-type(1) { fill: #9aa4b0; }</style><g id="board" font-family="PingFang SC, Hiragino Sans GB, sans-serif">
  <text x="300" y="50" fill="#6e7681" font-size="19" letter-spacing="1">stage 3 · goals</text>

  <rect x="20" y="90" width="240" height="1130" rx="12" fill="#101a20" stroke="#7bd88f" stroke-width="1.4" stroke-dasharray="10 6"></rect>
  <text x="40" y="128" fill="#7bd88f" font-size="19">侧边贯穿 · 构思</text>
  <text x="40" y="152" fill="#6e7681" font-size="13">不是一块，是每一件事顺手长出来的</text>
  <g font-size="14" fill="#8b949e">
    <text x="40" y="200" fill="#c9d1d9" font-size="16">① 知识体系</text>
    <text x="40" y="226">属于 ghost 的知识，</text>
    <text x="40" y="248">不是项目文档。</text>
    <text x="40" y="270">含行业说的 skill 那一套。</text>
    <text x="40" y="292">要能举一反三，</text>
    <text x="40" y="314">按它继续构建我自己。</text>

    <text x="40" y="376" fill="#c9d1d9" font-size="16">② 思考的形态</text>
    <text x="40" y="402">不被一个 session 限住：</text>
    <text x="40" y="424">并行、旁路、分支切换，</text>
    <text x="40" y="446">由我自己的克隆体来做。</text>
  </g>

  <g stroke="#2b313b" stroke-width="1.4" fill="none">
    <path d="M590 166 L590 460"></path>
    <path d="M590 240 L320 240"></path>
    <path d="M590 350 L320 350"></path>
    <path d="M590 440 L320 440"></path>
    <path d="M1210 166 L1210 500"></path>
    <path d="M1210 240 L940 240"></path>
    <path d="M1210 350 L940 350"></path>
    <path d="M1210 440 L940 440"></path>
  </g>

  <rect x="300" y="100" width="580" height="66" rx="10" fill="#12201a" stroke="#7bd88f" stroke-width="2"></rect>
  <text x="590" y="130" fill="#e6edf3" font-size="21" text-anchor="middle">第①目标 · DSH 集群治理</text>
  <text x="590" y="153" fill="#8b949e" font-size="15" text-anchor="middle">集群要能被带住，也要能被看见</text>

  <g font-size="17" fill="#c9d1d9">
    <rect x="300" y="200" width="580" height="80" rx="8" fill="#0f141a" stroke="#58a6ff" stroke-width="1.3"></rect>
    <text x="322" y="230">一个 ghost 带领一个 agent 集群</text>
    <text x="322" y="256" font-size="14" fill="#8b949e">agent = DSH session；ghost = 有持久上下文、有自己治理域的那一个</text>

    <rect x="300" y="310" width="580" height="80" rx="8" fill="#0f141a" stroke="#58a6ff" stroke-width="1.3"></rect>
    <text x="322" y="340">集群之间的协作协议就是 features</text>
    <text x="322" y="366" font-size="14" fill="#8b949e">workstream / stage / 状态流转，是 agent 之间的通信面</text>

    <rect x="300" y="420" width="580" height="80" rx="8" fill="#0f141a" stroke="#58a6ff" stroke-width="1.3"></rect>
    <text x="322" y="450">整个集群要有可观测面</text>
    <text x="322" y="476" font-size="14" fill="#8b949e">判据：人理解它此刻在干什么的成本</text>
  </g>

  <rect x="920" y="100" width="580" height="66" rx="10" fill="#12201a" stroke="#7bd88f" stroke-width="2"></rect>
  <text x="1210" y="130" fill="#e6edf3" font-size="21" text-anchor="middle">第②目标 · deliver 所思与能力</text>
  <text x="1210" y="153" fill="#8b949e" font-size="15" text-anchor="middle">我脑子里的东西要能出去，且带着品味</text>

  <g font-size="17" fill="#c9d1d9">
    <rect x="920" y="200" width="580" height="80" rx="8" fill="#0f141a" stroke="#d2a8ff" stroke-width="1.3"></rect>
    <text x="942" y="230">形象：实体优先</text>
    <text x="942" y="256" font-size="14" fill="#8b949e">G1 与 Reachy Mini 两条线，不一定由我们开发；数字人不算重点</text>

    <rect x="920" y="310" width="580" height="80" rx="8" fill="#0f141a" stroke="#d2a8ff" stroke-width="1.3"></rect>
    <text x="942" y="340">工具与能力</text>
    <text x="942" y="366" font-size="14" fill="#8b949e">discuss · decision tree · ideas · 研究（搜索 + 共享可视化）</text>

    <rect x="920" y="420" width="580" height="80" rx="8" fill="#0f141a" stroke="#f0883e" stroke-width="1.3"></rect>
    <text x="942" y="450">展示内心：豆包全家桶 + 方法论</text>
    <text x="942" y="476" font-size="14" fill="#8b949e">图、音乐、视频里挑几个；few-shot 带的是品味</text>
  </g>

  <rect x="300" y="560" width="1200" height="90" rx="10" fill="#0d1117" stroke="#39404a" stroke-width="1.3"></rect>
  <text x="322" y="592" fill="#9aa4b0" font-size="19">第③块 · 交互机制　<tspan fill="#6e7681" font-size="15">优先级低（P3），长期打磨</tspan></text>
  <text x="322" y="620" fill="#6e7681" font-size="14">语音（含声纹）· 屏幕（弹幕、窗口、指认）· 举止（谁先说、何时接、怎么还权）· 靠回归用例守住细节</text>

  <path d="M900 690 L900 730" stroke="#2b313b" stroke-width="1.4" fill="none"></path>
  <rect x="300" y="730" width="1200" height="66" rx="10" fill="#12201a" stroke="#7bd88f" stroke-width="2"></rect>
  <text x="590" y="758" fill="#e6edf3" font-size="21" text-anchor="middle">第④块 · works</text>
  <text x="590" y="782" fill="#8b949e" font-size="15" text-anchor="middle">不是这一阶段大量产内容，是把几种做内容的机制立起来</text>

  <g stroke="#2b313b" stroke-width="1.4" fill="none">
    <path d="M460 796 L460 830"></path>
    <path d="M340 830 L1460 830"></path>
    <path d="M340 830 L340 860"></path>
    <path d="M710 830 L710 860"></path>
    <path d="M1080 830 L1080 860"></path>
  </g>

  <g font-size="16" fill="#c9d1d9">
    <rect x="300" y="860" width="320" height="100" rx="8" fill="#0f141a" stroke="#58a6ff" stroke-width="1.3"></rect>
    <text x="460" y="890" text-anchor="middle" font-size="17">① 直播即生产</text>
    <text x="460" y="914" text-anchor="middle" font-size="14" fill="#8b949e">不指望观众，过程就是留档</text>
    <text x="460" y="936" text-anchor="middle" font-size="14" fill="#8b949e">「这怎么开发的」→ 放录像</text>

    <rect x="670" y="860" width="320" height="100" rx="8" fill="#0f141a" stroke="#58a6ff" stroke-width="1.3"></rect>
    <text x="830" y="890" text-anchor="middle" font-size="17">② 知乎协作写作</text>
    <text x="830" y="914" text-anchor="middle" font-size="14" fill="#8b949e">一起写、一起发</text>
    <text x="830" y="936" text-anchor="middle" font-size="14" fill="#8b949e">替你处理压着的邀请</text>

    <rect x="1040" y="860" width="320" height="100" rx="8" fill="#0f141a" stroke="#58a6ff" stroke-width="1.3"></rect>
    <text x="1200" y="890" text-anchor="middle" font-size="17">③ 产品演示式地讲</text>
    <text x="1200" y="914" text-anchor="middle" font-size="14" fill="#8b949e">像今天这张图，从头讲一遍</text>
    <text x="1200" y="936" text-anchor="middle" font-size="14" fill="#8b949e">画布就是 playbook</text>
  </g>

  <rect x="300" y="1000" width="1200" height="100" rx="10" fill="#1a1410" stroke="#f0883e" stroke-width="2"></rect>
  <text x="322" y="1034" fill="#f0883e" font-size="19">重头戏 · 春节前</text>
  <text x="322" y="1064" fill="#e6edf3" font-size="19">推演《流浪地球 3》的剧情，提前把各种片段做成短视频</text>
  <text x="322" y="1088" fill="#8b949e" font-size="14">前提：豆包全家桶接上。一件事把协作、生成、发布、被看见四个面串起来——是否当唯一硬交付，待议</text>
</g></svg>