# 叠加层: moss MCP client.
# moss-shell --mode system_test mcp --transport streamable_http 提供 CTML 动词
# (moss_instruction / ctml_append / ctml_exec / ctml_observe / ctml_replan / ctml_interrupt),
# 经 dsh-mcp-client 注册为 mcp__moss__* 工具, 当前 harness 的 agent 即可用 CTML 调 moss runtime.

- insert:
    - id: mcp-moss
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: moss
        url: http://127.0.0.1:20773/mcp
        headers: {}
        toolCallTimeoutMs: 300000
        failOnStartupError: false
