<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>background.html — 空屏存在感 + 语音视效 验证</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #05070a; color: #ddd; font: 13px/1.4 ui-monospace, monospace; overflow: hidden; }

  #bg { position: absolute; inset: 0; display: block; }

  /* ===== MOSS 文字：遮罩让「活」变得廉价 =====
     background-clip:text —— 文字是遮罩，动的是它背后的渐变。
     静态 = 半透明纯色字；活 = 字里渐变流动。成本 = 一个 DOM 元素 + GPU 合成。 */
  #moss {
    position: absolute; top: 34%; left: 0; right: 0; z-index: 2;
    text-align: center; font-size: 24vmin; font-weight: 900; letter-spacing: 0.04em;
    background: linear-gradient(90deg, #127a4b, #3ddc8f, #127a4b);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; background-size: 200% 100%;
    opacity: 0.35; transition: opacity .4s;
    pointer-events: none;
  }
  #moss.alive { opacity: 1; animation: flow 1.6s linear infinite; }
  @keyframes flow { to { background-position: 200% 0; } }

  /* ===== 输入框：空屏时是主角（屏中下）。有物料时退成顶部细带 —— 两位置见 WD5。 */
  #input {
    position: absolute; top: 60%; left: 50%; transform: translateX(-50%); z-index: 3;
    width: 420px; max-width: 82vw; padding: 12px 16px; font-size: 16px;
    background: rgba(16,18,22,.85); color: #ddd;
    border: 1px solid #2a3340; border-radius: 8px; outline: none;
  }
  #input:focus { border-color: #3ddc8f; }

  #fps  { position: absolute; top: 12px; left: 12px;  z-index: 4; color: #8f8; font-size: 12px; }
  #st   { position: absolute; top: 12px; right: 12px; z-index: 4; color: #8af; font-size: 12px; text-align: right; }

  #ctl {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 8px 12px; display: flex; gap: 6px; background: rgba(8,10,14,.9); border-top: 1px solid #1c2633;
  }
  #ctl button {
    background: #161d26; color: #ddd; border: 1px solid #2a3340;
    border-radius: 4px; padding: 5px 12px; cursor: pointer;
  }
  #ctl button:hover { border-color: #3ddc8f; }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div id="moss">MOSS</div>
<input id="input" placeholder="和 MOSS 说点什么…（空屏时居中，有物料时退成顶栏）">
<div id="fps"></div>
<div id="st"></div>
<div id="ctl">
  <button data-role="ghost">ghost 说话（绿字雨）</button>
  <button data-role="user">人说话（底部 ECG）</button>
  <button data-role="idle">idle（冻结）</button>
</div>

<script>
// =====================================================================
// 设计动机（web_manager.md WD5）：
//   - 数据面 = AudioSampleTopic（types/topics/audio.py：role / rms_db / spectrum_bins
//     / waveform，5Hz，no PCM）。本页用一个 5Hz mock 模拟它；真实数据由 node 订阅 topic。
//   - 两条假设：① MOSS 文字遮罩（background-clip:text）够廉价；② 字符雨 canvas 2D 60fps。
//   - 底噪不发：rms_db 低于阈值不产生字符 —— 静默时屏幕冻结（KD6 空闲冻结）。
// 判据：ghost 说话时 fps 稳在 60 附近；idle 时背景完全静止（无幽灵帧）。
// =====================================================================

const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
const fpsEl = document.getElementById('fps');
const stEl = document.getElementById('st');
const mossEl = document.getElementById('moss');

function sizeCanvas() {
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
addEventListener('resize', sizeCanvas);
sizeCanvas();

// ---- mock AudioSampleTopic feed（5Hz，200ms）----
const feed = { role: 'idle', rms_db: -80, peak: 0, spectrum: new Array(16).fill(-96), waveform: new Array(128).fill(0) };
let feedTimer = null;
function setRole(role) {
  feed.role = role;
  mossEl.classList.toggle('alive', role === 'ghost');
  clearInterval(feedTimer);
  if (role === 'idle') { feed.rms_db = -80; feed.spectrum = new Array(16).fill(-96); feed.waveform = new Array(128).fill(0); return; }
  feedTimer = setInterval(() => {
    if (role === 'ghost') {
      feed.rms_db = -26 + Math.random() * 14;
      feed.peak = 0.4 + Math.random() * 0.6;
      // 说话能量偏中低频：低 bin 高、高 bin 低
      feed.spectrum = Array.from({ length: 16 }, (_, i) => -70 + (i < 8 ? Math.random() * 50 : Math.random() * 25));
      feed.waveform = Array.from({ length: 128 }, (_, i) => Math.sin(i / 4 + Math.random()) * feed.peak * (0.4 + Math.random() * 0.6));
    } else { // user
      feed.rms_db = -30 + Math.random() * 12;
      feed.peak = 0.3 + Math.random() * 0.5;
      feed.spectrum = Array.from({ length: 16 }, () => -72 + Math.random() * 45);
      feed.waveform = Array.from({ length: 128 }, (_, i) => (Math.random() - 0.5) * 2 * feed.peak);
    }
  }, 200);
}

// ---- 字符雨：canvas 2D + 预渲染字形图集 ----
const CHARSET = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEFZ$@#%&*+=<>';
const CW = 16, CH = 20;
const atlas = document.createElement('canvas');
atlas.width = CHARSET.length * CW;
atlas.height = CH;
const actx = atlas.getContext('2d');
actx.font = 'bold 15px ui-monospace, monospace';
actx.textAlign = 'center'; actx.textBaseline = 'middle';
actx.fillStyle = '#0f0';
for (let i = 0; i < CHARSET.length; i++) actx.fillText(CHARSET[i], i * CW + CW / 2, CH / 2);

let cols = [];
function initCols() {
  const n = Math.ceil(innerWidth / CW);
  cols = Array.from({ length: n }, (_, i) => ({
    x: i * CW,
    head: Math.random() * innerHeight,
    speed: 50 + Math.random() * 90,     // px/s 下落
    buf: [],                            // 滚动的字符（新→旧），定长尾迹
    next: 0,
  }));
}
addEventListener('resize', initCols);
initCols();
const TAIL = 18, EMIT_MS = 333;         // 3Hz 下发 + 定长尾迹（不会无限加长）

function pickChar(colIdx) {
  const bin = feed.spectrum[colIdx % feed.spectrum.length];
  const norm = Math.min(1, Math.max(0, (bin + 96) / 96));  // -96..0 dB → 0..1
  return Math.min(CHARSET.length - 1, Math.floor(norm * CHARSET.length));
}

const GATE = -45;                        // 底噪不发
function stepRain(dt, now) {
  const active = feed.role === 'ghost' && feed.rms_db > GATE;
  for (const c of cols) {
    c.head += c.speed * dt;
    if (active && now >= c.next) {
      c.buf.unshift(pickChar(c.x / CW));
      if (c.buf.length > TAIL) c.buf.pop();
      c.next = now + EMIT_MS + Math.random() * 200;
    }
    // 画尾迹：头部最亮，尾部淡出
    for (let k = 0; k < c.buf.length; k++) {
      const y = c.head - k * CH;
      if (y < 0 || y > innerHeight) continue;
      const a = 1 - k / c.buf.length;
      ctx.globalAlpha = a;
      ctx.drawImage(atlas, c.buf[k] * CW, 0, CW, CH, c.x, y, CW, CH);
    }
  }
  ctx.globalAlpha = 1;
}

// ---- 底部 ECG（人说话被听到）----
function drawEcg() {
  const baseY = innerHeight * 0.82, amp = innerHeight * 0.12;
  const w = feed.waveform.length;
  const th = 0.5;                        // 超阈红色
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < w; i++) {
    const x = (i / (w - 1)) * innerWidth;
    const y = baseY - feed.waveform[i] * amp;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = '#3d8'; ctx.stroke();
  // 超阈段落描红
  ctx.beginPath();
  let drawing = false;
  for (let i = 0; i < w; i++) {
    const hot = Math.abs(feed.waveform[i]) > th;
    const x = (i / (w - 1)) * innerWidth;
    const y = baseY - feed.waveform[i] * amp;
    if (hot && !drawing) { ctx.moveTo(x, y); drawing = true; }
    else if (hot && drawing) { ctx.lineTo(x, y); }
    else if (!hot && drawing) { drawing = false; }
  }
  ctx.strokeStyle = '#f44'; ctx.stroke();
  // 底部频谱柱，超阈红
  const bw = innerWidth / 16;
  for (let i = 0; i < 16; i++) {
    const h = Math.max(0, (feed.spectrum[i] + 96) / 96) * 26;
    ctx.fillStyle = feed.spectrum[i] > -45 ? '#f44' : '#3d8';
    ctx.fillRect(i * bw, innerHeight - h, bw - 2, h);
  }
}

// ---- 主循环 ----
let frames = 0, fpsTime = performance.now(), fps = 0, last = performance.now();
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now();
  const dt = (now - last) / 1000; last = now;
  ctx.clearRect(0, 0, innerWidth, innerHeight);

  if (feed.role === 'ghost') stepRain(dt, now);
  else if (feed.role === 'user') drawEcg();
  // idle：什么都不画 → 冻结（KD6）

  // fps 表
  frames++;
  if (now - fpsTime >= 1000) { fps = frames * 1000 / (now - fpsTime); frames = 0; fpsTime = now; }
  fpsEl.textContent = `${fps.toFixed(0)} fps`;
  stEl.textContent = `role=${feed.role}  rms=${feed.rms_db.toFixed(1)}dB`;
}
requestAnimationFrame(loop);

// ---- 控制条 ----
document.getElementById('ctl').addEventListener('click', (e) => {
  const role = e.target.dataset.role;
  if (role) setRole(role);
});

// 暴露给 playwright / 未来 node
window.bg = { setRole, feed };
</script>
</body>
</html>
