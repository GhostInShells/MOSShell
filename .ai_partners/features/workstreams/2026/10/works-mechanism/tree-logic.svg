<g data-addr="labels">
  <line x1="60" y1="560" x2="300" y2="560" stroke="#2a3642" stroke-width="1"/>
  <text x="60" y="552" fill="#3ddc8f" font-size="14">① 种子</text>
  <text x="60" y="580" fill="#aab6c2" font-size="12">本 feature：works-mechanism</text>
  <text x="60" y="600" fill="#6f7d8a" font-size="11.5">机制先由 feature 长出来，不是先写文档</text>

  <line x1="60" y1="630" x2="238" y2="616" stroke="#2a3642" stroke-width="1"/>
  <text x="60" y="644" fill="#f0b429" font-size="14">② 树根</text>
  <text x="60" y="666" fill="#aab6c2" font-size="12">skill：如何治理 project / ghost home 的 works</text>

  <text x="628" y="352" fill="#dfe9f2" font-size="14">③ 树干</text>
  <text x="628" y="374" fill="#aab6c2" font-size="12">两棵 works 空间，照树根搭</text>
  <text x="628" y="394" fill="#6f7d8a" font-size="11.5">GROUND.md 只声明机制，不列作品</text>

  <text x="628" y="446" fill="#dfe9f2" font-size="14">④ 树叶</text>
  <text x="628" y="468" fill="#aab6c2" font-size="12">一个作品 = 一份 WORK.md + 产物</text>
  <text x="628" y="488" fill="#6f7d8a" font-size="11.5">没有产物也能重做，才算合格</text>

  <rect x="628" y="512" width="300" height="112" rx="9" fill="#111820" stroke="#e0553f"/>
  <text x="646" y="536" fill="#e0553f" font-size="12.5">我曾经搞错的一句</text>
  <text x="646" y="558" fill="#aab6c2" font-size="11.5">「works 是机制 → 必须由 feature 长」</text>
  <text x="646" y="578" fill="#aab6c2" font-size="11.5">「单个 work 不是 → 不归 feature 管」</text>
  <text x="646" y="602" fill="#6f7d8a" font-size="11.5">把两层当一层，就会两头都错</text>
</g>
</svg>